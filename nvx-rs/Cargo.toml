[package]
name = "nvx"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.89"
description = "NVX's library of mechanisms and value types for OpenVMM microVMs: launch, snapshots and restores, verified connections, and the guest's side of capture and activation"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
keywords = ["sandbox", "microvm", "openvmm", "virtualization"]
categories = ["virtualization"]
publish = ["crates-io"]

[package.metadata.docs.rs]
features = ["cli", "testing", "guest"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[lib]
name = "nvx"

[features]
default = ["host"]
# The host side: artifact discovery, launch, network and filesystem lowering, control sessions,
# process and platform primitives, VMs in private directories that their callers own, and the
# sandbox launch profile, whose aggregate child names are SHA-256 digests.
host = [
    "serde",
    "dep:getrandom",
    "dep:serde_json",
    "dep:sha2",
    "dep:nix",
    "dep:windows-sys",
]
# NVX's own `nvx-fake-openvmm` binary, a fake OpenVMM for tests. It adds no API.
testing = ["dep:getrandom", "dep:serde", "dep:serde_json", "dep:nix", "dep:windows-sys"]
# NVX's own `nvx-rs` binary, the command-line interface that runs NVX's microVMs and sandboxes,
# compiles egress policies, looks up artifacts, and downloads releases. It adds no API.
cli = ["host", "dep:crossterm"]
# The serde form of `net::Ipv4Cidr`. The `host` feature enables it.
serde = ["dep:serde"]
# The programs that run in Linux guests: the `guest` module and the `nvx-*` guest binaries. Build
# them with `--no-default-features --features guest` and the `guest` profile; see README.md.
guest = ["dep:nix", "dep:getrandom"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"], optional = true }
getrandom = { version = "0.4", optional = true }
serde = { version = "1.0.200", features = ["derive"], optional = true }
serde_json = { version = "1.0.120", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# The host and the fake OpenVMM also build on Unix hosts other than Linux, such as macOS.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, optional = true, features = [
    "fs",
    "ioctl",
    "mman",
    "mount",
    "net",
    "poll",
    "process",
    "sched",
    "signal",
    "socket",
    "term",
    "time",
    "uio",
    "user",
] }

[dev-dependencies]
# The property tests of the protocol's codecs, which need none of the forking and timeouts of its
# default features.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.120"
tempfile = "3.10"

# The job objects, process security descriptors, handles, and process lists of the process
# supervision and CLI tests, and the command-line splitting and file deletions of the CLI tests.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[[bin]]
name = "nvx-fake-openvmm"
path = "src/bin/nvx-fake-openvmm.rs"
required-features = ["testing"]
doc = false

[[bin]]
name = "nvx-rs"
path = "src/bin/nvx-rs.rs"
required-features = ["cli"]
doc = false

[[example]]
name = "external-launch"
path = "examples/external-launch.rs"
required-features = ["host"]

# Compile-only examples of the documented host and guest workflows, which nothing runs.
[[example]]
name = "host-workflows"
path = "examples/host-workflows.rs"
required-features = ["host"]

[[example]]
name = "guest-workflows"
path = "examples/guest-workflows.rs"
required-features = ["guest"]

# The guest binaries. Their unit tests live in the library, so the binaries have no test harness.
[[bin]]
name = "nvx-console-pending"
path = "src/bin/nvx-console-pending.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-mmio-write"
path = "src/bin/nvx-mmio-write.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-reseed"
path = "src/bin/nvx-reseed.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-exit"
path = "src/bin/nvx-exit.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-device-io"
path = "src/bin/nvx-device-io.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-managed-agent"
path = "src/bin/nvx-managed-agent.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-ingress"
path = "src/bin/nvx-ingress.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-time"
path = "src/bin/nvx-time.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-time-probe"
path = "src/bin/nvx-time-probe.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-init"
path = "src/bin/nvx-init.rs"
required-features = ["guest"]
doc = false
test = false

# The guest binaries: small, static, and stripped.
[profile.guest]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
