# Canonical versions, artifacts, and SHA-256 checksums of the tools that the
# NVX setup scripts install. setup-linux-runner.sh, setup-linux-mshv.sh,
# setup-windows-whp.ps1, and the Specula runner setup read this file as data
# and never source or evaluate it, so none of them repeats its pins. Stage it
# next to a setup script that runs outside a checkout; README.md describes
# how to upgrade a tool.
#
# Each line is blank, a comment that starts with #, or KEY=VALUE without
# spaces. TOOL.version and TOOL.toolchain are exact MAJOR.MINOR.PATCH
# releases. TOOL.artifacts.PLATFORM.name names a download relative to the
# tool's release, with {version} standing for TOOL.version, and
# TOOL.artifacts.PLATFORM.sha256 is its lowercase SHA-256 digest. PLATFORM is
# linux-x86_64 or windows-x86_64. Setup rejects a missing, malformed, or
# incomplete manifest before it changes the host.

# Equal to the channel in rust-toolchain.toml, which rustup reads.
rust.toolchain=1.95.0

rustup.version=1.29.1
rustup.artifacts.linux-x86_64.name=x86_64-unknown-linux-gnu/rustup-init
rustup.artifacts.linux-x86_64.sha256=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
rustup.artifacts.windows-x86_64.name=x86_64-pc-windows-msvc/rustup-init.exe
rustup.artifacts.windows-x86_64.sha256=6f4bef66261261fcb43131be8720bab817d403a09edec7455c371974b90bdb7e

# Setup builds cargo-nextest with cargo install, so it has no artifacts.
cargo_nextest.version=0.9.133

sccache.version=0.18.0
sccache.artifacts.linux-x86_64.name=sccache-v{version}-x86_64-unknown-linux-musl.tar.gz
sccache.artifacts.linux-x86_64.sha256=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
sccache.artifacts.windows-x86_64.name=sccache-v{version}-x86_64-pc-windows-msvc.tar.gz
sccache.artifacts.windows-x86_64.sha256=1a63c1be2beab3f04d27e4cc145443e092e02d3dd83a51030989829d7023091b

actions_runner.version=2.337.0
actions_runner.artifacts.linux-x86_64.name=actions-runner-linux-x64-{version}.tar.gz
actions_runner.artifacts.linux-x86_64.sha256=70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
actions_runner.artifacts.windows-x86_64.name=actions-runner-win-x64-{version}.zip
