# Canonical versions, artifacts, and SHA-256 checksums of the tools that the
# NVX setup scripts install. setup-linux.sh, setup-windows-whp.ps1, and the
# Specula runner setup read this file as data and never source or evaluate
# it, so none of them repeats its pins. Stage it next to a setup script that
# runs outside a checkout; README.md describes how to upgrade a tool.
#
# Each line is blank, a comment that starts with #, or KEY=VALUE without
# spaces. TOOL.version and TOOL.toolchain are exact MAJOR.MINOR.PATCH
# releases. TOOL.artifacts.PLATFORM.name names a download relative to the
# tool's release, with {version} standing for TOOL.version, and
# TOOL.artifacts.PLATFORM.sha256 is its lowercase SHA-256 digest. PLATFORM is
# linux-x86_64, windows-x86_64 or windows-aarch64. Setup rejects a missing,
# malformed or incomplete manifest before it changes the host.

# Equal to the channel in rust-toolchain.toml, which rustup reads.
rust.toolchain=1.97.1

rustup.version=1.29.1
rustup.artifacts.linux-x86_64.name=x86_64-unknown-linux-gnu/rustup-init
rustup.artifacts.linux-x86_64.sha256=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
rustup.artifacts.windows-x86_64.name=x86_64-pc-windows-msvc/rustup-init.exe
rustup.artifacts.windows-x86_64.sha256=6f4bef66261261fcb43131be8720bab817d403a09edec7455c371974b90bdb7e
rustup.artifacts.windows-aarch64.name=aarch64-pc-windows-msvc/rustup-init.exe
rustup.artifacts.windows-aarch64.sha256=01aa49cf9574a8bd0ae52005d7de2590e8f27181ded6748236e702c92aef826d

# Setup builds cargo-nextest and cargo-llvm-cov with cargo install, so they
# have no artifacts. cargo-llvm-cov measures coverage with the llvm-tools
# component of the pinned Rust release, which setup adds to it.
cargo_nextest.version=0.9.133
cargo_llvm_cov.version=0.9.1

