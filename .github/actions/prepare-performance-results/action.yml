name: Prepare performance results
description: Download platform benchmarks and collect their p50 results

runs:
  using: composite
  steps:
    - name: Download Linux / KVM benchmark results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-linux-kvm-${{ github.run_id }}
        path: performance-input/linux-kvm

    - name: Download Linux / MSHV benchmark results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-linux-mshv-${{ github.run_id }}
        path: performance-input/linux-mshv

    - name: Download Windows / WHP benchmark results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-windows-whp-${{ github.run_id }}
        path: performance-input/windows-whp

    - name: Collect p50 results
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/nvx.py performance collect-openvmm \
          --platform linux-kvm \
          --commit "${GITHUB_SHA}" \
          --input performance-input/linux-kvm/linux-kvm.json \
          --output-dir performance-results
        python3 scripts/nvx.py performance collect-openvmm \
          --platform linux-mshv \
          --commit "${GITHUB_SHA}" \
          --input performance-input/linux-mshv/linux-mshv.json \
          --output-dir performance-results
        python3 scripts/nvx.py performance collect-openvmm \
          --platform windows-whp \
          --commit "${GITHUB_SHA}" \
          --input performance-input/windows-whp/windows-whp.json \
          --output-dir performance-results
