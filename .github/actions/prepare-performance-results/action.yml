name: Prepare performance results
description: Restore host-typed benchmark series and collect their p50 results

runs:
  using: composite
  steps:
    - name: Prepare benchmark cache tools
      id: benchmark-cache-tools
      shell: bash
      run: |
        set -euo pipefail
        cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
        mkdir -p "${cache_tools}"
        ln -sf "$(command -v tar)" "${cache_tools}/tar"
        ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
        echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

    - name: Restore Linux / KVM / bare metal benchmark results
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.benchmark-cache-tools.outputs.path }}
      with:
        path: data/runs/linux-kvm-baremetal
        key: benchmark-linux-kvm-baremetal-${{ github.run_id }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Linux / MSHV / bare metal benchmark results
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.benchmark-cache-tools.outputs.path }}
      with:
        path: data/runs/linux-mshv-baremetal
        key: benchmark-linux-mshv-baremetal-${{ github.run_id }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Linux / MSHV / virtual machine benchmark results
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.benchmark-cache-tools.outputs.path }}
      with:
        path: data/runs/linux-mshv-virtual-machine
        key: benchmark-linux-mshv-virtual-machine-${{ github.run_id }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Windows / WHP / bare metal benchmark results
      uses: actions/cache/restore@v5
      with:
        path: data/runs/windows-whp-baremetal
        key: benchmark-windows-whp-baremetal-${{ github.run_id }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Windows / WHP / virtual machine benchmark results
      uses: actions/cache/restore@v5
      with:
        path: data/runs/windows-whp-virtual-machine
        key: benchmark-windows-whp-virtual-machine-${{ github.run_id }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Collect p50 results
      shell: bash
      run: |
        set -euo pipefail
        for platform in \
          linux-kvm-baremetal \
          linux-mshv-baremetal \
          linux-mshv-virtual-machine \
          windows-whp-baremetal \
          windows-whp-virtual-machine; do
            python3 scripts/nvx.py performance collect \
              --platform "${platform}" \
              --commit "${GITHUB_SHA}" \
              --input-dir "data/runs/${platform}" \
              --output-dir data/results \
              --require-network \
              --require-shell-snapshot \
              --require-shared-suite \
              --lifecycle-input "data/runs/${platform}/acceptance.json"
        done
