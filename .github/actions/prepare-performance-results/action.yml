name: Prepare performance results
description: Restore host-typed benchmark series and collect their p50 results

runs:
  using: composite
  steps:
    - name: Prepare benchmark cache tools
      id: benchmark-cache-tools
      shell: bash
      run: |
        set -euo pipefail
        cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
        mkdir -p "${cache_tools}"
        ln -sf "$(command -v tar)" "${cache_tools}/tar"
        ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
        echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

    - name: Restore Linux / KVM / virtual machine benchmark results
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.benchmark-cache-tools.outputs.path }}
      with:
        path: data/runs/linux-kvm-virtual-machine
        key: benchmark-linux-kvm-virtual-machine-microvm-v2-1-full-2-4-8-shell-restore-512-device-io-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: benchmark-linux-kvm-virtual-machine-microvm-v2-1-full-2-4-8-shell-restore-512-device-io-${{ github.run_id }}-
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Linux / MSHV / virtual machine benchmark results
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.benchmark-cache-tools.outputs.path }}
      with:
        path: data/runs/linux-mshv-virtual-machine
        key: benchmark-linux-mshv-virtual-machine-microvm-v2-1-full-2-4-8-shell-restore-512-device-io-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: benchmark-linux-mshv-virtual-machine-microvm-v2-1-full-2-4-8-shell-restore-512-device-io-${{ github.run_id }}-
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Windows / WHP / virtual machine benchmark results
      uses: actions/cache/restore@v5
      with:
        path: data/runs/windows-whp-virtual-machine
        key: benchmark-windows-whp-virtual-machine-microvm-v2-1-full-2-4-8-shell-restore-512-device-io-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: benchmark-windows-whp-virtual-machine-microvm-v2-1-full-2-4-8-shell-restore-512-device-io-${{ github.run_id }}-
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Collect p50 results
      shell: bash
      run: |
        set -euo pipefail
        for platform in \
          linux-kvm-virtual-machine \
          linux-mshv-virtual-machine \
          windows-whp-virtual-machine; do
          run_dir="data/runs/${platform}/microvm-v2/1vcpu"
          python3 scripts/nvx.py performance collect \
            --platform "${platform}" \
            --commit "${GITHUB_SHA}" \
            --input-dir "${run_dir}" \
            --output-dir data/results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite \
            --lifecycle-input "${run_dir}/acceptance.json"
          device_run_dir="${run_dir}/device-io"
          device_results_dir="${RUNNER_TEMP}/nvx-device-results/${platform}"
          python3 scripts/nvx.py performance collect \
            --platform "${platform}" \
            --commit "${GITHUB_SHA}" \
            --input-dir "${device_run_dir}" \
            --output-dir "${device_results_dir}"
          python3 scripts/nvx.py performance persist \
            --source-dir "${device_results_dir}" \
            --history-dir data/results
          for processors in 2 4 8; do
            run_dir="data/runs/${platform}/microvm-v2/${processors}vcpu"
            python3 scripts/nvx.py performance collect \
              --platform "${platform}" \
              --commit "${GITHUB_SHA}" \
              --input-dir "${run_dir}" \
              --output-dir data/results \
              --require-shell-snapshot-restore-512
          done
        done
