name: Run benchmark
description: Run and publish an OpenVMM performance series

inputs:
  backend:
    description: OpenVMM backend to benchmark
    required: true
  platform:
    description: Host-typed performance series name used for results and artifacts
    required: true
  kernel-cache-key:
    description: Exact Linux kernel cache key produced by the build job
    required: true
  alpine-cache-key:
    description: Exact Alpine cache key produced by the build job
    required: true
  teardown-mode:
    description: How to stop OpenVMM after each guest readiness marker
    required: false
    default: guest-exit
  cpus:
    description: Optional fixed logical CPU affinity set
    required: false
    default: ""
  host-cpu-reserve:
    description: Affinity CPUs reserved for VMM and device work
    required: false
    default: "2"
  marker-timeout:
    description: Seconds allowed for each guest benchmark marker
    required: false
    default: "10"
runs:
  using: composite
  steps:
    - name: Prepare Linux cache tools
      id: cache-tools-linux
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
        mkdir -p "${cache_tools}"
        ln -sf "$(command -v tar)" "${cache_tools}/tar"
        ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
        echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

    - name: Prepare Windows cache tools
      id: cache-tools-windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $Tar = (Get-Command tar.exe -ErrorAction Stop).Source
        $Gzip = Join-Path (Split-Path -Parent $Tar) "gzip.exe"
        if (-not (Test-Path $Gzip -PathType Leaf)) {
            throw "gzip.exe not found beside GNU tar: $Gzip"
        }
        "path=$(Split-Path -Parent $Tar)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore Linux kernel
      if: inputs.backend != 'mshv'
      uses: actions/cache/restore@v5
      with:
        path: |
          build/vmlinux
          build/vmlinux.config
        key: ${{ inputs.kernel-cache-key }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Linux kernel for MSHV
      if: inputs.backend == 'mshv'
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.cache-tools-linux.outputs.path }}
      with:
        path: |
          build/vmlinux
          build/vmlinux.config
        key: ${{ inputs.kernel-cache-key }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Alpine disk image
      if: inputs.backend != 'mshv'
      uses: actions/cache/restore@v5
      with:
        path: |
          build/initramfs.cpio.gz
          build/initramfs.cpio.gz.packages.json
        key: ${{ inputs.alpine-cache-key }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Restore Alpine disk image for MSHV
      if: inputs.backend == 'mshv'
      uses: actions/cache/restore@v5
      env:
        PATH: ${{ steps.cache-tools-linux.outputs.path }}
      with:
        path: |
          build/initramfs.cpio.gz
          build/initramfs.cpio.gz.packages.json
        key: ${{ inputs.alpine-cache-key }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Run Linux acceptance test
      if: runner.os != 'Windows'
      shell: bash
      env:
        NVX_BENCHMARK_CPUS: ${{ inputs.cpus }}
        NVX_BENCHMARK_HOST_CPU_RESERVE: ${{ inputs.host-cpu-reserve }}
        NVX_BENCHMARK_MARKER_TIMEOUT: ${{ inputs.marker-timeout }}
      run: |
        set -euo pipefail
        cpu_args=(--host-cpu-reserve "${NVX_BENCHMARK_HOST_CPU_RESERVE}")
        if [[ -n "${NVX_BENCHMARK_CPUS}" ]]; then
          cpu_args+=(--cpus "${NVX_BENCHMARK_CPUS}")
        fi
        for processors in 1 2 4 8; do
          run_dir="data/runs/${{ inputs.platform }}/microvm-v3/${processors}vcpu"
          python3 scripts/nvx.py benchmark \
            --suite e2e \
            --backend "${{ inputs.backend }}" \
            --platform "${{ inputs.platform }}" \
            --processors "${processors}" \
            "${cpu_args[@]}" \
            --warmups 1 \
            --runs 3 \
            --timeout "${NVX_BENCHMARK_MARKER_TIMEOUT}" \
            --skip-build \
            --teardown-mode "${{ inputs.teardown-mode }}" \
            --output "${run_dir}/acceptance.json"
        done

    - name: Run Linux performance suite
      if: runner.os != 'Windows'
      shell: bash
      env:
        NVX_BENCHMARK_CPUS: ${{ inputs.cpus }}
        NVX_BENCHMARK_HOST_CPU_RESERVE: ${{ inputs.host-cpu-reserve }}
        NVX_BENCHMARK_MARKER_TIMEOUT: ${{ inputs.marker-timeout }}
      run: |
        set -euo pipefail
        cpu_args=(--host-cpu-reserve "${NVX_BENCHMARK_HOST_CPU_RESERVE}")
        if [[ -n "${NVX_BENCHMARK_CPUS}" ]]; then
          cpu_args+=(--cpus "${NVX_BENCHMARK_CPUS}")
        fi
        for processors in 1 2 4 8; do
          run_dir="data/runs/${{ inputs.platform }}/microvm-v3/${processors}vcpu"
          python3 scripts/nvx.py benchmark \
            --suite performance \
            --backend "${{ inputs.backend }}" \
            --platform "${{ inputs.platform }}" \
            --processors "${processors}" \
            "${cpu_args[@]}" \
            --warmups 1 \
            --runs 5 \
            --virtfs-runs 3 \
            --timeout "${NVX_BENCHMARK_MARKER_TIMEOUT}" \
            --skip-build \
            --teardown-mode "${{ inputs.teardown-mode }}" \
            --output-dir "${run_dir}"
        done

    - name: Run Windows acceptance test
      if: runner.os == 'Windows'
      shell: powershell
      env:
        NVX_BENCHMARK_CPUS: ${{ inputs.cpus }}
        NVX_BENCHMARK_HOST_CPU_RESERVE: ${{ inputs.host-cpu-reserve }}
        NVX_BENCHMARK_MARKER_TIMEOUT: ${{ inputs.marker-timeout }}
      run: |
        $ErrorActionPreference = "Stop"
        $CpuArgs = @("--host-cpu-reserve", $env:NVX_BENCHMARK_HOST_CPU_RESERVE)
        if ($env:NVX_BENCHMARK_CPUS) {
          $CpuArgs += @("--cpus", $env:NVX_BENCHMARK_CPUS)
        }
        foreach ($Processors in 1, 2, 4, 8) {
          $RunDir = "data/runs/${{ inputs.platform }}/microvm-v3/${Processors}vcpu"
          python scripts\nvx.py benchmark `
            --suite e2e `
            --backend "${{ inputs.backend }}" `
            --platform "${{ inputs.platform }}" `
            --processors $Processors `
            --warmups 1 `
            --runs 3 `
            --timeout $env:NVX_BENCHMARK_MARKER_TIMEOUT `
            --skip-build `
            --teardown-mode "${{ inputs.teardown-mode }}" `
            --output "$RunDir/acceptance.json" `
            @CpuArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Run Windows performance suite
      if: runner.os == 'Windows'
      shell: powershell
      env:
        NVX_BENCHMARK_CPUS: ${{ inputs.cpus }}
        NVX_BENCHMARK_HOST_CPU_RESERVE: ${{ inputs.host-cpu-reserve }}
        NVX_BENCHMARK_MARKER_TIMEOUT: ${{ inputs.marker-timeout }}
      run: |
        $ErrorActionPreference = "Stop"
        $CpuArgs = @("--host-cpu-reserve", $env:NVX_BENCHMARK_HOST_CPU_RESERVE)
        if ($env:NVX_BENCHMARK_CPUS) {
          $CpuArgs += @("--cpus", $env:NVX_BENCHMARK_CPUS)
        }
        foreach ($Processors in 1, 2, 4, 8) {
          $RunDir = "data/runs/${{ inputs.platform }}/microvm-v3/${Processors}vcpu"
          python scripts\nvx.py benchmark `
            --suite performance `
            --backend "${{ inputs.backend }}" `
            --platform "${{ inputs.platform }}" `
            --processors $Processors `
            --warmups 1 `
            --runs 5 `
            --virtfs-runs 3 `
            --timeout $env:NVX_BENCHMARK_MARKER_TIMEOUT `
            --skip-build `
            --teardown-mode "${{ inputs.teardown-mode }}" `
            --output-dir "$RunDir" `
            @CpuArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Publish Linux performance results
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        for processors in 1 2 4 8; do
          run_dir="data/runs/${{ inputs.platform }}/microvm-v3/${processors}vcpu"
          python3 scripts/nvx.py performance collect \
            --platform "${{ inputs.platform }}" \
            --commit "${GITHUB_SHA}" \
            --input-dir "${run_dir}" \
            --output-dir "${run_dir}" \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite \
            --lifecycle-input "${run_dir}/acceptance.json" \
            --summary "${GITHUB_STEP_SUMMARY}"
        done

    - name: Publish Windows performance results
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($Processors in 1, 2, 4, 8) {
          $RunDir = "data/runs/${{ inputs.platform }}/microvm-v3/${Processors}vcpu"
          python scripts\nvx.py performance collect `
            --platform "${{ inputs.platform }}" `
            --commit $env:GITHUB_SHA `
            --input-dir $RunDir `
            --output-dir $RunDir `
            --require-network `
            --require-shell-snapshot `
            --require-shared-suite `
            --lifecycle-input "$RunDir/acceptance.json" `
            --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Verify complete Linux benchmark matrix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        for processors in 1 2 4 8; do
          result="data/runs/${{ inputs.platform }}/microvm-v3/${processors}vcpu/${{ inputs.platform }}-microvm-v3-${processors}vcpu.csv"
          test -s "${result}" || {
            echo "::error::Missing benchmark result ${result}"
            exit 1
          }
        done

    - name: Verify complete Windows benchmark matrix
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($Processors in 1, 2, 4, 8) {
          $Result = "data/runs/${{ inputs.platform }}/microvm-v3/${Processors}vcpu/${{ inputs.platform }}-microvm-v3-${Processors}vcpu.csv"
          if (-not (Test-Path $Result -PathType Leaf) -or (Get-Item $Result).Length -eq 0) {
            throw "Missing benchmark result $Result"
          }
        }

    - name: Save benchmark results
      uses: actions/cache/save@v5
      env:
        PATH: ${{ steps.cache-tools-linux.outputs.path || steps.cache-tools-windows.outputs.path }}
      with:
        path: data/runs/${{ inputs.platform }}
        key: benchmark-${{ inputs.platform }}-microvm-v3-1-2-4-8-${{ github.run_id }}-${{ github.run_attempt }}
        enableCrossOsArchive: true
