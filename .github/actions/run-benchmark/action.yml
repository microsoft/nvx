name: Run benchmark
description: Run and publish an OpenVMM acceptance benchmark

inputs:
  backend:
    description: OpenVMM backend to benchmark
    required: true
  platform:
    description: Platform name used for results and artifacts
    required: true
  teardown-mode:
    description: How to stop OpenVMM after each guest readiness marker
    required: false
    default: guest-exit

runs:
  using: composite
  steps:
    - name: Download guest artifacts
      uses: actions/download-artifact@v4
      with:
        name: guest-artifacts-${{ github.run_id }}
        path: build

    - name: Run Linux acceptance test
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        python3 scripts/nvx.py benchmark
        --suite e2e
        --backend "${{ inputs.backend }}"
        --warmups 1
        --runs 3
        --skip-build
        --teardown-mode "${{ inputs.teardown-mode }}"
        --output "build/benchmarks/${{ inputs.platform }}/acceptance.json"

    - name: Run Linux performance suite
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        python3 scripts/nvx.py benchmark
        --suite performance
        --backend "${{ inputs.backend }}"
        --warmups 1
        --runs 5
        --virtfs-runs 3
        --skip-build
        --teardown-mode "${{ inputs.teardown-mode }}"
        --output-dir "build/benchmarks/${{ inputs.platform }}"

    - name: Run Windows acceptance test
      if: runner.os == 'Windows'
      shell: powershell
      run: >-
        python scripts\nvx.py benchmark
        --suite e2e
        --backend "${{ inputs.backend }}"
        --warmups 1
        --runs 3
        --skip-build
        --teardown-mode "${{ inputs.teardown-mode }}"
        --output "build/benchmarks/${{ inputs.platform }}/acceptance.json"

    - name: Run Windows performance suite
      if: runner.os == 'Windows'
      shell: powershell
      run: >-
        python scripts\nvx.py benchmark
        --suite performance
        --backend "${{ inputs.backend }}"
        --warmups 1
        --runs 5
        --virtfs-runs 3
        --skip-build
        --teardown-mode "${{ inputs.teardown-mode }}"
        --output-dir "build/benchmarks/${{ inputs.platform }}"

    - name: Publish Linux performance results
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        python3 scripts/nvx.py performance collect
        --platform "${{ inputs.platform }}"
        --commit "${GITHUB_SHA}"
        --input-dir "build/benchmarks/${{ inputs.platform }}"
        --output-dir "build/benchmarks/${{ inputs.platform }}"
        --require-shell-snapshot
        --require-shared-suite
        --summary "${GITHUB_STEP_SUMMARY}"

    - name: Publish Windows performance results
      if: runner.os == 'Windows'
      shell: powershell
      run: >-
        python scripts\nvx.py performance collect
        --platform "${{ inputs.platform }}"
        --commit $env:GITHUB_SHA
        --input-dir "build/benchmarks/${{ inputs.platform }}"
        --output-dir "build/benchmarks/${{ inputs.platform }}"
        --require-network
        --require-shell-snapshot
        --require-shared-suite
        --summary $env:GITHUB_STEP_SUMMARY

    - name: Upload benchmark results
      if: always() && hashFiles(format('build/benchmarks/{0}/{0}.csv', inputs.platform)) != ''
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-${{ inputs.platform }}-${{ github.run_id }}
        path: build/benchmarks/${{ inputs.platform }}
        if-no-files-found: error
        overwrite: true
