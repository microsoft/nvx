name: Package release
description: Build and cache an NVX binary release for one platform

inputs:
  platform:
    description: Platform suffix used in the package name and cache key
    required: true
  cache-compression:
    description: Compression tool used by the cross-OS Actions cache
    required: false
    default: zstd

runs:
  using: composite
  steps:
    - name: Package Linux release
      if: runner.os != 'Windows'
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        version="$(cat VERSION)"
        package="nvx-${version}-${PLATFORM}"
        python3 scripts/nvx.py package \
          --version "${version}" \
          --destination "dist/${package}" \
          --binary-only
        tar -czf "dist/${package}.tar.gz" -C dist "${package}"

    - name: Package Windows release
      if: runner.os == 'Windows'
      shell: powershell
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        $Version = (Get-Content VERSION -Raw).Trim()
        $Package = "nvx-$Version-$env:PLATFORM"
        python scripts\nvx.py package `
          --version $Version `
          --destination "dist\$Package" `
          --binary-only
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Compress-Archive `
          -Path "dist\$Package" `
          -DestinationPath "dist\$Package.zip"

    - name: Prepare gzip cache tools
      id: gzip-cache-tools
      if: runner.os != 'Windows' && inputs.cache-compression == 'gzip'
      shell: bash
      run: |
        set -euo pipefail
        cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
        mkdir -p "${cache_tools}"
        ln -sf "$(command -v tar)" "${cache_tools}/tar"
        ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
        echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

    - name: Save Linux release (zstd)
      if: runner.os != 'Windows' && inputs.cache-compression != 'gzip'
      uses: actions/cache/save@v5
      with:
        path: dist/*.tar.gz
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true

    - name: Save Linux release (gzip)
      if: runner.os != 'Windows' && inputs.cache-compression == 'gzip'
      uses: actions/cache/save@v5
      env:
        PATH: ${{ steps.gzip-cache-tools.outputs.path }}
      with:
        path: dist/*.tar.gz
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true

    - name: Save Windows release
      if: runner.os == 'Windows'
      uses: actions/cache/save@v5
      with:
        path: dist/*.zip
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true
