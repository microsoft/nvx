name: Package release
description: Build and cache a simple NVX binary release for one platform

inputs:
  platform:
    description: Platform suffix used in the package name and cache key
    required: true
  cache-compression:
    description: Compression tool used by the cross-OS Actions cache
    required: false
    default: zstd

runs:
  using: composite
  steps:
    - name: Package Linux release
      if: runner.os != 'Windows'
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        version="$(cat VERSION)"
        simple_package="nvx-${version}-${PLATFORM}-simple"
        python3 scripts/nvx.py package \
          --version "${version}" \
          --destination "dist/${simple_package}" \
          --transport simple \
          --binary-only
        python3 scripts/nvx.py archive-release \
          --bundle "dist/${simple_package}" \
          --output "dist/${simple_package}.tar.gz"

    - name: Package Windows release
      if: runner.os == 'Windows'
      shell: powershell
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        $Version = (Get-Content VERSION -Raw).Trim()
        $SimplePackage = "nvx-$Version-$env:PLATFORM-simple"
        python scripts\nvx.py package `
          --version $Version `
          --destination "dist\$SimplePackage" `
          --transport simple `
          --binary-only
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts\nvx.py archive-release `
          --bundle "dist\$SimplePackage" `
          --output "dist\$SimplePackage.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Prepare gzip cache tools
      id: gzip-cache-tools
      if: runner.os != 'Windows' && inputs.cache-compression == 'gzip'
      shell: bash
      run: |
        set -euo pipefail
        cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
        mkdir -p "${cache_tools}"
        ln -sf "$(command -v tar)" "${cache_tools}/tar"
        ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
        echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

    - name: Save Linux release (zstd)
      if: runner.os != 'Windows' && inputs.cache-compression != 'gzip'
      uses: actions/cache/save@v5
      with:
        path: |
          dist/*-simple.tar.gz
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true

    - name: Save Linux release (gzip)
      if: runner.os != 'Windows' && inputs.cache-compression == 'gzip'
      uses: actions/cache/save@v5
      env:
        PATH: ${{ steps.gzip-cache-tools.outputs.path }}
      with:
        path: |
          dist/*-simple.tar.gz
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true
    - name: Save Windows release
      if: runner.os == 'Windows'
      uses: actions/cache/save@v5
      with:
        path: |
          dist/*-simple.zip
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true
