name: Package release
description: Build and cache a legacy NVX binary release for one platform

inputs:
  platform:
    description: Platform suffix used in the package name and cache key
    required: true
  cache-compression:
    description: Compression tool used by the cross-OS Actions cache
    required: false
    default: zstd

runs:
  using: composite
  steps:
    - name: Package Linux release
      if: runner.os != 'Windows'
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        version="$(cat VERSION)"
        legacy_package="nvx-${version}-${PLATFORM}-legacy"
        python3 scripts/nvx.py package \
          --version "${version}" \
          --destination "dist/${legacy_package}" \
          --transport legacy \
          --binary-only
        python3 scripts/nvx.py archive-release \
          --bundle "dist/${legacy_package}" \
          --output "dist/${legacy_package}.tar.gz"

    - name: Package Windows release
      if: runner.os == 'Windows'
      shell: powershell
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        $Version = (Get-Content VERSION -Raw).Trim()
        $LegacyPackage = "nvx-$Version-$env:PLATFORM-legacy"
        python scripts\nvx.py package `
          --version $Version `
          --destination "dist\$LegacyPackage" `
          --transport legacy `
          --binary-only
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts\nvx.py archive-release `
          --bundle "dist\$LegacyPackage" `
          --output "dist\$LegacyPackage.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Prepare gzip cache tools
      id: gzip-cache-tools
      if: runner.os != 'Windows' && inputs.cache-compression == 'gzip'
      shell: bash
      run: |
        set -euo pipefail
        cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
        mkdir -p "${cache_tools}"
        ln -sf "$(command -v tar)" "${cache_tools}/tar"
        ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
        echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

    - name: Save Linux release (zstd)
      if: runner.os != 'Windows' && inputs.cache-compression != 'gzip'
      uses: actions/cache/save@v5
      with:
        path: |
          dist/*-legacy.tar.gz
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true

    - name: Save Linux release (gzip)
      if: runner.os != 'Windows' && inputs.cache-compression == 'gzip'
      uses: actions/cache/save@v5
      env:
        PATH: ${{ steps.gzip-cache-tools.outputs.path }}
      with:
        path: |
          dist/*-legacy.tar.gz
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true

    - name: Save Windows release
      if: runner.os == 'Windows'
      uses: actions/cache/save@v5
      with:
        path: |
          dist/*-legacy.zip
        key: release-${{ inputs.platform }}-${{ github.run_id }}
        enableCrossOsArchive: true
