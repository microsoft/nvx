name: Package release
description: Build and upload an NVX binary release for one platform

inputs:
  platform:
    description: Platform suffix used in the package and artifact names
    required: true
  nvx-rs-artifact:
    description: Base name of the nvx-rs artifacts for the runner's OS
    required: true

runs:
  using: composite
  steps:
    # Every package ships the nvx-rs that the NVX CLI job of its OS built and
    # tested, with its provenance, which nvx.py download installs where
    # nvx.py looks for them.
    - name: Download nvx-rs executable
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.nvx-rs-artifact }}-executable
        path: nvx-rs/target/release

    - name: Download nvx-rs provenance
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.nvx-rs-artifact }}-provenance
        path: build

    - name: Make nvx-rs executable
      if: runner.os != 'Windows'
      shell: bash
      run: chmod +x nvx-rs/target/release/nvx-rs

    - name: Rematerialize canonical kernel inputs
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        python scripts\nvx.py materialize-kernel-provenance-inputs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Package Linux release
      if: runner.os != 'Windows'
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        version="$(cat VERSION)"
        package="nvx-${version}-${PLATFORM}"
        python3 scripts/nvx.py package \
          --version "${version}" \
          --destination "dist/${package}" \
          --binary-only
        python3 scripts/nvx.py archive-release \
          --source "dist/${package}" \
          --destination "dist/${package}.tar.gz"

    - name: Package Windows release
      if: runner.os == 'Windows'
      shell: powershell
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        $Version = (Get-Content VERSION -Raw).Trim()
        $Package = "nvx-$Version-$env:PLATFORM"
        python scripts\nvx.py package `
          --version $Version `
          --destination "dist\$Package" `
          --binary-only
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts\nvx.py archive-release `
          --source "dist\$Package" `
          --destination "dist\$Package.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Linux release
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.platform }}
        path: dist/*.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Upload Windows release
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.platform }}
        path: dist/*.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
