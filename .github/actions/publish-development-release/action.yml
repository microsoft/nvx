name: Publish development release
description: Download platform packages and publish an NVX development prerelease

runs:
  using: composite
  steps:
    - name: Download Linux / KVM release
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-linux-kvm
        path: dist

    - name: Download Linux / MSHV release
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-linux-mshv
        path: dist

    - name: Download Windows / WHP release
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-windows-whp
        path: dist

    - name: Download Windows ARM64 / WHP release
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-windows-whp-aarch64
        path: dist

    - name: Require ARM64 in the development release inventory
      shell: python3 {0}
      run: |
        import sys
        from pathlib import Path

        sys.path.insert(0, "scripts")
        from publish_development_release import release_packages

        version = Path("VERSION").read_text(encoding="ascii").strip()
        packages = release_packages(Path("dist"), version)
        if "windows-whp-aarch64" not in packages:
            raise SystemExit("The development release inventory must include native ARM64 WHP")

    - name: Publish GitHub prerelease
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 -u scripts/publish_development_release.py
