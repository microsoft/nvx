name: Build ARM64 guest artifacts
description: Cache or build native AArch64 kernels, Alpine, and Ubuntu guests

inputs:
  ssh-key:
    description: Optional OpenVMM deploy key for trusted caller contexts
    required: false
    default: ""
  save-cache:
    description: Save newly built artifacts only when the caller permits it
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Verify native Linux ARM64 producer
      shell: bash
      env:
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        test "$(uname -s)" = Linux
        test "$(uname -m)" = aarch64
        test "${RUNNER_ARCH}" = ARM64

    # This producer uses the same pinned Debian/Rust image as the guest Docker
    # build, but invokes the maintained architecture-aware native producers.
    - name: Install native guest prerequisites
      shell: bash
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends \
          bc binutils bison build-essential ca-certificates cpio curl \
          e2fsprogs erofs-utils=1.5-1 flex git gzip libelf-dev libssl-dev openssh-client \
          patch python3 rsync tar xz-utils zstd

    - name: Checkout OpenVMM
      uses: ./.github/actions/checkout-openvmm
      with:
        ssh-key: ${{ inputs.ssh-key }}

    - name: Verify source and install Rust
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/nvx.py verify
        toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
        test -n "${toolchain}"
        rustup toolchain install "${toolchain}" --profile minimal --no-self-update \
          --target aarch64-unknown-linux-musl

    - name: Resolve ARM guest cache identity
      id: identity
      shell: python3 {0}
      run: |
        import hashlib
        import os
        from pathlib import Path

        digest = hashlib.sha256(b"nvx-guest-artifacts-aarch64-v1\0")
        files = {Path("SOURCE-MANIFEST.json"), Path("rust-toolchain.toml"), Path(".dockerignore")}
        for directory in ("kernel", "guest", "ubuntu", "docker", "scripts/nvx_tools", "nvx/src"):
            files.update(path for path in Path(directory).rglob("*") if path.is_file() and "__pycache__" not in path.parts)
        files.update((Path("nvx/Cargo.toml"), Path("nvx/Cargo.lock"), Path("scripts/nvx.py")))
        files.add(Path(".github/actions/build-arm64-guest-artifacts/action.yml"))
        files.add(Path(".github/workflows/ci.yml"))
        for path in sorted(files):
            digest.update(path.as_posix().encode() + b"\0")
            digest.update(hashlib.sha256(path.read_bytes()).digest())
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
            print(f"key=guest-artifacts-aarch64-v1-{digest.hexdigest()}", file=output)

    - name: Restore ARM guest artifacts
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ${{ steps.identity.outputs.key }}
        path: |
          build/aarch64/Image
          build/aarch64/Image.config
          build/aarch64/Image.provenance.json
          build/aarch64/Image-debug
          build/aarch64/Image-debug.config
          build/aarch64/Image-debug.provenance.json
          build/aarch64/initramfs.cpio.gz
          build/aarch64/initramfs.cpio.gz.packages.json
          build/aarch64/initramfs.provenance.json
          build/aarch64/initramfs-ubuntu.cpio.gz
          build/aarch64/initramfs-ubuntu.cpio.gz.packages.json
          build/aarch64/ubuntu-distro.erofs
          build/aarch64/ubuntu-distro.erofs.manifest.json
          build/aarch64/ubuntu-smoke-scratch.ext4
        enableCrossOsArchive: true

    - name: Build ARM guest artifacts
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/nvx.py build-kernel --architecture aarch64
        python3 scripts/nvx.py build-kernel --architecture aarch64 --debug
        python3 scripts/nvx.py build-guest-binaries \
          --architecture aarch64 --output build/aarch64/guest-binaries
        export NVX_GUEST_BINARIES="${GITHUB_WORKSPACE}/build/aarch64/guest-binaries"
        python3 scripts/nvx.py build-initramfs --architecture aarch64 --guest alpine
        python3 scripts/nvx.py build-initramfs --architecture aarch64 --guest ubuntu
        python3 scripts/nvx.py build-distro-layer --architecture aarch64 --guest ubuntu
        python3 scripts/nvx.py build-scratch-template \
          --output build/aarch64/ubuntu-smoke-scratch.ext4
        python3 scripts/nvx.py verify-guest-determinism \
          --architecture aarch64 --guest ubuntu \
          --work-dir build/aarch64/guest-determinism

    - name: Validate built or cached ARM guest artifacts
      shell: python3 {0}
      run: |
        import sys
        from pathlib import Path

        sys.path.insert(0, "scripts")
        from nvx_tools.release import validate_guest_artifacts

        validate_guest_artifacts(
            Path("build/aarch64"), ("kernel", "alpine", "ubuntu"),
            architecture="aarch64",
        )

    - name: Save ARM guest artifacts
      if: inputs.save-cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ${{ steps.identity.outputs.key }}
        path: |
          build/aarch64/Image
          build/aarch64/Image.config
          build/aarch64/Image.provenance.json
          build/aarch64/Image-debug
          build/aarch64/Image-debug.config
          build/aarch64/Image-debug.provenance.json
          build/aarch64/initramfs.cpio.gz
          build/aarch64/initramfs.cpio.gz.packages.json
          build/aarch64/initramfs.provenance.json
          build/aarch64/initramfs-ubuntu.cpio.gz
          build/aarch64/initramfs-ubuntu.cpio.gz.packages.json
          build/aarch64/ubuntu-distro.erofs
          build/aarch64/ubuntu-distro.erofs.manifest.json
          build/aarch64/ubuntu-smoke-scratch.ext4
        enableCrossOsArchive: true
