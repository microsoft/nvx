name: Validate runner
description: Verify the toolchain and virtualization backend required by an NVX job

inputs:
  architecture:
    description: Expected guest and native runner architecture
    required: false
    default: x86_64
  backend:
    description: Virtualization backend expected on the runner
    required: true
  verify-openvmm:
    description: >-
      Also check the CPU profile with the downloaded OpenVMM (doctor H2) and
      verify its time ABI preflight (doctor H3); OpenVMM and the guest
      artifacts must be in their build paths
    required: false
    default: "false"
  warp-probe:
    description: >-
      Also run the guest warp probe (doctor H6) on CI's schedule, for jobs
      that boot guests without the microVM scenarios' own probes; requires
      verify-openvmm
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate Windows architecture selection
      if: runner.os == 'Windows'
      shell: python {0}
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        import os

        if os.environ["ARCHITECTURE"] not in ("x86_64", "aarch64"):
            raise SystemExit("Unsupported native runner architecture")

    - name: Verify native Windows ARM64 runner
      if: inputs.architecture == 'aarch64' && runner.os == 'Windows'
      shell: python {0}
      env:
        RUNNER_ARCH: ${{ runner.arch }}
        BACKEND: ${{ inputs.backend }}
      run: |
        import os
        import platform
        import subprocess
        import sys
        import sysconfig

        if (
            sys.platform != "win32"
            or platform.machine().lower() not in ("arm64", "aarch64")
            or sysconfig.get_platform() != "win-arm64"
            or os.environ["RUNNER_ARCH"] != "ARM64"
            or os.environ["BACKEND"] != "whp"
        ):
            raise SystemExit("ARM qualification requires native Windows ARM64 and WHP")
        result = subprocess.run(["rustc", "-vV"], capture_output=True, text=True, check=True)
        if "host: aarch64-pc-windows-msvc" not in result.stdout.splitlines():
            raise SystemExit("ARM qualification requires native ARM64 rustc")

    - name: Validate Linux architecture selection
      if: runner.os != 'Windows'
      shell: python3 {0}
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        import os

        if os.environ["ARCHITECTURE"] != "x86_64":
            raise SystemExit("Native ARM runtime qualification is Windows WHP only")

    - name: Validate Linux toolchain
      if: runner.os != 'Windows'
      shell: bash
      env:
        # Report a missing pinned toolchain instead of installing it into the
        # read-only RUSTUP_HOME.
        RUSTUP_AUTO_INSTALL: "0"
      run: |
        set -euo pipefail
        test -n "${CARGO_HOME:-}" || {
          echo "::error::CARGO_HOME is not configured" >&2
          exit 1
        }
        mkdir -p "${CARGO_HOME}/bin"
        python3 --version
        toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
        test -n "${toolchain}"
        if ! rustup toolchain list | awk -v name="${toolchain}" \
          'index($1, name "-") == 1 { found = 1 } END { exit !found }'; then
          echo "::error::Rust ${toolchain}, which rust-toolchain.toml pins, is not installed; rerun scripts/setup/setup-linux.sh --runner-only" >&2
          exit 1
        fi
        rust_version=$(rustc --version)
        echo "${rust_version}"
        if [[ "${rust_version}" != "rustc ${toolchain} "* ]]; then
          echo "::error::${rust_version} does not match Rust ${toolchain}, which rust-toolchain.toml pins" >&2
          exit 1
        fi
        cargo --version
        cargo nextest --version
        sccache --version
        test "${RUSTC_WRAPPER:-}" = sccache
        test "${CARGO_INCREMENTAL:-}" = 0
        test -n "${SCCACHE_DIR:-}"
        test "${SCCACHE_CACHE_SIZE:-}" = 10G
        test -d "${SCCACHE_DIR}"
        test -w "${SCCACHE_DIR}"
        if sudo -n true >/dev/null 2>&1; then
          echo "::error::Runner has passwordless sudo access" >&2
          exit 1
        fi
        if getent group docker >/dev/null 2>&1; then
          docker_gid="$(getent group docker | cut -d: -f3)"
          case " $(id -G) " in
            *" ${docker_gid} "*)
              echo "::error::Runner belongs to the root-equivalent Docker group" >&2
              exit 1
              ;;
          esac
        fi
        if command -v docker >/dev/null 2>&1 && docker version >/dev/null 2>&1; then
          echo "::error::Runner has Docker daemon access" >&2
          exit 1
        fi

    - name: Validate Windows toolchain
      if: runner.os == 'Windows'
      shell: powershell
      env:
        # Report a missing pinned toolchain instead of installing it into the
        # read-only RUSTUP_HOME.
        RUSTUP_AUTO_INSTALL: "0"
      run: |
        if ([string]::IsNullOrWhiteSpace($env:CARGO_HOME)) {
            throw "CARGO_HOME is not configured"
        }
        New-Item -ItemType Directory -Path "$env:CARGO_HOME\bin" -Force |
            Out-Null
        python --version
        $channel = Select-String -LiteralPath "rust-toolchain.toml" `
          -Pattern '^channel = "([^"]+)"' | Select-Object -First 1
        if ($null -eq $channel) {
          throw "rust-toolchain.toml does not pin a Rust release"
        }
        $toolchain = $channel.Matches[0].Groups[1].Value
        $installed = @(rustup toolchain list | ForEach-Object {
            ($_ -split '\s+')[0]
          } | Where-Object { $_.StartsWith("$toolchain-") })
        if ($installed.Count -eq 0) {
          throw "Rust $toolchain, which rust-toolchain.toml pins, is not installed; rerun scripts\setup\setup-windows-whp.ps1"
        }
        $rustVersion = rustc --version
        $rustVersion
        if ($rustVersion -notlike "rustc $toolchain *") {
          throw "$rustVersion does not match Rust $toolchain, which rust-toolchain.toml pins"
        }
        cargo --version
        cargo nextest --version
        sccache --version
        if ($env:RUSTC_WRAPPER -ne "sccache") {
          throw "RUSTC_WRAPPER is not configured for sccache"
        }
        if ($env:CARGO_INCREMENTAL -ne "0") {
          throw "CARGO_INCREMENTAL is not disabled"
        }
        if ([string]::IsNullOrWhiteSpace($env:SCCACHE_DIR)) {
          throw "SCCACHE_DIR is not configured"
        }
        if ($env:SCCACHE_CACHE_SIZE -ne "10G") {
          throw "SCCACHE_CACHE_SIZE is not configured"
        }
        if (-not (Test-Path -LiteralPath $env:SCCACHE_DIR -PathType Container)) {
          throw "sccache directory was not found: $env:SCCACHE_DIR"
        }
        if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
          throw "RUNNER_TEMP is not configured"
        }
        $runnerRoot = Split-Path -Parent `
          (Split-Path -Parent $env:RUNNER_TEMP)
        $serviceName = (Get-Content `
            -LiteralPath (Join-Path $runnerRoot ".service") `
            -Raw).Trim()
        $service = Get-CimInstance `
          -ClassName Win32_Service `
          -Filter "Name='$serviceName'"
        if ($null -eq $service) {
          throw "Actions runner service was not found: $serviceName"
        }
        $account = [Security.Principal.NTAccount]::new($service.StartName)
        $sid = $account.Translate(
          [Security.Principal.SecurityIdentifier]
        ).Value
        if ($sid -ne "S-1-5-20") {
          throw "Actions runner service uses $($service.StartName), expected Network Service"
        }
        $jobSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        if ($jobSid -ne "S-1-5-20") {
          throw "Actions job uses SID $jobSid, expected Network Service"
        }
        if ("${{ inputs.architecture }}" -eq "x86_64") {
        $system32 = Join-Path $env:SystemRoot "System32"
        $pcatFirmware = @(
          (Join-Path $system32 "vmfirmwarepcat.dll"),
          (Join-Path $system32 "vmfirmware.dll")
        )
        if (@($pcatFirmware | Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            }).Count -eq 0) {
          throw "Hyper-V PCAT firmware was not found under $system32"
        }
        $svgaFirmware = Join-Path $system32 "VmEmulatedDevices.dll"
        if (-not (Test-Path -LiteralPath $svgaFirmware -PathType Leaf)) {
          throw "Hyper-V SVGA firmware was not found: $svgaFirmware"
        }
        }

    # A cancelled job's harness can start OpenVMM after the runner's orphan
    # cleanup has listed the job's processes, and then die without stopping
    # it, which leaves the VM loading a CPU for days (#768). A runner runs one
    # job at a time and no step before this one starts OpenVMM, so any
    # OpenVMM process of the runner's account is left from an earlier job.
    - name: Terminate OpenVMM left by earlier jobs
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        name=openvmm
        user=$(id -u)
        # Lists the account's OpenVMM processes; a zombie has already exited.
        live() {
          ps -u "${user}" -o pid=,stat=,comm= |
            awk -v name="${name}" '$3 == name && $2 !~ /^Z/ { print $1 }'
        }
        leaked=$(live)
        if [ -z "${leaked}" ]; then
          exit 0
        fi
        for pid in ${leaked}; do
          started=$(ps -o lstart= -p "${pid}" || true)
          echo "::warning::Terminating OpenVMM process ${pid}, started ${started:-at an unknown time}, which an earlier job left running"
          echo "  command: $(ps -o args= -p "${pid}" || true)"
        done
        # shellcheck disable=SC2086
        kill -TERM ${leaked} 2>/dev/null || true
        for _ in $(seq 50); do
          remaining=$(live)
          if [ -z "${remaining}" ]; then
            exit 0
          fi
          sleep 0.1
        done
        # shellcheck disable=SC2086
        kill -KILL ${remaining} 2>/dev/null || true
        sleep 1
        remaining=$(live)
        if [ -n "${remaining}" ]; then
          echo "::error::OpenVMM processes that an earlier job left running did not exit: ${remaining//$'\n'/ }" >&2
          exit 1
        fi

    # A harness that something killed outright, as the runner's orphan
    # cleanup killed those of cancelled jobs, leaves its scenarios' scratch
    # directories in the temporary directory (#946). As with OpenVMM, no step
    # before this one runs the harness, so the account's harness directories
    # there are left from earlier jobs.
    - name: Remove scratch left by earlier jobs
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        temporary=$(python3 -c 'import tempfile; print(tempfile.gettempdir())')
        find "${temporary}" -mindepth 1 -maxdepth 1 -type d -user "$(id -u)" \
          \( -name 'nvx-*' -o -name 'openvmm-*' \) -print0 |
          while IFS= read -r -d '' directory; do
            modified=$(stat -c %y "${directory}" || true)
            echo "::notice::Removing ${directory}, last modified ${modified:-at an unknown time}, which an earlier job left behind"
            # A scenario can leave a directory that even its owner can't write.
            chmod -R u+rwX -- "${directory}" 2>/dev/null || true
            if ! rm -rf --one-file-system -- "${directory}"; then
              echo "::warning::Could not remove ${directory}, which an earlier job left behind"
            fi
          done

    # Host time. The time ABI host qualification (doc/ci.md,
    # "Host qualification") checks the backend, the CPU fingerprint and
    # generation, and the TSC rate stability and the host's synchronized clock
    # correction on its short CI schedule, and, in jobs that downloaded
    # OpenVMM, its CPU profile check (H2) and preflight (H3); other jobs
    # qualify without OpenVMM. Jobs whose guests run without the microVM
    # scenarios' warp probes add the guest warp probe (H6). The host's
    # invariant-TSC flags are evidence only: the guest warp probe measures the
    # cross-vCPU skew that a host without one can cause (#265).
    - name: Report host TSC
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        echo "Kernel: $(uname -r)"
        echo "CPU: $(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)"
        echo "Clocksource: $(cat /sys/devices/system/clocksource/clocksource0/current_clocksource 2>/dev/null || echo unknown)"
        flags=" $(awk -F': ' '/^flags/ { print $2; exit }' /proc/cpuinfo) "
        for flag in constant_tsc nonstop_tsc tsc_known_freq tsc_reliable; do
          case "${flags}" in
            *" ${flag} "*) echo "TSC flag ${flag}: present" ;;
            *) echo "TSC flag ${flag}: absent" ;;
          esac
        done
        case "${flags}" in
          *" nonstop_tsc "*) ;;
          *)
            echo "::notice::Runner host does not expose an invariant TSC (nonstop_tsc); the guest warp probe measures the cross-vCPU skew that this can cause (#265)"
            ;;
        esac

    - name: Qualify host time on Linux
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        python3 scripts/nvx.py doctor
        --backend "${{ inputs.backend }}"
        --checks H1 H2 H4
        ${{ inputs.warp-probe == 'true' && 'H6' || '' }}
        ${{ inputs.verify-openvmm == 'true' && 'H3 --cpu-fingerprint "${RUNNER_TEMP}/nvx-cpu-fingerprint.json"' || '--no-openvmm' }}
        --ci-schedule
        --summary "${GITHUB_STEP_SUMMARY}"

    - name: Qualify host time on Windows
      if: runner.os == 'Windows' && inputs.architecture == 'x86_64'
      shell: powershell
      run: >-
        python scripts\nvx.py doctor
        --backend "${{ inputs.backend }}"
        --checks H1 H2 H4
        ${{ inputs.warp-probe == 'true' && 'H6' || '' }}
        ${{ inputs.verify-openvmm == 'true' && 'H3 --cpu-fingerprint "$env:RUNNER_TEMP\nvx-cpu-fingerprint.json"' || '--no-openvmm' }}
        --ci-schedule
        --summary "$env:GITHUB_STEP_SUMMARY"

    - name: Qualify ARM counter time on Windows
      if: runner.os == 'Windows' && inputs.architecture == 'aarch64'
      shell: python {0}
      env:
        VERIFY_OPENVMM: ${{ inputs.verify-openvmm }}
        WARP_PROBE: ${{ inputs.warp-probe }}
      run: |
        import os
        import subprocess
        import sys
        from pathlib import Path

        verify_openvmm = os.environ["VERIFY_OPENVMM"] == "true"
        warp_probe = os.environ["WARP_PROBE"] == "true"
        if warp_probe and not verify_openvmm:
            raise SystemExit("ARM guest warp qualification requires verify-openvmm=true")
        checks = ["H1", "H2", "H3", "H4"] if verify_openvmm else ["H1", "H4"]
        if warp_probe:
            checks.append("H6")
        command = [
            sys.executable, r"scripts\nvx.py", "doctor",
            "--architecture", "aarch64", "--backend", "whp",
            "--checks", *checks,
        ]
        if not verify_openvmm:
            command.append("--no-openvmm")
            deferred = (
                "ARM H2/H3 built-product/profile admission: DEFERRED. "
                "This pre-build H1/H4 host-check receipt is not profile admission. "
                "Required ARM runtime jobs must admit the built OpenVMM and guest "
                "artifacts with H2/H3 before running their scenarios."
            )
            print("::notice::" + deferred, flush=True)
            with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                summary.write("### ARM pre-build qualification scope\n" + deferred + "\n\n")
        command.extend(("--ci-schedule", "--summary", os.environ["GITHUB_STEP_SUMMARY"]))
        subprocess.run(command, check=True)

    # A failed CPU profile check keeps OpenVMM's fingerprint, which names the
    # host's whole CPU surface for a new generation or profile revision.
    - name: Upload the CPU fingerprint
      if: failure() && inputs.verify-openvmm == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ runner.temp }}/nvx-cpu-fingerprint.json
        name: cpu-fingerprint-${{ github.job }}-${{ inputs.backend }}-${{ runner.name }}-attempt-${{ github.run_attempt }}
        if-no-files-found: ignore
        overwrite: true
        retention-days: 7
    - name: Validate KVM
      if: inputs.backend == 'kvm'
      shell: bash
      run: |
        set -euo pipefail
        test -r /dev/kvm
        test -w /dev/kvm

    - name: Validate MSHV
      if: inputs.backend == 'mshv'
      shell: bash
      run: |
        set -euo pipefail
        test -r /dev/mshv
        test -w /dev/mshv
