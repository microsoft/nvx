name: Validate runner
description: Verify the toolchain and virtualization backend required by an NVX job

inputs:
  backend:
    description: Virtualization backend expected on the runner
    required: true
  verify-openvmm:
    description: >-
      Also check the CPU profile with the downloaded OpenVMM (doctor H2) and
      verify its time ABI preflight (doctor H3); OpenVMM and the guest
      artifacts must be in their build paths
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate Linux toolchain
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        test -n "${CARGO_HOME:-}" || {
          echo "::error::CARGO_HOME is not configured" >&2
          exit 1
        }
        mkdir -p "${CARGO_HOME}/bin"
        python3 --version
        rustc --version
        cargo --version
        cargo nextest --version
        sccache --version
        test "${RUSTC_WRAPPER:-}" = sccache
        test "${CARGO_INCREMENTAL:-}" = 0
        test -n "${SCCACHE_DIR:-}"
        test "${SCCACHE_CACHE_SIZE:-}" = 10G
        test -d "${SCCACHE_DIR}"
        test -w "${SCCACHE_DIR}"
        if sudo -n true >/dev/null 2>&1; then
          echo "::error::Runner has passwordless sudo access" >&2
          exit 1
        fi
        if getent group docker >/dev/null 2>&1; then
          docker_gid="$(getent group docker | cut -d: -f3)"
          case " $(id -G) " in
            *" ${docker_gid} "*)
              echo "::error::Runner belongs to the root-equivalent Docker group" >&2
              exit 1
              ;;
          esac
        fi
        if command -v docker >/dev/null 2>&1 && docker version >/dev/null 2>&1; then
          echo "::error::Runner has Docker daemon access" >&2
          exit 1
        fi

    - name: Validate Windows toolchain
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        if ([string]::IsNullOrWhiteSpace($env:CARGO_HOME)) {
            throw "CARGO_HOME is not configured"
        }
        New-Item -ItemType Directory -Path "$env:CARGO_HOME\bin" -Force |
            Out-Null
        python --version
        rustc --version
        cargo --version
        cargo nextest --version
        sccache --version
        if ($env:RUSTC_WRAPPER -ne "sccache") {
          throw "RUSTC_WRAPPER is not configured for sccache"
        }
        if ($env:CARGO_INCREMENTAL -ne "0") {
          throw "CARGO_INCREMENTAL is not disabled"
        }
        if ([string]::IsNullOrWhiteSpace($env:SCCACHE_DIR)) {
          throw "SCCACHE_DIR is not configured"
        }
        if ($env:SCCACHE_CACHE_SIZE -ne "10G") {
          throw "SCCACHE_CACHE_SIZE is not configured"
        }
        if (-not (Test-Path -LiteralPath $env:SCCACHE_DIR -PathType Container)) {
          throw "sccache directory was not found: $env:SCCACHE_DIR"
        }
        if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
          throw "RUNNER_TEMP is not configured"
        }
        $runnerRoot = Split-Path -Parent `
          (Split-Path -Parent $env:RUNNER_TEMP)
        $serviceName = (Get-Content `
            -LiteralPath (Join-Path $runnerRoot ".service") `
            -Raw).Trim()
        $service = Get-CimInstance `
          -ClassName Win32_Service `
          -Filter "Name='$serviceName'"
        if ($null -eq $service) {
          throw "Actions runner service was not found: $serviceName"
        }
        $account = [Security.Principal.NTAccount]::new($service.StartName)
        $sid = $account.Translate(
          [Security.Principal.SecurityIdentifier]
        ).Value
        if ($sid -ne "S-1-5-20") {
          throw "Actions runner service uses $($service.StartName), expected Network Service"
        }
        $jobSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        if ($jobSid -ne "S-1-5-20") {
          throw "Actions job uses SID $jobSid, expected Network Service"
        }
        $system32 = Join-Path $env:SystemRoot "System32"
        $pcatFirmware = @(
          (Join-Path $system32 "vmfirmwarepcat.dll"),
          (Join-Path $system32 "vmfirmware.dll")
        )
        if (@($pcatFirmware | Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            }).Count -eq 0) {
          throw "Hyper-V PCAT firmware was not found under $system32"
        }
        $svgaFirmware = Join-Path $system32 "VmEmulatedDevices.dll"
        if (-not (Test-Path -LiteralPath $svgaFirmware -PathType Leaf)) {
          throw "Hyper-V SVGA firmware was not found: $svgaFirmware"
        }

    # Host time. On Linux, the nonstop_tsc gate stays fail-closed in front of
    # the time ABI host qualification (doc/design/time-abi.md, "Host
    # qualification"), which then checks the backend, the CPU fingerprint and
    # generation, and the TSC rate stability on its short CI schedule, and,
    # in jobs that downloaded OpenVMM, its CPU profile check (H2) and
    # preflight (H3); other jobs qualify without OpenVMM. These checks are
    # host-level, and the guest warp probe (H6) runs only in the microVM
    # scenarios, so the gate keeps a host whose guests warp (#265) out of
    # every other job.
    - name: Validate host TSC
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        # Guests on a host without an invariant TSC intermittently see
        # cross-vCPU TSC warps, which make Linux mark the guest TSC unstable
        # (#211).
        echo "Kernel: $(uname -r)"
        echo "CPU: $(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)"
        echo "Clocksource: $(cat /sys/devices/system/clocksource/clocksource0/current_clocksource 2>/dev/null || echo unknown)"
        flags=" $(awk -F': ' '/^flags/ { print $2; exit }' /proc/cpuinfo) "
        for flag in constant_tsc nonstop_tsc tsc_known_freq tsc_reliable; do
          case "${flags}" in
            *" ${flag} "*) echo "TSC flag ${flag}: present" ;;
            *) echo "TSC flag ${flag}: absent" ;;
          esac
        done
        case "${flags}" in
          *" nonstop_tsc "*) ;;
          *)
            echo "::error::Runner host does not expose an invariant TSC (nonstop_tsc); redeploy the VM on a host that does" >&2
            exit 1
            ;;
        esac

    - name: Qualify host time on Linux
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        python3 scripts/nvx.py doctor
        --backend "${{ inputs.backend }}"
        --checks H1 H2 H4
        ${{ inputs.verify-openvmm == 'true' && 'H3 --cpu-fingerprint "${RUNNER_TEMP}/nvx-cpu-fingerprint.json"' || '--no-openvmm' }}
        --ci-schedule
        --summary "${GITHUB_STEP_SUMMARY}"

    - name: Qualify host time on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: >-
        python scripts\nvx.py doctor
        --backend "${{ inputs.backend }}"
        --checks H1 H2 H4
        ${{ inputs.verify-openvmm == 'true' && 'H3 --cpu-fingerprint "$env:RUNNER_TEMP\nvx-cpu-fingerprint.json"' || '--no-openvmm' }}
        --ci-schedule
        --summary "$env:GITHUB_STEP_SUMMARY"

    # A failed CPU profile check keeps OpenVMM's fingerprint, which names the
    # host's whole CPU surface for a new generation or profile revision.
    - name: Upload the CPU fingerprint
      if: failure() && inputs.verify-openvmm == 'true'
      uses: actions/upload-artifact@v7
      with:
        path: ${{ runner.temp }}/nvx-cpu-fingerprint.json
        name: cpu-fingerprint-${{ github.job }}-${{ inputs.backend }}-${{ runner.name }}-attempt-${{ github.run_attempt }}
        if-no-files-found: ignore
        overwrite: true
        retention-days: 7
    - name: Validate KVM
      if: inputs.backend == 'kvm'
      shell: bash
      run: |
        set -euo pipefail
        test -r /dev/kvm
        test -w /dev/kvm

    - name: Validate MSHV
      if: inputs.backend == 'mshv'
      shell: bash
      run: |
        set -euo pipefail
        test -r /dev/mshv
        test -w /dev/mshv
