name: Require rootless Docker
description: Use only the isolated, unprivileged daemon for Docker-based CI jobs

runs:
  using: composite
  steps:
    - name: Select rootless daemon
      shell: bash
      run: |
        set -euo pipefail
        endpoint="unix:///run/user/$(id -u)/docker.sock"
        config=$(mktemp -d "$RUNNER_TEMP/nvx-docker-config.XXXXXX")
        security=$(DOCKER_CONFIG="$config" DOCKER_HOST="$endpoint" docker info --format '{{json .SecurityOptions}}')
        if [[ "$security" != *name=rootless* ]]; then
          echo "::error::The CI runner does not have a rootless Docker daemon" >&2
          exit 1
        fi
        DOCKER_CONFIG="$config" DOCKER_HOST="$endpoint" docker buildx version
        {
          printf 'DOCKER_CONFIG=%s\n' "$config"
          printf 'DOCKER_HOST=%s\n' "$endpoint"
        } >> "$GITHUB_ENV"
