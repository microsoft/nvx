name: Check nvx-rs
description: >-
  Format, lint, document, and test the nvx crate, check its public API against the snapshots
  that adapters build on, and check the runtime adapter that builds on it as an independent
  adapter

inputs:
  toolchain:
    description: >-
      Rust toolchain used for formatting, linting, and tests. Defaults to the release
      that the repository's rust-toolchain.toml pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchains
      id: toolchains
      shell: bash
      working-directory: nvx-rs
      env:
        REQUESTED_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        toolchain=${REQUESTED_TOOLCHAIN:-$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' ../rust-toolchain.toml)}
        msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
        test -n "${toolchain}"
        test -n "${msrv}"
        rustup toolchain install "${toolchain}" --profile minimal \
          --component clippy,rustfmt
        rustup toolchain install "${msrv}" --profile minimal
        {
          echo "toolchain=${toolchain}"
          echo "msrv=${msrv}"
        } >> "${GITHUB_OUTPUT}"

    - name: Check formatting
      shell: bash
      working-directory: nvx-rs
      run: cargo "+${{ steps.toolchains.outputs.toolchain }}" fmt --all --check

    - name: Lint
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --all-targets --all-features \
          -- -D warnings
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --lib --no-default-features \
          -- -D warnings

    - name: Test
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --all-features
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked

    # Stages a synthetic release in the current layout, with nvx-rs and its
    # provenance, which the bundled-artifacts test then requires to find.
    - name: Check artifact bundling
      shell: bash
      working-directory: nvx-rs
      run: |
        set -euo pipefail
        bundle=$(mktemp -d)
        executable=openvmm
        cli=nvx-rs
        bundle_dir="${bundle}"
        if [[ "${RUNNER_OS}" == Windows ]]; then
          executable=openvmm.exe
          cli=nvx-rs.exe
          bundle_dir=$(cygpath -w "${bundle}")
        fi
        mkdir -p "${bundle}/bin" "${bundle}/guest" "${bundle}/provenance"
        printf openvmm > "${bundle}/bin/${executable}"
        printf nvx-rs > "${bundle}/bin/${cli}"
        printf '{}' > "${bundle}/provenance/nvx-rs.provenance.json"
        printf kernel > "${bundle}/guest/vmlinux"
        printf initramfs > "${bundle}/guest/initramfs.cpio.gz"
        cp ../SOURCE-MANIFEST.json "${bundle}/"
        (cd "${bundle}" && sha256sum "bin/${executable}" "bin/${cli}" guest/vmlinux \
          guest/initramfs.cpio.gz provenance/nvx-rs.provenance.json \
          SOURCE-MANIFEST.json > SHA256SUMS)
        NVX_BUNDLE_DIR="${bundle_dir}" cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --lib \
          --features bundled artifacts

    - name: Build documentation
      shell: bash
      working-directory: nvx-rs
      env:
        NVX_BUNDLE: skip
        RUSTDOCFLAGS: -D warnings
      run: cargo "+${{ steps.toolchains.outputs.toolchain }}" doc --locked --no-deps --all-features

    - name: Check the minimum supported Rust version
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: >-
        cargo "+${{ steps.toolchains.outputs.msrv }}" check
        --locked --all-targets --all-features

    - name: Check the macOS build
      if: runner.os == 'Linux'
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: |
        set -euo pipefail
        rustup target add --toolchain "${{ steps.toolchains.outputs.toolchain }}" aarch64-apple-darwin
        cargo "+${{ steps.toolchains.outputs.toolchain }}" check --locked --all-targets --all-features \
          --target aarch64-apple-darwin

    # The guest binaries are static x86_64-unknown-linux-musl executables; see the README's
    # guest binaries section. This step also adds the musl target that the build step needs.
    - name: Lint and test the guest binaries
      if: runner.os == 'Linux'
      shell: bash
      run: >-
        python3 scripts/nvx.py check-guest-binaries
        --toolchain "${{ steps.toolchains.outputs.toolchain }}"

    - name: Build and check the guest binaries
      if: runner.os == 'Linux'
      shell: bash
      working-directory: nvx-rs
      run: |
        set -euo pipefail
        directory="${PWD}/../build/nvx-rs-guest-binaries"
        python3 ../scripts/nvx.py build-guest-binaries --output "${directory}"
        python3 ../scripts/nvx.py test-guest-binaries --binaries "${directory}"

    # The runtime adapter builds on nvx-rs as an independent adapter does: with a lockfile of its
    # own, default features off, and the public API only. Its tests check consumer-contract
    # scenario C0 in each configuration, which also builds with nvx-rs's minimum Rust version.
    - name: Check the runtime adapter's protocol-only configuration
      shell: bash
      working-directory: tests/runtime-adapter
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" fmt --all --check
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --all-targets \
          -- -D warnings
        cargo "+${{ steps.toolchains.outputs.toolchain }}" build --locked
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked
        cargo "+${{ steps.toolchains.outputs.msrv }}" check --locked --all-targets

    - name: Check the runtime adapter's host-only configuration
      shell: bash
      working-directory: tests/runtime-adapter
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --all-targets \
          --features host -- -D warnings
        cargo "+${{ steps.toolchains.outputs.toolchain }}" build --locked --features host
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --features host
        cargo "+${{ steps.toolchains.outputs.msrv }}" check --locked --all-targets --features host

    # The guest half runs in Linux guests, as a static executable that a test checks.
    - name: Check the runtime adapter's guest-only configuration
      if: runner.os == 'Linux'
      shell: bash
      working-directory: tests/runtime-adapter
      run: |
        set -euo pipefail
        for toolchain in "${{ steps.toolchains.outputs.toolchain }}" "${{ steps.toolchains.outputs.msrv }}"; do
          rustup target add --toolchain "${toolchain}" x86_64-unknown-linux-musl
        done
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --all-targets \
          --features guest --target x86_64-unknown-linux-musl -- -D warnings
        cargo "+${{ steps.toolchains.outputs.toolchain }}" build --locked \
          --features guest --target x86_64-unknown-linux-musl
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked \
          --features guest --target x86_64-unknown-linux-musl
        cargo "+${{ steps.toolchains.outputs.msrv }}" check --locked --all-targets \
          --features guest --target x86_64-unknown-linux-musl

    # The public API of nvx in each configuration that adapters build on must match the
    # snapshots in tests/public-api; see its README. The check lists every target of each
    # configuration, so it runs once, on Linux. cargo-public-api publishes no binaries, so dev
    # pushes cache the build of the release that the script pins.
    - name: Restore the public API tools
      id: public-api-tools
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/public-api-tools
        key: public-api-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/check_public_api.py') }}

    - name: Install the public API tools
      if: runner.os == 'Linux'
      shell: bash
      env:
        TOOLS: ${{ runner.temp }}/public-api-tools
      run: |
        set -euo pipefail
        python3 scripts/check_public_api.py --install-tools --root "${TOOLS}"
        echo "${TOOLS}/bin" >> "${GITHUB_PATH}"

    - name: Save the public API tools
      if: >-
        success() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        runner.os == 'Linux' &&
        steps.public-api-tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/public-api-tools
        key: ${{ steps.public-api-tools.outputs.cache-primary-key }}

    - name: Check the public API of nvx
      if: runner.os == 'Linux'
      shell: bash
      run: python3 scripts/check_public_api.py
