name: Checkout OpenVMM
description: Checkout the OpenVMM revision pinned by the NVX repository

inputs:
  ssh-key:
    description: SSH deploy key used to checkout OpenVMM
    required: true

outputs:
  sha:
    description: Resolved OpenVMM commit
    value: ${{ steps.revision-linux.outputs.sha || steps.revision-windows.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Resolve OpenVMM revision on Linux
      if: runner.os != 'Windows'
      id: revision-linux
      shell: bash
      run: echo "sha=$(git rev-parse :openvmm)" >> "${GITHUB_OUTPUT}"

    - name: Resolve OpenVMM revision on Windows
      if: runner.os == 'Windows'
      id: revision-windows
      shell: powershell
      run: |
        "sha=$(git rev-parse :openvmm)" |
          Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Resolve Windows checkout identity
      if: runner.os == 'Windows'
      id: checkout-identity
      shell: powershell
      run: |
        $domain, $username = [Security.Principal.WindowsIdentity]::GetCurrent().Name -split '\\', 2
        "domain=$domain" |
          Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "username=$username" |
          Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Checkout OpenVMM
      uses: actions/checkout@v5
      env:
        USERDOMAIN: ${{ steps.checkout-identity.outputs.domain }}
        USERNAME: ${{ steps.checkout-identity.outputs.username }}
      with:
        repository: nanvix/openvmm
        ref: ${{ steps.revision-linux.outputs.sha || steps.revision-windows.outputs.sha }}
        path: openvmm
        persist-credentials: false
        ssh-key: ${{ inputs.ssh-key }}
