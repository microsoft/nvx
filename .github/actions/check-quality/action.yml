name: Check quality
description: Run NVX linting, typing, and formatting checks

runs:
  using: composite
  steps:
    - name: Require PowerShell on self-hosted runner
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v pwsh >/dev/null 2>&1; then
          echo "::error::PowerShell is required for CI syntax validation on this runner" >&2
          exit 1
        fi
        pwsh --version

    - name: Set up Python (GitHub-hosted)
      if: runner.environment == 'github-hosted'
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Set up Python (self-hosted)
      id: self_hosted_python
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import sys

        if sys.version_info < (3, 10):
            raise SystemExit("Python 3.10 or newer is required")
        PY
        venv_dir=$(mktemp -d "$RUNNER_TEMP/nvx-quality-venv.XXXXXX")
        python3 -m venv "$venv_dir"
        printf 'python=%s/bin/python\n' "$venv_dir" >> "$GITHUB_OUTPUT"

    - name: Install development tools
      shell: bash
      env:
        PYTHON_BIN: ${{ steps.self_hosted_python.outputs.python || 'python' }}
      run: '"$PYTHON_BIN" -m pip install --requirement requirements-dev.txt'

    - name: Check code quality
      shell: bash
      env:
        PYTHON_BIN: ${{ steps.self_hosted_python.outputs.python || 'python' }}
        SHELLCHECK: >-
          docker run --rm --volume ${{ github.workspace }}:/workspace:ro
          --workdir /workspace
          koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
          shellcheck
        SHFMT: >-
          docker run --rm --volume ${{ github.workspace }}:/workspace:ro
          --workdir /workspace
          mvdan/shfmt@sha256:307d265ffd25ce832899ae17c93ed5062fc3375c514bba8f52cbf52792735c4d
      run: |
        set -euo pipefail
        "$PYTHON_BIN" -m ruff check scripts .github/specula
        "$PYTHON_BIN" -m compileall -q .github/specula
        ${SHELLCHECK} --shell=sh \
          guest/common/init guest/alpine/nvx-container-enter \
          guest/alpine/nvx-container-launch guest/common/nvx-exit \
          guest/common/nvx-hostmount guest/common/nvx-identity-probe \
          guest/common/nvx-init-agent \
          guest/common/nvx-sandbox-smoke guest/common/nvx-snapshot \
          guest/common/nvx-virtio-restore-probe \
          scripts/setup/setup-linux-mshv.sh \
          scripts/setup/setup-linux-runner.sh
        ${SHELLCHECK} --shell=bash \
          .github/specula/setup-runner.sh guest/ubuntu/nvx-bashrc
        "$PYTHON_BIN" -m pyright --pythonplatform Linux
        "$PYTHON_BIN" -m pyright --pythonplatform Windows
        "$PYTHON_BIN" -m ruff format --check scripts .github/specula
        ${SHFMT} -d -ln posix -i 4 -ci \
          guest/common/init guest/alpine/nvx-container-enter \
          guest/alpine/nvx-container-launch guest/common/nvx-exit \
          guest/common/nvx-hostmount guest/common/nvx-identity-probe \
          guest/common/nvx-init-agent \
          guest/common/nvx-sandbox-smoke guest/common/nvx-snapshot \
          guest/common/nvx-virtio-restore-probe \
          scripts/setup/setup-linux-mshv.sh \
          scripts/setup/setup-linux-runner.sh
        ${SHFMT} -d -ln bash -i 4 -ci \
          .github/specula/setup-runner.sh guest/ubuntu/nvx-bashrc

    - name: Test Specula CI wiring
      shell: bash
      working-directory: .github/specula
      env:
        PYTHON_BIN: ${{ steps.self_hosted_python.outputs.python || 'python' }}
      run: 'PYTHONDONTWRITEBYTECODE=1 "$PYTHON_BIN" -m unittest discover -s tests -q'

    - name: Check PowerShell syntax
      shell: pwsh
      run: |
        $tokens = $null
        $errors = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile(
          (Resolve-Path "scripts/setup/setup-windows-whp.ps1"),
          [ref]$tokens,
          [ref]$errors
        )
        foreach ($error in $errors) {
          Write-Error $error -ErrorAction Continue
        }
        if ($errors.Count -ne 0) {
          exit 1
        }
