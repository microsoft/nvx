version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - "area: ci"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /
      - /scripts/setup/azure
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - "area: ci"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /nvx
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: nvx
    labels:
      - "area: nvx"
    groups:
      rust-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
