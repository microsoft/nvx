name: CI

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_BASELINE_MINIMUM_HISTORY: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  quality:
    name: Lint, typing, and formatting
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check code quality
        uses: ./.github/actions/check-quality

  openvmm-changes:
    name: Detect CI workload inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
      run-workloads: ${{ steps.changes.outputs.run-workloads }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          run_tests() {
            echo "run-tests=true" >> "${GITHUB_OUTPUT}"
            echo "### OpenVMM tests: run" >> "${GITHUB_STEP_SUMMARY}"
            echo "$1" >> "${GITHUB_STEP_SUMMARY}"
          }

          run_workloads() {
            echo "run-workloads=true" >> "${GITHUB_OUTPUT}"
            echo "### Artifact-backed tests and benchmarks: run" >> "${GITHUB_STEP_SUMMARY}"
            echo "$1" >> "${GITHUB_STEP_SUMMARY}"
          }

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            run_tests "The comparison base is unavailable, so the safe fallback is to run the matrix."
            run_workloads "The comparison base is unavailable, so the safe fallback is to run the workloads."
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            run_tests "A comparison commit is unavailable, so the safe fallback is to run the matrix."
            run_workloads "A comparison commit is unavailable, so the safe fallback is to run the workloads."
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/ci-changed-files"
          if ! git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${changed_files}"; then
            run_tests "The changed files could not be determined, so the safe fallback is to run the matrix."
            run_workloads "The changed files could not be determined, so the safe fallback is to run the workloads."
            exit 0
          fi

          documentation_paths='^(doc/|.*\.md$)'
          if [[ -s "${changed_files}" ]] &&
             ! grep -Eivq "${documentation_paths}" "${changed_files}"; then
            echo "run-workloads=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### Artifact-backed tests and benchmarks: skip"
              echo "Only documentation files changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            run_workloads "At least one non-documentation file changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
          fi

          relevant_paths='^(openvmm($|/)|\.github/workflows/(ci|build-openvmm-binary|run-nvx-microvm-tests|run-platform)\.yml$|\.github/actions/(build-guest-artifacts|build-openvmm|checkout-openvmm|sccache|setup-curl|validate-nvx|validate-runner)/|scripts/nvx\.py$|scripts/nvx_tools/|scripts/setup/|kernel/|alpine/|docker/Dockerfile$|SOURCE-MANIFEST\.json$)'
          if grep -Eq "${relevant_paths}" "${changed_files}"; then
            run_tests "At least one OpenVMM test input changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
          else
            echo "run-tests=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### OpenVMM tests: skip"
              echo "No OpenVMM test inputs changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  artifacts:
    name: Build shared artifacts
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build guest artifacts
        id: guest-artifacts
        uses: ./.github/actions/build-guest-artifacts

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v7
        with:
          name: guest-artifacts
          path: |
            build/vmlinux
            build/vmlinux.config
            build/vmlinux.provenance.json
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
          if-no-files-found: error
          retention-days: 1

  build-openvmm-linux-gnu:
    name: OpenVMM binary / Linux GNU
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    uses: ./.github/workflows/build-openvmm-binary.yml
    with:
      display-name: Linux GNU
      runner: '["self-hosted", "linux", "kvm", "virtual-machine"]'
      backend: kvm
      target: x86_64-unknown-linux-gnu
      build-mode: native
      artifact: openvmm-linux-gnu
      binary: openvmm/target/release/openvmm
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  build-openvmm-linux-musl:
    name: OpenVMM binary / Linux musl
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    uses: ./.github/workflows/build-openvmm-binary.yml
    with:
      display-name: Linux musl
      runner: '["self-hosted", "linux", "mshv", "virtual-machine"]'
      backend: mshv
      target: x86_64-unknown-linux-musl
      build-mode: musl
      artifact: openvmm-linux-musl
      binary: openvmm/target/release/openvmm
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  build-openvmm-windows-msvc:
    name: OpenVMM binary / Windows MSVC
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    uses: ./.github/workflows/build-openvmm-binary.yml
    with:
      display-name: Windows MSVC
      runner: '["self-hosted", "windows", "whp", "virtual-machine"]'
      backend: whp
      target: x86_64-pc-windows-msvc
      build-mode: native
      artifact: openvmm-windows-msvc
      binary: openvmm/target/release/openvmm.exe
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  openvmm-vmm-tests:
    name: OpenVMM vmm-tests / ${{ matrix.name }}
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / KVM
            backend: kvm
            runner: '["self-hosted", "linux", "kvm", "virtual-machine"]'
          - name: Linux / MSHV
            backend: mshv
            runner: '["self-hosted", "linux", "mshv", "virtual-machine"]'
          - name: Windows / WHP
            backend: whp
            runner: '["self-hosted", "windows", "whp", "virtual-machine"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Prepare Windows cache tools
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py setup-cross-os-cache

      - name: Prepare Linux cache tools
        id: cache-tools-linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

      - name: Restore OpenVMM inputs on Linux
        id: restore-openvmm-inputs-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM inputs on Windows
        id: restore-openvmm-inputs-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Linux
        id: restore-openvmm-cargo-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Windows
        id: restore-openvmm-cargo-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare sccache
        uses: ./.github/actions/sccache
        with:
          operation: start

      - name: Run OpenVMM tests on KVM
        if: matrix.backend == 'kvm'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Run OpenVMM tests on MSHV
        if: matrix.backend == 'mshv'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Run OpenVMM tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts\nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Upload OpenVMM test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openvmm-vmm-tests-${{ runner.os }}-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.os == 'Windows' && format('{0}/{1}/test_results', runner.temp, matrix.backend) || 'openvmm/target/vmm_tests/test_results' }}
          if-no-files-found: warn
          retention-days: 7

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache
        with:
          operation: stop

      - name: Save OpenVMM inputs on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-inputs-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM inputs on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-inputs-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-cargo-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}

      - name: Save shared Cargo cache on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-cargo-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}

  openvmm-unit-tests:
    name: OpenVMM unit tests / ${{ matrix.name }}
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / KVM
            backend: kvm
            runner: '["self-hosted", "linux", "kvm", "virtual-machine"]'
          - name: Linux / MSHV
            backend: mshv
            runner: '["self-hosted", "linux", "mshv", "virtual-machine"]'
          - name: Windows / WHP
            backend: whp
            runner: '["self-hosted", "windows", "whp", "virtual-machine"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Prepare Windows cache tools
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py setup-cross-os-cache

      - name: Prepare Linux cache tools
        id: cache-tools-linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

      - name: Restore OpenVMM inputs on Linux
        id: restore-openvmm-inputs-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM inputs on Windows
        id: restore-openvmm-inputs-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Linux
        id: restore-openvmm-cargo-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Windows
        id: restore-openvmm-cargo-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare sccache
        uses: ./.github/actions/sccache
        with:
          operation: start

      - name: Run OpenVMM unit tests on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/nvx.py test-openvmm-unit

      - name: Run OpenVMM unit tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py test-openvmm-unit

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache
        with:
          operation: stop

      - name: Save OpenVMM inputs on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-inputs-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM inputs on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-inputs-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-cargo-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}

      - name: Save shared Cargo cache on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-cargo-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}

