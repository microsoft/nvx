  # The platform jobs measure the performance series that the regression gate
  # and the history compare. Each runs on the one runner of its backend's pool
  # that also carries the `benchmark` label, so that every workflow run
  # measures its series on the same VM: the pools mix CPU generations and VMs
  # whose results differ by more than the run-to-run noise (#383, #415).
  platform-kvm:
    name: Platform / Linux / KVM / Virtual machine
    needs: [artifacts, build-openvmm-linux-gnu, nvx-cli-linux, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
