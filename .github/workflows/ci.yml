# CI for the microvm hypervisor VMM.
#
# Builds the VMM, runs smoke tests, and runs benchmarks on both hypervisor backends from the
# same codebase:
#   * Linux / KVM   — self-hosted runner in the 'benchmark' group, labels [self-hosted, linux, x64]
#   * Windows / WHP — self-hosted runner in the 'benchmark' group, labels [self-hosted, windows, x64]
#
# Runner requirements (expected to be provisioned on the org's self-hosted runners):
#   * Linux:   Python 3.10+, a stable Rust toolchain (edition 2024, >= 1.85), Docker (to build the Linux
#              kernel + initramfs artifacts), and an accessible /dev/kvm for the KVM backend.
#              e2fsprogs (mke2fs) is used by the virt-fs benchmark; passwordless `sudo ip` is
#              required by the networking benchmarks.
#   * Windows: Python 3.10+, a stable Rust toolchain for x86_64-pc-windows-msvc (edition 2024),
#              and the Windows Hypervisor Platform feature enabled for the WHP backend.
#   * HCN/XDP: The Windows runner additionally needs Hyper-V Administrator/HNS privileges and the
#              signed XDP-for-Windows v1.3.0 package. This privileged lane is opt-in and never runs
#              for pull requests.
#
# The kernel + initramfs are built once, in Docker, on the Linux runner and shared with the
# Windows job (Windows cannot compile the Linux kernel natively). Build, smoke tests, and the
# benchmark suite all run on every push/PR. PR benchmark p50 values are gated against the latest
# 10-point moving average from their base branch; successful main-branch runs persist new baseline
# data. A manual run (workflow_dispatch) can opt out of the benchmarks via the run_benchmarks input.
#
# Jobs target the org's 'benchmark' runner group (provisioned with Docker + KVM on Linux and the
# Windows Hypervisor Platform on Windows); the sibling 'test' group is not. If your org uses a
# different runner group or labels, adjust the `runs-on:` blocks below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the benchmark suite
        type: boolean
        default: true
      run_hcn_afxdp:
        description: Run privileged external HCN vNIC + AF_XDP tests and benchmarks
        type: boolean
        default: false
      run_hcs:
        description: Run native HCS smoke tests and benchmarks
        type: boolean
        default: false

concurrency:
  # Cancel superseded runs of the same PR, but retain every merged-commit run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  # Match Nanvix's tolerance for noisy bare-metal benchmark runners.
  PERFORMANCE_REGRESSION_THRESHOLD: 40

jobs:
  # -----------------------------------------------------------------------------------------------
  # Build the Linux artifacts (PVH vmlinux + Alpine initramfs, plus the Python initramfs used by the
  # snapshot benchmark) once, in Docker, and publish them for the Linux and Windows jobs. The kernel
  # needs a Linux/GCC toolchain to compile, so this is the only place it is built.
  # -----------------------------------------------------------------------------------------------
  artifacts:
    name: Build artifacts
    runs-on:
      group: benchmark
      labels: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      RUN_BENCH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reclaim stale Docker build cache
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG"
          docker builder prune --all --force --filter until=168h

      - name: Cache kernel + initramfs
        id: cache-base
        uses: actions/cache@v5
        with:
          path: |
            build/vmlinux
            build/initramfs.cpio.gz
          key: microvm-artifacts-${{ hashFiles('docker/Dockerfile', 'scripts/nvx.py', 'scripts/nvx_tools/**', 'kernel/**', 'alpine/init', 'alpine/hcs-plan9.c') }}

      - name: Build kernel + initramfs (Docker)
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: python3 scripts/nvx.py build-linux-artifacts --dest build
        env:
          DEST: build
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config

      - name: Cache Python initramfs
        id: cache-python
        if: env.RUN_BENCH == 'true'
        uses: actions/cache@v5
        with:
          path: build/initramfs-python.cpio.gz
          key: microvm-python-${{ hashFiles('docker/Dockerfile', 'scripts/nvx.py', 'scripts/nvx_tools/**', 'alpine/init.python', 'alpine/hello.py', 'alpine/repl.py', 'alpine/net-hello.py', 'alpine/net-pandas.py') }}

      - name: Build Python initramfs (Docker)
        if: env.RUN_BENCH == 'true' && steps.cache-python.outputs.cache-hit != 'true'
        run: python3 scripts/nvx.py build-python-initramfs --docker --dest build
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config

      - name: Save run artifacts
        uses: actions/cache/save@v5
        with:
          path: |
            build/vmlinux
            build/initramfs.cpio.gz
            build/initramfs-python.cpio.gz
          key: run-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  # -----------------------------------------------------------------------------------------------
  # Linux / KVM: build the VMM, run the shared unit tests, the KVM protected-mode self-test, the
  # end-to-end boot smoke test, and the benchmark suite.
  # -----------------------------------------------------------------------------------------------
  linux:
    name: Linux / KVM
    needs: artifacts
    runs-on:
      group: benchmark
      labels: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      RUN_BENCH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true' }}
      KERNEL: ${{ github.workspace }}/build/vmlinux
      INITRD: ${{ github.workspace }}/build/initramfs.cpio.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Python tooling
        run: python3 -m compileall -q scripts alpine

      - name: Validate GitHub Actions workflow
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG"
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: Configure Cargo cache
        run: |
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git"
          mkdir -p "$RUNNER_TEMP/cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "NVX_ARTIFACT_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Toolchain versions
        run: |
          python3 --version
          rustc --version
          cargo --version

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Python tooling tests
        run: python3 -m unittest scripts/test_performance.py scripts/tests/test_nvx_tools.py -v

      - name: Restore run artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vmlinux
            build/initramfs.cpio.gz
            build/initramfs-python.cpio.gz
          key: run-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Self-test (KVM protected-mode)
        run: ./target/release/microvm --selftest

      - name: Boot smoke test
        run: python3 scripts/nvx.py test-boot

      - name: Prepare performance logs
        if: env.RUN_BENCH == 'true'
        run: |
          rm -rf build/performance
          mkdir -p build/performance

      - name: Benchmark — cold-start
        if: env.RUN_BENCH == 'true'
        run: python3 scripts/nvx.py measure-coldstart | tee build/performance/cold-start.log
        env:
          N: 5

      - name: Benchmark — virt-fs
        if: env.RUN_BENCH == 'true'
        run: python3 scripts/nvx.py bench-virtfs | tee build/performance/virtfs.log
        env:
          N: 3

      - name: Benchmark — snapshot/restore (Python)
        if: env.RUN_BENCH == 'true'
        run: python3 scripts/nvx.py snapshot-demo | tee build/performance/snapshot.log
        env:
          N: 5
          INITRD: ${{ github.workspace }}/build/initramfs-python.cpio.gz

      - name: Benchmark — snapshot/restore (shell)
        if: env.RUN_BENCH == 'true'
        run: python3 scripts/nvx.py bench-snapshot-shell --runs 5 --memories "64 128 256 512" | tee build/performance/shell-snapshot.log

      - name: Benchmark — networking + snapshot
        if: env.RUN_BENCH == 'true'
        env:
          N: 5
        run: python3 scripts/nvx.py bench-net-snapshot | tee build/performance/network.log

      - name: Smoke — networked Python snapshot
        if: env.RUN_BENCH == 'true'
        env:
          INITRD: ${{ github.workspace }}/build/initramfs-python.cpio.gz
          N: 1
        run: |
          set -euo pipefail
          if ! output=$(python3 scripts/nvx.py bench-net-snapshot-py 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          if grep -q 'NO DATA' <<<"$output"; then
            echo 'networked Python benchmark produced no data' >&2
            exit 1
          fi
          grep -q 'verified: HELLOPY-NET OK' <<<"$output"
          grep -q 'verified: PANDASPY-NET OK' <<<"$output"

      - name: Smoke — interactive snapshot boot
        if: env.RUN_BENCH == 'true'
        env:
          INITRD: ${{ github.workspace }}/build/initramfs-python.cpio.gz
          SNAP: ${{ runner.temp }}/nvx-pyrepl
        run: |
          set -euo pipefail
          rm -rf "$SNAP"
          python3 scripts/nvx.py snapshot-boot --smoke-test

      - name: Publish Linux / KVM benchmark table
        if: env.RUN_BENCH == 'true'
        run: |
          python3 scripts/performance.py collect \
            --platform linux-kvm \
            --commit "${GITHUB_SHA}" \
            --input-dir build/performance \
            --output-dir build/performance-results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Stage Linux / KVM performance logs
        if: always() && env.RUN_BENCH == 'true'
        run: |
          rm -rf performance-logs/linux-kvm
          mkdir -p performance-logs/linux-kvm
          cp build/performance/*.log performance-logs/linux-kvm/

      - name: Save Linux / KVM performance logs
        if: always() && env.RUN_BENCH == 'true'
        uses: actions/cache/save@v5
        with:
          path: performance-logs/linux-kvm
          key: performance-logs-linux-kvm-${{ github.run_id }}-${{ github.run_attempt }}

  # -----------------------------------------------------------------------------------------------
  # Windows / WHP: build the VMM, run the shared unit tests, the WHP protected-mode self-test, the
  # end-to-end boot smoke test, and the benchmark suite. Consumes the Linux artifacts built above.
  # -----------------------------------------------------------------------------------------------
  windows:
    name: Windows / WHP
    needs: artifacts
    runs-on:
      group: benchmark
      labels: [self-hosted, windows, x64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      RUN_BENCH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Python version
        run: >-
          python -c "import sys; print(sys.version); assert sys.version_info >= (3, 10),
          'Python 3.10 or newer is required'"

      - name: Validate Python tooling
        run: python -m compileall -q scripts alpine

      - name: Validate PowerShell tooling
        run: |
          $files = @(
            'scripts\benchmark-hcn-afxdp.ps1',
            'scripts\benchmark-hcn-afxdp-snapshot.ps1',
            'scripts\hcn-tools.psm1',
            'scripts\setup-hcn-endpoint.ps1',
            'scripts\cleanup-hcn-endpoint.ps1',
            'scripts\test-hcn-afxdp.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List Message, Extent
              throw "PowerShell syntax validation failed for $file"
            }
          }

      - name: Set up cross-OS cache tools
        run: .\scripts\setup-cross-os-cache.ps1

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Toolchain versions
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Python tooling tests
        run: python -m unittest scripts/test_performance.py scripts/tests/test_nvx_tools.py -v

      - name: Restore run artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vmlinux
            build/initramfs.cpio.gz
            build/initramfs-python.cpio.gz
          key: run-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Self-test (WHP protected-mode)
        run: .\target\release\microvm.exe --selftest

      - name: Boot smoke test
        timeout-minutes: 5
        run: python scripts\nvx.py test-boot

      - name: Prepare performance logs
        if: env.RUN_BENCH == 'true'
        run: |
          Remove-Item -Recurse -Force build\performance -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build\performance | Out-Null

      - name: Benchmark — cold-start
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py measure-coldstart --runs 5 *>&1 |
            Tee-Object -FilePath build\performance\cold-start.log

      - name: Benchmark — virt-fs
        if: env.RUN_BENCH == 'true'
        run: |
          $output = python scripts\nvx.py bench-virtfs --runs 3 *>&1 |
            Tee-Object -FilePath build\performance\virtfs.log |
            Out-String
          Write-Host $output
          if ($output -notmatch 'payload survived across runs\s+: 3/3') {
            throw 'virt-fs persistence verification failed'
          }

      - name: Benchmark — snapshot/restore (Python)
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py snapshot-demo --runs 5 *>&1 |
            Tee-Object -FilePath build\performance\snapshot.log

      - name: Benchmark — snapshot/restore (shell)
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-snapshot-shell --runs 5 --memories "64 128 256 512" *>&1 |
            Tee-Object -FilePath build\performance\shell-snapshot.log

      - name: Benchmark — networking + snapshot
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-net-snapshot --runs 5 *>&1 |
            Tee-Object -FilePath build\performance\network.log

      - name: Smoke — networked Python snapshot
        if: env.RUN_BENCH == 'true'
        run: |
          $output = python scripts\nvx.py bench-net-snapshot-py --runs 1 *>&1 | Out-String
          Write-Host $output
          if ($output -match 'NO DATA') { throw 'networked Python benchmark produced no data' }
          if ($output -notmatch 'verified: HELLOPY-NET OK') { throw 'hello-world network verification missing' }
          if ($output -notmatch 'verified: PANDASPY-NET OK') { throw 'pandas network verification missing' }

      - name: Smoke — interactive snapshot boot
        if: env.RUN_BENCH == 'true'
        run: |
          $snap = Join-Path $env:RUNNER_TEMP 'nvx-pyrepl'
          Remove-Item -Recurse -Force $snap -ErrorAction SilentlyContinue
          python scripts\nvx.py snapshot-boot --snapshot $snap --mem 512 --smoke-test

      - name: Publish Windows / WHP benchmark table
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\performance.py collect `
            --platform windows-whp `
            --commit $env:GITHUB_SHA `
            --input-dir build\performance `
            --output-dir build\performance-results `
            --require-network `
            --require-shell-snapshot `
            --require-shared-suite `
            --summary $env:GITHUB_STEP_SUMMARY

      - name: Stage Windows / WHP performance logs
        if: always() && env.RUN_BENCH == 'true'
        run: |
          Remove-Item -Recurse -Force performance-logs\windows-whp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path performance-logs\windows-whp | Out-Null
          Copy-Item build\performance\*.log performance-logs\windows-whp\

      - name: Save Windows / WHP performance logs
        if: always() && env.RUN_BENCH == 'true'
        uses: actions/cache/save@v5
        with:
          path: performance-logs/windows-whp
          key: performance-logs-windows-whp-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  # -----------------------------------------------------------------------------------------------
  # Native HCS: externally provision one endpoint, verify HCS can borrow it without deleting it,
  # and run the HCS snapshot benchmark family. This privileged lane is opt-in and never runs for
  # pull requests because its setup script mutates persistent host networking state.
  # -----------------------------------------------------------------------------------------------
  windows-hcs:
    name: Windows / HCS
    needs: [artifacts, windows]
    if: >-
      ${{
        (github.event_name == 'push' && vars.NVX_HCS_CI == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_hcs)
      }}
    runs-on: [self-hosted, windows, x64, hcn-afxdp]
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    env:
      RUN_BENCH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true' }}
      NVX_HCS_GUEST_ADDRESS: ${{ vars.NVX_HCS_GUEST_ADDRESS || '192.168.241.2' }}
      NVX_HCS_GATEWAY: ${{ vars.NVX_HCS_GATEWAY || '192.168.241.1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up cross-OS cache tools
        run: .\scripts\setup-cross-os-cache.ps1

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build (release)
        run: cargo build --release

      - name: Restore run artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vmlinux
            build/initramfs.cpio.gz
            build/initramfs-python.cpio.gz
          key: run-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: HCS preflight
        run: .\target\release\microvm.exe --backend hcs --selftest --log-level warn

      - name: Set up external HCN endpoint
        run: |
          $descriptor = Join-Path $env:RUNNER_TEMP 'nvx-hcs-endpoint.json'
          .\scripts\setup-hcn-endpoint.ps1 `
            -OutputPath $descriptor `
            -GuestAddress $env:NVX_HCS_GUEST_ADDRESS `
            -Gateway $env:NVX_HCS_GATEWAY
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "NVX_HCN_ENDPOINT_CONFIG=$descriptor$([Environment]::NewLine)",
            $utf8
          )

      - name: Smoke — externally managed HCN endpoint + HCS
        if: env.RUN_BENCH != 'true'
        timeout-minutes: 10
        run: |
          .\target\release\microvm.exe `
            --backend hcs `
            --kernel build\vmlinux `
            --initrd build\initramfs.cpio.gz `
            --mem 256 `
            --net "$env:NVX_HCS_GUEST_ADDRESS/24" `
            --hcn-endpoint-config $env:NVX_HCN_ENDPOINT_CONFIG `
            --exit-on-boot `
            --quiet

      - name: Prepare HCS performance logs
        if: env.RUN_BENCH == 'true'
        run: |
          Remove-Item -Recurse -Force build\performance-hcs -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build\performance-hcs | Out-Null

      - name: Benchmark — HCS cold-start
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-hcs-coldstart --runs 5 --mem 512 *>&1 |
            Tee-Object -FilePath build\performance-hcs\hcs-cold-start.log

      - name: Benchmark — HCS Plan9 virt-fs
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-hcs-virtfs --runs 3 --mem 512 *>&1 |
            Tee-Object -FilePath build\performance-hcs\hcs-virtfs.log

      - name: Benchmark — HCS snapshot/restore (shell)
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-hcs-snapshot-shell --runs 5 --memories "64 128 256 512" *>&1 |
            Tee-Object -FilePath build\performance-hcs\hcs-shell-snapshot.log

      - name: Benchmark — HCS snapshot/restore (Python)
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-hcs-snapshot-py --runs 5 --mem 512 *>&1 |
            Tee-Object -FilePath build\performance-hcs\hcs-python-snapshot.log

      - name: Allow HCS benchmark helper through Windows Firewall
        if: env.RUN_BENCH == 'true'
        run: |
          $rule = "nvx-hcs-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          New-NetFirewallRule `
            -Name $rule `
            -DisplayName $rule `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 8099 `
            -Profile Any | Out-Null
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "NVX_HCS_FIREWALL_RULE=$rule$([Environment]::NewLine)",
            $utf8
          )

      - name: Benchmark — external HCN endpoint + HCS snapshot
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-hcs-net-snapshot-py `
            --runs 5 `
            --mem 512 `
            --net "$env:NVX_HCS_GUEST_ADDRESS/24" `
            --hcn-endpoint-config $env:NVX_HCN_ENDPOINT_CONFIG *>&1 |
            Tee-Object -FilePath build\performance-hcs\hcs-network-snapshot.log

      - name: Remove HCS benchmark firewall rule
        if: always() && env.NVX_HCS_FIREWALL_RULE != ''
        run: Remove-NetFirewallRule -Name $env:NVX_HCS_FIREWALL_RULE -ErrorAction SilentlyContinue

      - name: Publish Windows / HCS benchmark table
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\performance.py collect `
            --platform windows-hcs `
            --commit $env:GITHUB_SHA `
            --input-dir build\performance-hcs `
            --output-dir build\performance-results `
            --require-network `
            --require-shared-suite `
            --summary $env:GITHUB_STEP_SUMMARY

      - name: Clean up external HCN endpoint
        if: always()
        run: |
          $descriptor = Join-Path $env:RUNNER_TEMP 'nvx-hcs-endpoint.json'
          .\scripts\cleanup-hcn-endpoint.ps1 -DescriptorPath $descriptor

      - name: Stage Windows / HCS performance logs
        if: always() && env.RUN_BENCH == 'true' && hashFiles('build/performance-hcs/*.log') != ''
        run: |
          Remove-Item -Recurse -Force performance-logs\windows-hcs -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path performance-logs\windows-hcs | Out-Null
          Copy-Item build\performance-hcs\*.log performance-logs\windows-hcs\

      - name: Save Windows / HCS performance logs
        if: always() && env.RUN_BENCH == 'true' && hashFiles('performance-logs/windows-hcs/*.log') != ''
        uses: actions/cache/save@v5
        with:
          path: performance-logs/windows-hcs
          key: performance-logs-windows-hcs-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  # -----------------------------------------------------------------------------------------------
  # Privileged Windows networking: externally create an HCN NAT endpoint, attach it to the host
  # namespace as a vNIC, bind every AF_XDP RSS queue, boot the WHP guest, and require an HTTP round
  # trip to the HCN gateway. Enable automatic main-branch runs with NVX_HCN_AFXDP_CI=true or opt in
  # manually. This job deliberately does not run for pull requests.
  # -----------------------------------------------------------------------------------------------
  windows-hcn-afxdp:
    name: Windows / HCN + AF_XDP
    needs: [artifacts, windows]
    if: >-
      ${{
        (github.event_name == 'push' && vars.NVX_HCN_AFXDP_CI == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_hcn_afxdp)
      }}
    runs-on: [self-hosted, windows, x64, hcn-afxdp]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      RUN_BENCH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_benchmarks == 'true' }}
      NVX_HCN_AFXDP_GUEST_ADDRESS: ${{ vars.NVX_HCN_AFXDP_GUEST_ADDRESS || '192.168.240.2' }}
      NVX_HCN_AFXDP_GATEWAY: ${{ vars.NVX_HCN_AFXDP_GATEWAY || '192.168.240.1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up cross-OS cache tools
        run: .\scripts\setup-cross-os-cache.ps1

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Toolchain versions
        run: |
          Write-Host $PSVersionTable.PSVersion
          rustc --version
          cargo --version

      - name: Build (release)
        run: cargo build --release

      - name: Restore run artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            build/vmlinux
            build/initramfs.cpio.gz
            build/initramfs-python.cpio.gz
          key: run-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Prepare HCN AF_XDP performance logs
        if: env.RUN_BENCH == 'true'
        run: |
          Remove-Item -Recurse -Force build\performance-hcn-afxdp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build\performance-hcn-afxdp | Out-Null

      - name: Benchmark — HCN AF_XDP cold-start
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py measure-coldstart --runs 5 *>&1 |
            Tee-Object -FilePath build\performance-hcn-afxdp\cold-start.log

      - name: Benchmark — HCN AF_XDP virt-fs
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-virtfs --runs 3 *>&1 |
            Tee-Object -FilePath build\performance-hcn-afxdp\virtfs.log

      - name: Benchmark — HCN AF_XDP snapshot/restore (Python)
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py snapshot-demo --runs 5 *>&1 |
            Tee-Object -FilePath build\performance-hcn-afxdp\snapshot.log

      - name: Benchmark — HCN AF_XDP snapshot/restore (shell)
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\nvx.py bench-snapshot-shell --runs 5 --memories "64 128 256 512" *>&1 |
            Tee-Object -FilePath build\performance-hcn-afxdp\shell-snapshot.log

      - name: Set up external HCN host vNIC
        run: |
          $descriptor = Join-Path $env:RUNNER_TEMP 'nvx-hcn-afxdp-endpoint.json'
          .\scripts\setup-hcn-endpoint.ps1 `
            -OutputPath $descriptor `
            -GuestAddress $env:NVX_HCN_AFXDP_GUEST_ADDRESS `
            -Gateway $env:NVX_HCN_AFXDP_GATEWAY `
            -AttachToHost
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "NVX_HCN_ENDPOINT_CONFIG=$descriptor$([Environment]::NewLine)",
            $utf8
          )

      - name: Smoke — external HCN vNIC + AF_XDP
        if: env.RUN_BENCH != 'true'
        timeout-minutes: 10
        run: |
          .\scripts\test-hcn-afxdp.ps1 `
            -EndpointConfig $env:NVX_HCN_ENDPOINT_CONFIG `
            -GuestAddress $env:NVX_HCN_AFXDP_GUEST_ADDRESS `
            -Gateway $env:NVX_HCN_AFXDP_GATEWAY `
            -TimeoutSeconds 300 `
            -LogPath build\performance\hcn-afxdp-smoke.log

      - name: Benchmark — external HCN vNIC + AF_XDP snapshot
        if: env.RUN_BENCH == 'true'
        timeout-minutes: 15
        run: |
          .\scripts\benchmark-hcn-afxdp-snapshot.ps1 `
            -Runs 5 `
            -EndpointConfig $env:NVX_HCN_ENDPOINT_CONFIG `
            -GuestAddress $env:NVX_HCN_AFXDP_GUEST_ADDRESS `
            -Gateway $env:NVX_HCN_AFXDP_GATEWAY `
            -TimeoutSeconds 300 `
            -SnapshotPath build\hcn-afxdp-netsnap *>&1 |
            Tee-Object -FilePath build\performance-hcn-afxdp\network.log

      - name: Publish Windows / HCN AF_XDP benchmark table
        if: env.RUN_BENCH == 'true'
        run: |
          python scripts\performance.py collect `
            --platform windows-hcn-afxdp `
            --commit $env:GITHUB_SHA `
            --input-dir build\performance-hcn-afxdp `
            --output-dir build\performance-results `
            --require-network `
            --require-shell-snapshot `
            --require-shared-suite `
            --summary $env:GITHUB_STEP_SUMMARY

      - name: Clean up external HCN host vNIC
        if: always()
        run: |
          $descriptor = Join-Path $env:RUNNER_TEMP 'nvx-hcn-afxdp-endpoint.json'
          .\scripts\cleanup-hcn-endpoint.ps1 -DescriptorPath $descriptor

      - name: Save HCN AF_XDP smoke log
        if: always() && env.RUN_BENCH != 'true' && hashFiles('build/performance/hcn-afxdp-smoke.log') != ''
        uses: actions/cache/save@v5
        with:
          path: build/performance/hcn-afxdp-smoke.log
          key: hcn-afxdp-smoke-log-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage Windows / HCN AF_XDP performance logs
        if: always() && env.RUN_BENCH == 'true' && hashFiles('build/performance-hcn-afxdp/network.log') != ''
        run: |
          Remove-Item -Recurse -Force performance-logs\windows-hcn-afxdp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path performance-logs\windows-hcn-afxdp | Out-Null
          Copy-Item build\performance-hcn-afxdp\* performance-logs\windows-hcn-afxdp\ -Recurse

      - name: Save Windows / HCN AF_XDP performance logs
        if: always() && env.RUN_BENCH == 'true' && hashFiles('performance-logs/windows-hcn-afxdp/network.log') != ''
        uses: actions/cache/save@v5
        with:
          path: performance-logs/windows-hcn-afxdp
          key: performance-logs-windows-hcn-afxdp-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  # -----------------------------------------------------------------------------------------------
  # Pull requests compare their p50 values with the moving average stored on the PR base branch.
  # The comparison runs on a GitHub-hosted worker so benchmark runners never need write access.
  # -----------------------------------------------------------------------------------------------
  performance-gate:
    name: Performance regression gate
    needs: [linux, windows]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Linux / KVM performance logs
        uses: actions/cache/restore@v5
        with:
          path: performance-logs/linux-kvm
          key: performance-logs-linux-kvm-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Restore Windows / WHP performance logs
        uses: actions/cache/restore@v5
        with:
          path: performance-logs/windows-whp
          key: performance-logs-windows-whp-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Collect p50 results
        run: |
          python3 scripts/performance.py collect \
            --platform linux-kvm \
            --commit "${GITHUB_SHA}" \
            --input-dir performance-logs/linux-kvm \
            --output-dir performance-results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite
          python3 scripts/performance.py collect \
            --platform windows-whp \
            --commit "${GITHUB_SHA}" \
            --input-dir performance-logs/windows-whp \
            --output-dir performance-results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite

      - name: Load base branch performance history
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p performance-baseline
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          for result in performance-results/*.csv; do
            filename="$(basename "${result}")"
            history="FETCH_HEAD:data/performance/${filename}"
            if git cat-file -e "${history}" 2>/dev/null; then
              git show "${history}" > "performance-baseline/${filename}"
            else
              echo "::notice::No ${filename} performance history on ${BASE_REF}; warming up the baseline"
            fi
          done

      - name: Gate on performance regressions
        run: |
          python3 scripts/performance.py gate \
            --baseline-dir performance-baseline \
            --target-dir performance-results \
            --window "${PERFORMANCE_BASELINE_WINDOW}" \
            --threshold "${PERFORMANCE_REGRESSION_THRESHOLD}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  # -----------------------------------------------------------------------------------------------
  # A successful push to main (including a merged PR) appends its p50 values to the in-tree history.
  # -----------------------------------------------------------------------------------------------
  performance-persist:
    name: Persist performance baseline
    needs: [linux, windows, windows-hcs, windows-hcn-afxdp]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success' &&
        (needs.windows-hcs.result == 'success' || needs.windows-hcs.result == 'skipped') &&
        (needs.windows-hcn-afxdp.result == 'success' || needs.windows-hcn-afxdp.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore Linux / KVM performance logs
        uses: actions/cache/restore@v5
        with:
          path: performance-logs/linux-kvm
          key: performance-logs-linux-kvm-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Restore Windows / WHP performance logs
        uses: actions/cache/restore@v5
        with:
          path: performance-logs/windows-whp
          key: performance-logs-windows-whp-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Windows / HCS performance logs
        if: needs.windows-hcs.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: performance-logs/windows-hcs
          key: performance-logs-windows-hcs-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Windows / HCN AF_XDP performance logs
        if: needs.windows-hcn-afxdp.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: performance-logs/windows-hcn-afxdp
          key: performance-logs-windows-hcn-afxdp-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Collect p50 results
        run: |
          python3 scripts/performance.py collect \
            --platform linux-kvm \
            --commit "${GITHUB_SHA}" \
            --input-dir performance-logs/linux-kvm \
            --output-dir performance-results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite
          python3 scripts/performance.py collect \
            --platform windows-whp \
            --commit "${GITHUB_SHA}" \
            --input-dir performance-logs/windows-whp \
            --output-dir performance-results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite

      - name: Collect Windows / HCS p50 results
        if: needs.windows-hcs.result == 'success'
        run: |
          python3 scripts/performance.py collect \
            --platform windows-hcs \
            --commit "${GITHUB_SHA}" \
            --input-dir performance-logs/windows-hcs \
            --output-dir performance-results \
            --require-network \
            --require-shared-suite

      - name: Collect Windows / HCN AF_XDP p50 results
        if: needs.windows-hcn-afxdp.result == 'success'
        run: |
          python3 scripts/performance.py collect \
            --platform windows-hcn-afxdp \
            --commit "${GITHUB_SHA}" \
            --input-dir performance-logs/windows-hcn-afxdp \
            --output-dir performance-results \
            --require-network \
            --require-shell-snapshot \
            --require-shared-suite

      - name: Persist results on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B performance-persist origin/main
            python3 scripts/performance.py persist \
              --source-dir performance-results \
              --history-dir data/performance
            git add data/performance

            if git diff --cached --quiet; then
              echo "No new performance results to persist"
              exit 0
            fi

            git commit --no-verify \
              -m "data: update performance baselines (${GITHUB_SHA}) [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "ERROR: failed to push performance baselines after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
