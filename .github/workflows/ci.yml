name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  artifacts:
    name: Build guest artifacts
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve OpenVMM revision
        id: openvmm
        run: echo "sha=$(git rev-parse :openvmm)" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenVMM
        uses: actions/checkout@v5
        with:
          repository: nanvix/openvmm
          ref: ${{ steps.openvmm.outputs.sha }}
          path: openvmm
          persist-credentials: false
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Validate runner
        run: |
          set -euo pipefail
          python3 --version
          docker version
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Validate Python tooling
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts benchmarks
          python3 -m unittest scripts/test_performance.py scripts/test_flamegraph.py -v

      - name: Verify source pins
        run: python3 scripts/nvx.py verify

      - name: Build guest artifacts (Docker)
        run: python3 scripts/nvx.py build-guest

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guest-artifacts-${{ github.run_attempt }}
          path: |
            build/vmlinux
            build/vmlinux.config
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
          if-no-files-found: error
          overwrite: true

  linux:
    name: Linux / KVM
    needs: artifacts
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve OpenVMM revision
        id: openvmm
        run: echo "sha=$(git rev-parse :openvmm)" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenVMM
        uses: actions/checkout@v5
        with:
          repository: nanvix/openvmm
          ref: ${{ steps.openvmm.outputs.sha }}
          path: openvmm
          persist-credentials: false
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Validate runner
        run: |
          set -euo pipefail
          python3 --version
          rustc --version
          cargo --version
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openvmm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Download guest artifacts
        uses: actions/download-artifact@v4
        with:
          name: guest-artifacts-${{ github.run_attempt }}
          path: build

      - name: Install OpenVMM build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git libarchive-tools

      - name: Build OpenVMM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py build-openvmm

      - name: KVM acceptance test
        run: >-
          python3 scripts/nvx.py benchmark --
          --suite e2e
          --backend kvm
          --warmups 1
          --runs 3
          --skip-build
          --output build/benchmarks/linux-kvm.json

      - name: Publish Linux / KVM benchmark results
        run: >-
          python3 scripts/performance.py collect-openvmm
          --platform linux-kvm
          --commit "${GITHUB_SHA}"
          --input build/benchmarks/linux-kvm.json
          --output-dir build/benchmarks
          --summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload Linux / KVM benchmark results
        if: always() && hashFiles('build/benchmarks/linux-kvm.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-linux-kvm-${{ github.run_attempt }}
          path: build/benchmarks
          if-no-files-found: error
          overwrite: true

  windows:
    name: Windows / WHP
    needs: artifacts
    runs-on: [self-hosted, windows, whp]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve OpenVMM revision
        id: openvmm
        run: |
          "sha=$(git rev-parse :openvmm)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve checkout identity
        id: checkout-identity
        run: |
          $domain, $username = [Security.Principal.WindowsIdentity]::GetCurrent().Name -split '\\', 2
          "domain=$domain" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "username=$username" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout OpenVMM
        uses: actions/checkout@v5
        env:
          USERDOMAIN: ${{ steps.checkout-identity.outputs.domain }}
          USERNAME: ${{ steps.checkout-identity.outputs.username }}
        with:
          repository: nanvix/openvmm
          ref: ${{ steps.openvmm.outputs.sha }}
          path: openvmm
          persist-credentials: false
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Validate runner
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Validate Python tooling
        run: |
          python -m compileall -q scripts benchmarks
          python -m unittest scripts/test_performance.py scripts/test_flamegraph.py -v

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openvmm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Download guest artifacts
        uses: actions/download-artifact@v4
        with:
          name: guest-artifacts-${{ github.run_attempt }}
          path: build

      - name: Build OpenVMM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts\nvx.py build-openvmm

      - name: WHP acceptance test
        run: >-
          python scripts\nvx.py benchmark --
          --suite e2e
          --backend whp
          --warmups 1
          --runs 3
          --skip-build
          --output build\benchmarks\windows-whp.json

      - name: Publish Windows / WHP benchmark results
        run: >-
          python scripts\performance.py collect-openvmm
          --platform windows-whp
          --commit $env:GITHUB_SHA
          --input build\benchmarks\windows-whp.json
          --output-dir build\benchmarks
          --summary $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows / WHP benchmark results
        if: always() && hashFiles('build/benchmarks/windows-whp.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-windows-whp-${{ github.run_attempt }}
          path: build/benchmarks
          if-no-files-found: error
          overwrite: true

  performance-gate:
    name: Performance regression gate
    needs: [linux, windows]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux / KVM benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-linux-kvm-${{ github.run_attempt }}
          path: performance-input/linux-kvm

      - name: Download Windows / WHP benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-windows-whp-${{ github.run_attempt }}
          path: performance-input/windows-whp

      - name: Collect p50 results
        run: |
          set -euo pipefail
          python3 scripts/performance.py collect-openvmm \
            --platform linux-kvm \
            --commit "${GITHUB_SHA}" \
            --input performance-input/linux-kvm/linux-kvm.json \
            --output-dir performance-results
          python3 scripts/performance.py collect-openvmm \
            --platform windows-whp \
            --commit "${GITHUB_SHA}" \
            --input performance-input/windows-whp/windows-whp.json \
            --output-dir performance-results

      - name: Load base branch performance history
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p performance-baseline
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          for result in performance-results/*.csv; do
            filename="$(basename "${result}")"
            candidate="benchmarks/baselines/performance/${filename}"
            history="FETCH_HEAD:benchmarks/baselines/performance/${filename}"
            if [ -f "${candidate}" ] &&
              [ "$(wc -l < "${candidate}")" -eq 1 ] &&
              [ "$(head -n 1 "${candidate}")" = "commit,metric,unit,direction,p50" ]; then
              cp "${candidate}" "performance-baseline/${filename}"
              echo "::notice::${filename} history is explicitly reset in this pull request; warming up the baseline"
            elif git cat-file -e "${history}" 2>/dev/null; then
              git show "${history}" > "performance-baseline/${filename}"
            else
              echo "::notice::No ${filename} performance history on ${BASE_REF}; warming up the baseline"
            fi
          done

      - name: Gate on performance regressions
        run: >-
          python3 scripts/performance.py gate
          --baseline-dir performance-baseline
          --target-dir performance-results
          --window "${PERFORMANCE_BASELINE_WINDOW}"
          --threshold "${PERFORMANCE_REGRESSION_THRESHOLD}"
          --absolute-tolerance-ms "${PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS}"
          --summary "${GITHUB_STEP_SUMMARY}"

  performance-persist:
    name: Persist performance baseline
    needs: [linux, windows]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Linux / KVM benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-linux-kvm-${{ github.run_attempt }}
          path: performance-input/linux-kvm

      - name: Download Windows / WHP benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-windows-whp-${{ github.run_attempt }}
          path: performance-input/windows-whp

      - name: Collect p50 results
        run: |
          set -euo pipefail
          python3 scripts/performance.py collect-openvmm \
            --platform linux-kvm \
            --commit "${GITHUB_SHA}" \
            --input performance-input/linux-kvm/linux-kvm.json \
            --output-dir performance-results
          python3 scripts/performance.py collect-openvmm \
            --platform windows-whp \
            --commit "${GITHUB_SHA}" \
            --input performance-input/windows-whp/windows-whp.json \
            --output-dir performance-results

      - name: Persist results on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B performance-persist origin/main
            python3 scripts/performance.py persist \
              --source-dir performance-results \
              --history-dir benchmarks/baselines/performance
            git add benchmarks/baselines/performance

            if git diff --cached --quiet; then
              echo "No new performance results to persist"
              exit 0
            fi

            git commit --no-verify \
              -m "data: update performance baselines (${GITHUB_SHA}) [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Failed to persist performance results after ${attempt} attempts"
              exit 1
            fi
          done
