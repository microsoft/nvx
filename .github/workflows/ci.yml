name: CI

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # The merge queue's groups of dev report the required check on the commit
  # that the queue merges (doc/ci.md#merge-queue).
  merge_group:
    types:
      - checks_requested
    branches:
      - dev
  push:
    branches:
      - dev
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('full-{0}', github.run_id) || github.event_name == 'merge_group' && format('merge-group-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # dev pushes wait in order instead of cancelling the run that waits. GitHub
  # rejects queueing together with cancel-in-progress, so pull requests keep
  # the single waiting run that a newer push replaces. Each merge group's run
  # has a group of its own: a pull request that returns to the queue on the
  # same base gets its earlier group's ref again, whose run must not hold the
  # new one.
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_BASELINE_MINIMUM_HISTORY: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  # The merge queue builds a pull request a new group whenever the queue ahead
  # of it changes, as when a group ahead fails or dev changes outside the
  # queue, and deletes the replaced group's branch but leaves its run running.
  # Each group's run cancels the unfinished runs of its pull request's earlier
  # groups, so that they free their runners (doc/ci.md#superseded-merge-groups).
  # Nothing waits for it, so a failure only warns.
  cancel-superseded-merge-groups:
    name: Cancel superseded merge group runs
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # The token can cancel any of the repository's runs, so the job runs the
      # command that the group's base branch has merged rather than the
      # group's copy. These steps still come from the group's ci.yml, though,
      # so this is no isolation boundary (doc/ci.md, "Superseded merge
      # groups").
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false

      - name: Cancel superseded merge group runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: >-
          python3 scripts/nvx.py cancel-superseded-merge-groups
          --repository "${GITHUB_REPOSITORY}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --run-id "${GITHUB_RUN_ID}"
          --ref "${MERGE_GROUP_REF}"
          --summary "${GITHUB_STEP_SUMMARY}"

  quality:
    name: Lint, typing, and formatting
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Scheduled and manually dispatched full runs save no caches, and neither
      # do merge groups, whose entries no other run could restore.
      - name: Check code quality
        uses: ./.github/actions/check-quality
        with:
          save-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

  nvx-rs:
    name: nvx-rs / ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check nvx-rs
        uses: ./.github/actions/check-nvx-rs

  # The NVX CLI tests do not depend on the backend, so they run once per OS on
  # GitHub-hosted runners rather than in every hypervisor job. They read
  # OpenVMM's pinned CPU profiles from the submodule, so they follow its
  # checkout, which needs the deploy key that fork pull requests lack. The
  # microVM and platform jobs of each OS wait for its result.
  nvx-cli-linux:
    name: NVX CLI / Linux
    if: >-
      ${{
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      # The release that the self-hosted runners provide.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The microVM tests run their microVMs and sandboxes with nvx-rs. A
      # static musl build runs on every self-hosted Linux runner, so the
      # microVM jobs take this one, as they take OpenVMM from its build jobs.
      # It goes where `cargo build --release` puts it, where nvx.py, and so
      # the CLI tests, look for it, and NVX_RS names it for the tests that run
      # it directly.
      - name: Build nvx-rs
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "${toolchain}"
          rustup toolchain install "${toolchain}" --profile minimal --no-self-update \
            --target x86_64-unknown-linux-musl
          cargo "+${toolchain}" build --release --locked --features cli \
            --manifest-path nvx-rs/Cargo.toml --target x86_64-unknown-linux-musl
          install -D -m 0755 nvx-rs/target/x86_64-unknown-linux-musl/release/nvx-rs \
            nvx-rs/target/release/nvx-rs
          echo "NVX_RS=${GITHUB_WORKSPACE}/nvx-rs/target/release/nvx-rs" >> "${GITHUB_ENV}"

      # Packages ship the build with its provenance, which binds it to the
      # nvx-rs sources, the pinned Rust release, the target, and the features.
      - name: Record nvx-rs provenance
        shell: bash
        run: >-
          python3 scripts/nvx.py record-nvx-rs-provenance
          --target x86_64-unknown-linux-musl

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      # nvx-rs's protocol and template tests read copies of OpenVMM's
      # control-session protocol vectors and of the lines of its platform
      # allowlist, because the nvx-rs job cannot check out OpenVMM. This job
      # can, so it compares the copies with the submodule's files, and
      # nvx::contract's versions of OpenVMM's contracts with OpenVMM's.
      - name: Compare OpenVMM's protocol vectors
        shell: bash
        run: >-
          cargo test --locked --manifest-path nvx-rs/Cargo.toml
          --no-default-features --test openvmm_vectors -- --ignored

      # nvx-rs run reads a copy of the identities of OpenVMM's built-in CPU
      # profiles, to guide a failed cold boot on a CPU that none serves, which
      # this job compares with the submodule's profiles as it does the vectors.
      - name: Compare OpenVMM's CPU profiles
        shell: bash
        run: >-
          cargo test --locked --manifest-path nvx-rs/Cargo.toml
          --no-default-features --test openvmm_cpu_profiles -- --ignored

      - name: Upload nvx-rs executable
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-linux-musl-executable
          path: nvx-rs/target/release/nvx-rs
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload nvx-rs provenance
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-linux-musl-provenance
          path: build/nvx-rs.provenance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  nvx-cli-windows:
    name: NVX CLI / Windows
    if: >-
      ${{
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      # The release that the self-hosted runners provide.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The curl shim test compiles the shim, and the next step builds nvx-rs,
      # with the release that rust-toolchain.toml pins, which rustup would
      # otherwise install with its default profile.
      - name: Install the pinned Rust release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $channel = Select-String -LiteralPath "rust-toolchain.toml" `
            -Pattern '^channel = "([^"]+)"' | Select-Object -First 1
          if ($null -eq $channel) {
            throw "rust-toolchain.toml does not pin a Rust release"
          }
          rustup toolchain install $channel.Matches[0].Groups[1].Value `
            --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # As on Linux, for the microVM jobs and the CLI tests. The static C
      # runtime spares the self-hosted runners the Visual C++ redistributable.
      - name: Build nvx-rs
        shell: powershell
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --features cli --manifest-path nvx-rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NVX_RS=$env:GITHUB_WORKSPACE\nvx-rs\target\release\nvx-rs.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record nvx-rs provenance
        shell: powershell
        run: |
          python scripts\nvx.py record-nvx-rs-provenance --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      # As on Linux.
      - name: Compare OpenVMM's protocol vectors
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked --manifest-path nvx-rs/Cargo.toml --no-default-features `
            --test openvmm_vectors -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # As on Linux.
      - name: Compare OpenVMM's CPU profiles
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked --manifest-path nvx-rs/Cargo.toml --no-default-features `
            --test openvmm_cpu_profiles -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload nvx-rs executable
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-windows-msvc-executable
          path: nvx-rs/target/release/nvx-rs.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload nvx-rs provenance
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-windows-msvc-provenance
          path: build/nvx-rs.provenance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  openvmm-changes:
    name: Detect CI workload inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-guest-artifacts: ${{ steps.changes.outputs.run-guest-artifacts }}
      run-openvmm-binaries: ${{ steps.changes.outputs.run-openvmm-binaries }}
      run-openvmm-unit-tests: ${{ steps.changes.outputs.run-openvmm-unit-tests }}
      run-openvmm-vmm-tests: ${{ steps.changes.outputs.run-openvmm-vmm-tests }}
      run-microvm-tests: ${{ steps.changes.outputs.run-microvm-tests }}
      run-benchmarks: ${{ steps.changes.outputs.run-benchmarks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # `nvx.py classify-ci-changes` selects the suites for pushes, pull
      # requests, and merge groups; this script selects the full matrix for
      # full-run events and whenever it cannot classify changed files. A merge
      # group compares its head, GITHUB_SHA, with the commit on which the
      # queue built it: the latest dev, or the group of the pull request ahead
      # of it, which checks that pull request's change.
      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: >-
            ${{
              github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
              github.event_name == 'merge_group' && github.event.merge_group.base_sha ||
              github.event.before
            }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          outputs=(
            run-guest-artifacts run-openvmm-binaries run-openvmm-unit-tests
            run-openvmm-vmm-tests run-microvm-tests run-benchmarks
          )

          run_everything() {
            for output in "${outputs[@]}"; do
              echo "${output}=true" >> "${GITHUB_OUTPUT}"
            done
            {
              echo "### Full matrix: run"
              echo "$1"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          if [[ "${EVENT_NAME}" == "schedule" ||
                "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_everything "The ${EVENT_NAME} event runs the full matrix without change classification."
            exit 0
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            run_everything "The comparison base is unavailable, so the safe fallback is to run the full matrix."
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            run_everything "A comparison commit is unavailable, so the safe fallback is to run the full matrix."
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/ci-changed-files"
          if ! git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_files}"; then
            run_everything "The changed files could not be determined, so the safe fallback is to run the full matrix."
            exit 0
          fi

          echo "Changes between \`${BASE_SHA}\` and \`${HEAD_SHA}\`:" >> "${GITHUB_STEP_SUMMARY}"
          classification="${RUNNER_TEMP}/ci-classification"
          if ! python3 scripts/nvx.py classify-ci-changes \
            --event-name "${EVENT_NAME}" \
            --changed-files "${changed_files}" --null \
            --summary "${GITHUB_STEP_SUMMARY}" > "${classification}"; then
            run_everything "The changes could not be classified, so the safe fallback is to run the full matrix."
            exit 0
          fi
          # A missing or malformed output would silently skip its suites.
          for output in "${outputs[@]}"; do
            if [[ "$(grep -Ecx "${output}=(true|false)" "${classification}")" != 1 ]]; then
              run_everything "The classification did not report \`${output}\`, so the safe fallback is to run the full matrix."
              exit 0
            fi
          done
          grep -Ex '[a-z-]+=(true|false)' "${classification}" >> "${GITHUB_OUTPUT}"

  # The kernel and the Alpine initramfs, which every job that boots a guest
  # reads, build beside the Ubuntu and Azure Linux images, which only the
  # microVM test and platform jobs read, so that a rebuild of those images
  # delays neither the OpenVMM VMM tests nor the debug-kernel jobs.
  artifacts:
    name: Build kernel and Alpine artifacts
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-guest-artifacts == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A push or a merge group reads its pull request's runs and downloads their
    # artifacts.
    permissions:
      actions: read
      contents: read
    outputs:
      guest-cache-keys: ${{ steps.guest-artifacts.outputs.cache-keys }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Full runs and merge groups build the guest artifacts that miss the
      # cache without saving them. A push or a merge group installs those that
      # its pull request's latest run built instead, when they check out.
      - name: Build guest artifacts
        id: guest-artifacts
        uses: ./.github/actions/build-guest-artifacts
        with:
          components: kernel alpine
          save-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          record-artifact: kernel-alpine-record
          reuse: ${{ github.event_name == 'merge_group' || github.event_name == 'push' }}

      # One artifact per component, so that each job downloads only the
      # components that it reads (doc/ci.md, "Guest artifact handoff").
      - name: Upload guest kernel
        uses: actions/upload-artifact@v7
        with:
          name: guest-kernel
          path: |
            build/vmlinux
            build/vmlinux.config
            build/vmlinux.provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Alpine initramfs
        uses: actions/upload-artifact@v7
        with:
          name: guest-alpine
          path: |
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
            build/initramfs.provenance.json
          if-no-files-found: error
          retention-days: 1

  distro-artifacts:
    name: Build Ubuntu and Azure Linux artifacts
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-guest-artifacts == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A push or a merge group reads its pull request's runs and downloads their
    # artifacts.
    permissions:
      actions: read
      contents: read
    outputs:
      guest-cache-keys: ${{ steps.guest-artifacts.outputs.cache-keys }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Full runs and merge groups build the guest artifacts that miss the
      # cache without saving them. A push or a merge group installs those that
      # its pull request's latest run built instead, when they check out.
      - name: Build guest artifacts
        id: guest-artifacts
        uses: ./.github/actions/build-guest-artifacts
        with:
          components: ubuntu azurelinux
          save-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          record-artifact: ubuntu-azurelinux-record
          reuse: ${{ github.event_name == 'merge_group' || github.event_name == 'push' }}

      - name: Upload Ubuntu initramfs
        uses: actions/upload-artifact@v7
        with:
          name: guest-ubuntu
          path: |
            build/initramfs-ubuntu.cpio.gz
            build/initramfs-ubuntu.cpio.gz.packages.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Ubuntu distro layer
        uses: actions/upload-artifact@v7
        with:
          name: guest-ubuntu-distro
          path: |
            build/ubuntu-distro.erofs
            build/ubuntu-distro.erofs.manifest.json
            build/ubuntu-smoke-scratch.ext4
          if-no-files-found: error
          retention-days: 1

      - name: Upload Azure Linux initramfs
        uses: actions/upload-artifact@v7
        with:
          name: guest-azurelinux
          path: |
            build/initramfs-azurelinux.cpio.gz
            build/initramfs-azurelinux.cpio.gz.packages.json
          if-no-files-found: error
          retention-days: 1

      # The Windows guest and sandbox job runs the runtime adapter's scenarios
      # with its guest agent, a static musl executable that Linux builds, as
      # it builds the images that the job reads. The Linux jobs build their
      # own.
      - name: Build the runtime adapter's guest agent
        shell: bash
        working-directory: tests/runtime-adapter
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' ../../rust-toolchain.toml)
          test -n "${toolchain}"
          rustup toolchain install "${toolchain}" --profile minimal --no-self-update \
            --target x86_64-unknown-linux-musl
          cargo "+${toolchain}" build --locked --release --features guest \
            --target x86_64-unknown-linux-musl --bin runtime-adapter-guest

      - name: Upload the runtime adapter's guest agent
        uses: actions/upload-artifact@v7
        with:
          name: runtime-adapter-guest
          path: tests/runtime-adapter/target/x86_64-unknown-linux-musl/release/runtime-adapter-guest
          if-no-files-found: error
          retention-days: 1

  # A dev push and a merge group reuse the guest artifact components that the
  # pull request that they merge built (see build-guest-artifacts). A
  # same-repository pull request rehearses that selection and check on the
  # artifacts that its own run uploaded, beside the jobs that use them, and
  # installs nothing; its merge group doesn't rehearse them again.
  guest-artifact-reuse:
    name: Rehearse guest artifact reuse
    needs: [openvmm-changes, artifacts, distro-artifacts]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.artifacts.result == 'success' &&
        needs.distro-artifacts.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-guest-artifacts == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Rehearse kernel and Alpine artifact reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GUEST_CACHE_KEYS: ${{ needs.artifacts.outputs.guest-cache-keys }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/nvx.py reuse-guest-artifacts --dry-run
          --repository "${GITHUB_REPOSITORY}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --head-sha "${HEAD_SHA}"
          --components "kernel alpine"
          --record-artifact kernel-alpine-record
          --keys "${GUEST_CACHE_KEYS}"

      - name: Rehearse Ubuntu and Azure Linux artifact reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GUEST_CACHE_KEYS: ${{ needs.distro-artifacts.outputs.guest-cache-keys }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/nvx.py reuse-guest-artifacts --dry-run
          --repository "${GITHUB_REPOSITORY}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --head-sha "${HEAD_SHA}"
          --components "ubuntu azurelinux"
          --record-artifact ubuntu-azurelinux-record
          --keys "${GUEST_CACHE_KEYS}"

  # Beside the shared artifacts, so that a kernel rebuild doesn't delay the
  # jobs that don't use the debug kernel.
  debug-kernel:
    name: Build CI debug kernel
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-guest-artifacts == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the CI debug kernel
