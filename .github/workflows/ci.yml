name: CI

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  quality:
    name: Lint, typing, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check code quality
        env:
          SHELLCHECK: >-
            docker run --rm --volume ${{ github.workspace }}:/workspace:ro
            --workdir /workspace
            koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
            shellcheck
          SHFMT: >-
            docker run --rm --volume ${{ github.workspace }}:/workspace:ro
            --workdir /workspace
            mvdan/shfmt@sha256:307d265ffd25ce832899ae17c93ed5062fc3375c514bba8f52cbf52792735c4d
        run: make check

  artifacts:
    name: Build shared artifacts
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Validate runner
        run: |
          set -euo pipefail
          python3 --version
          rustc --version
          cargo --version
          docker version
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Validate Python tooling
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts benchmarks
          python3 -m unittest scripts/test_performance.py scripts/test_nvx_tools.py -v
          python3 scripts/nvx.py benchmark --help

      - name: Verify source pins
        run: python3 scripts/nvx.py verify

      - name: Cache Linux guest artifacts
        id: cache-linux-guest
        uses: actions/cache@v5
        with:
          path: |
            build/vmlinux
            build/vmlinux.config
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
          key: linux-guest-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/**', 'SOURCE-MANIFEST.json', 'kernel/**', 'alpine/**', 'scripts/nvx.py', 'scripts/nvx_tools/**') }}

      - name: Build guest artifacts (Docker)
        if: steps.cache-linux-guest.outputs.cache-hit != 'true'
        run: python3 scripts/nvx.py build-guest

      - name: Resolve portable OpenVMM build identity
        id: portable-openvmm-build
        run: |
          set -euo pipefail
          rustc_sha="$(rustc -Vv | sed -n 's/^commit-hash: //p')"
          test -n "${rustc_sha}"
          echo "rustc-sha=${rustc_sha}" >> "${GITHUB_OUTPUT}"

      - name: Cache portable OpenVMM
        id: cache-portable-openvmm
        uses: actions/cache@v5
        with:
          path: openvmm/target/x86_64-unknown-linux-musl/release/openvmm
          key: portable-openvmm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}-${{ steps.portable-openvmm-build.outputs.rustc-sha }}

      - name: Build portable OpenVMM for MSHV
        if: steps.cache-portable-openvmm.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f openvmm/.packages/extracted/x86_64-sysroot/lib/libsymcrypt.a ]; then
            (cd openvmm && cargo xflowey restore-packages --no-compat-igvm)
          fi
          rustup target add x86_64-unknown-linux-musl
          sysroot="$(cd openvmm && pwd)/.packages/extracted/x86_64-sysroot"
          export X86_64_UNKNOWN_LINUX_MUSL_OPENSSL_DIR="$sysroot"
          export X86_64_UNKNOWN_LINUX_MUSL_OPENSSL_NO_VENDOR=1
          export X86_64_UNKNOWN_LINUX_MUSL_OPENSSL_STATIC=1
          export X86_64_UNKNOWN_LINUX_MUSL_SYMCRYPT_LIB_PATH="$sysroot/lib"
          export X86_64_UNKNOWN_LINUX_MUSL_SYMCRYPT_STATIC=1
          (cd openvmm && cargo build \
            --release \
            --target x86_64-unknown-linux-musl \
            -p openvmm \
            --bin openvmm)

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guest-artifacts-${{ github.run_id }}
          path: |
            build/vmlinux
            build/vmlinux.config
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
          if-no-files-found: error
          overwrite: true

      - name: Upload portable OpenVMM
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-linux-mshv-${{ github.run_id }}
          path: openvmm/target/x86_64-unknown-linux-musl/release/openvmm
          if-no-files-found: error
          overwrite: true

  linux:
    name: Linux / KVM
    needs: artifacts
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        run: |
          set -euo pipefail
          python3 --version
          rustc --version
          cargo --version
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Run Linux / KVM benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: kvm
          platform: linux-kvm

  mshv:
    name: Linux / MSHV
    needs: artifacts
    runs-on: [self-hosted, linux, mshv]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        run: |
          set -euo pipefail
          python3 --version
          rustc --version
          cargo --version
          test -r /dev/mshv
          test -w /dev/mshv
          sudo -n true

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Download portable OpenVMM
        uses: actions/download-artifact@v4
        with:
          name: openvmm-linux-mshv-${{ github.run_id }}
          path: openvmm/target/release

      - name: Prepare portable OpenVMM
        run: chmod +x openvmm/target/release/openvmm

      - name: Run Linux / MSHV benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: mshv
          platform: linux-mshv
          teardown-mode: host-terminate

  windows:
    name: Windows / WHP
    needs: artifacts
    runs-on: [self-hosted, windows, whp]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Validate Python tooling
        run: |
          python -m compileall -q scripts benchmarks
          python -m unittest scripts/test_performance.py scripts/test_nvx_tools.py -v
          python scripts\nvx.py benchmark --help

      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Run Windows / WHP benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: whp
          platform: windows-whp

  performance-gate:
    name: Performance regression gate
    needs: [linux, mshv, windows]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.mshv.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare performance results
        uses: ./.github/actions/prepare-performance-results

      - name: Load base branch performance history
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p performance-baseline
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          for result in performance-results/*.csv; do
            filename="$(basename "${result}")"
            candidate="benchmarks/baselines/performance/${filename}"
            history="FETCH_HEAD:benchmarks/baselines/performance/${filename}"
            if [ -f "${candidate}" ] &&
              [ "$(wc -l < "${candidate}")" -eq 1 ] &&
              [ "$(head -n 1 "${candidate}")" = "commit,metric,unit,direction,p50" ]; then
              cp "${candidate}" "performance-baseline/${filename}"
              echo "::notice::${filename} history is explicitly reset in this pull request; warming up the baseline"
            elif git cat-file -e "${history}" 2>/dev/null; then
              git show "${history}" > "performance-baseline/${filename}"
            else
              echo "::notice::No ${filename} performance history on ${BASE_REF}; warming up the baseline"
            fi
          done

      - name: Gate on performance regressions
        run: >-
          python3 scripts/nvx.py performance gate
          --baseline-dir performance-baseline
          --target-dir performance-results
          --window "${PERFORMANCE_BASELINE_WINDOW}"
          --threshold "${PERFORMANCE_REGRESSION_THRESHOLD}"
          --absolute-tolerance-ms "${PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS}"
          --summary "${GITHUB_STEP_SUMMARY}"

  performance-persist:
    name: Persist performance baseline
    needs: [linux, mshv, windows]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.mshv.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare performance results
        uses: ./.github/actions/prepare-performance-results

      - name: Persist results on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B performance-persist origin/main
            python3 scripts/nvx.py performance persist \
              --source-dir performance-results \
              --history-dir benchmarks/baselines/performance
            git add benchmarks/baselines/performance

            if git diff --cached --quiet; then
              echo "No new performance results to persist"
              exit 0
            fi

            git commit --no-verify \
              -m "data: update performance baselines (${GITHUB_SHA}) [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Failed to persist performance results after ${attempt} attempts"
              exit 1
            fi
          done
