      runner: '["self-hosted", "linux", "mshv", "virtual-machine", "general"]'
      backend: mshv
      openvmm-artifact: openvmm-linux-gnu
      nvx-rs-artifact: nvx-rs-linux-musl
      shard: ${{ matrix.shard }}
      shard-count: ${{ strategy.job-total }}
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  nvx-microvm-tests-whp:
    name: NVX microVM tests / Windows / WHP / Shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: [artifacts, build-openvmm-windows-msvc, nvx-cli-windows, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        needs.build-openvmm-windows-msvc.result == 'success' &&
        needs.nvx-cli-windows.result == 'success' &&
