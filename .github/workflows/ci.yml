name: CI

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_BASELINE_MINIMUM_HISTORY: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  quality:
    name: Lint, typing, and formatting
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check code quality
        uses: ./.github/actions/check-quality

  aci-edge-sandboxes:
    name: aci-edge-sandboxes / ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The release that the self-hosted runners provide, for `nvx.py test-agent-bundling`.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check aci_edge_sandboxes
        uses: ./.github/actions/check-aci-edge-sandboxes

  nvx-rs:
    name: nvx-rs / ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check nvx-rs
        uses: ./.github/actions/check-nvx-rs

  # The NVX CLI tests do not depend on the backend, so they run once per OS on
  # GitHub-hosted runners rather than in every hypervisor job. They read
  # OpenVMM's pinned CPU profiles from the submodule, so they follow its
  # checkout, which needs the deploy key that fork pull requests lack. The
  # microVM and platform jobs of each OS wait for its result.
  nvx-cli-linux:
    name: NVX CLI / Linux
    if: >-
      ${{
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      # The release that the self-hosted runners provide.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # nvx.py runs nvx-rs for its sandbox command and for the egress and
      # artifact steps of its run command. A static musl build runs on every
      # self-hosted Linux runner, so the microVM jobs take this one, as they
      # take OpenVMM from its build jobs. It goes where `cargo build
      # --release` puts it, where nvx.py, and so the CLI tests, look for it,
      # and NVX_RS names it for the tests that run it directly.
      - name: Build nvx-rs
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "${toolchain}"
          rustup toolchain install "${toolchain}" --profile minimal --no-self-update \
            --target x86_64-unknown-linux-musl
          cargo "+${toolchain}" build --release --locked --features cli \
            --manifest-path nvx-rs/Cargo.toml --target x86_64-unknown-linux-musl
          install -D -m 0755 nvx-rs/target/x86_64-unknown-linux-musl/release/nvx-rs \
            nvx-rs/target/release/nvx-rs
          echo "NVX_RS=${GITHUB_WORKSPACE}/nvx-rs/target/release/nvx-rs" >> "${GITHUB_ENV}"

      # Packages ship the build with its provenance, which binds it to the
      # nvx-rs sources, the pinned Rust release, the target, and the features.
      - name: Record nvx-rs provenance
        shell: bash
        run: >-
          python3 scripts/nvx.py record-nvx-rs-provenance
          --target x86_64-unknown-linux-musl

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Upload nvx-rs executable
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-linux-musl-executable
          path: nvx-rs/target/release/nvx-rs
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload nvx-rs provenance
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-linux-musl-provenance
          path: build/nvx-rs.provenance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  nvx-cli-windows:
    name: NVX CLI / Windows
    if: >-
      ${{
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      # The release that the self-hosted runners provide.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The curl shim test compiles the shim, and the next step builds nvx-rs,
      # with the release that rust-toolchain.toml pins, which rustup would
      # otherwise install with its default profile.
      - name: Install the pinned Rust release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $channel = Select-String -LiteralPath "rust-toolchain.toml" `
            -Pattern '^channel = "([^"]+)"' | Select-Object -First 1
          if ($null -eq $channel) {
            throw "rust-toolchain.toml does not pin a Rust release"
          }
          rustup toolchain install $channel.Matches[0].Groups[1].Value `
            --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # As on Linux, for the microVM jobs and the CLI tests. The static C
      # runtime spares the self-hosted runners the Visual C++ redistributable.
      - name: Build nvx-rs
        shell: powershell
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --features cli --manifest-path nvx-rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NVX_RS=$env:GITHUB_WORKSPACE\nvx-rs\target\release\nvx-rs.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record nvx-rs provenance
        shell: powershell
        run: |
          python scripts\nvx.py record-nvx-rs-provenance --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Upload nvx-rs executable
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-windows-msvc-executable
          path: nvx-rs/target/release/nvx-rs.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload nvx-rs provenance
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-windows-msvc-provenance
          path: build/nvx-rs.provenance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  openvmm-changes:
    name: Detect CI workload inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
      run-workloads: ${{ steps.changes.outputs.run-workloads }}
      run-openvmm-unit-tests: ${{ steps.changes.outputs.run-openvmm-unit-tests }}
      run-openvmm-vmm-tests: ${{ steps.changes.outputs.run-openvmm-vmm-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # `nvx.py classify-ci-changes` selects the suites; this script only
      # resolves the changed files and runs the full matrix whenever it
      # cannot classify them.
      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          outputs=(run-tests run-workloads run-openvmm-unit-tests run-openvmm-vmm-tests)

          run_everything() {
            for output in "${outputs[@]}"; do
              echo "${output}=true" >> "${GITHUB_OUTPUT}"
            done
            {
              echo "### Full matrix: run"
              echo "$1"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            run_everything "The comparison base is unavailable, so the safe fallback is to run the full matrix."
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            run_everything "A comparison commit is unavailable, so the safe fallback is to run the full matrix."
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/ci-changed-files"
          if ! git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_files}"; then
            run_everything "The changed files could not be determined, so the safe fallback is to run the full matrix."
            exit 0
          fi

          echo "Changes between \`${BASE_SHA}\` and \`${HEAD_SHA}\`:" >> "${GITHUB_STEP_SUMMARY}"
          classification="${RUNNER_TEMP}/ci-classification"
          if ! python3 scripts/nvx.py classify-ci-changes \
            --event-name "${EVENT_NAME}" \
            --changed-files "${changed_files}" --null \
            --summary "${GITHUB_STEP_SUMMARY}" > "${classification}"; then
            run_everything "The changes could not be classified, so the safe fallback is to run the full matrix."
            exit 0
          fi
          # A missing or malformed output would silently skip its suites.
          for output in "${outputs[@]}"; do
            if [[ "$(grep -Ecx "${output}=(true|false)" "${classification}")" != 1 ]]; then
              run_everything "The classification did not report \`${output}\`, so the safe fallback is to run the full matrix."
              exit 0
            fi
          done
          grep -Ex '[a-z-]+=(true|false)' "${classification}" >> "${GITHUB_OUTPUT}"

  artifacts:
    name: Build shared artifacts
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build guest artifacts
        id: guest-artifacts
        uses: ./.github/actions/build-guest-artifacts

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v7
        with:
          name: guest-artifacts
          path: |
            build/vmlinux
            build/vmlinux.config
            build/vmlinux.provenance.json
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
            build/initramfs.provenance.json
            build/initramfs-ubuntu.cpio.gz
            build/initramfs-ubuntu.cpio.gz.packages.json
            build/initramfs-azurelinux.cpio.gz
            build/initramfs-azurelinux.cpio.gz.packages.json
            build/ubuntu-distro.erofs
            build/ubuntu-distro.erofs.manifest.json
            build/ubuntu-smoke-scratch.ext4
          if-no-files-found: error
          retention-days: 1

  # Beside the shared artifacts, so that a kernel rebuild doesn't delay the
  # jobs that don't use the debug kernel.
  debug-kernel:
    name: Build CI debug kernel
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the CI debug kernel
        uses: ./.github/actions/build-guest-artifacts
        with:
          debug-kernel: "true"
          guest-images: "false"

      - name: Upload guest debug kernel
        uses: actions/upload-artifact@v7
        with:
          name: guest-debug-kernel
          path: |
            build/vmlinux-debug
            build/vmlinux-debug.config
            build/vmlinux-debug.provenance.json
          if-no-files-found: error
          retention-days: 1

  build-openvmm-linux-gnu:
    name: OpenVMM binary / Linux GNU
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    uses: ./.github/workflows/build-openvmm-binary.yml
    with:
      display-name: Linux GNU
      runner: '["self-hosted", "linux", "kvm", "virtual-machine"]'
      backend: kvm
      artifact: openvmm-linux-gnu
      binary: openvmm/target/release/openvmm
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  build-openvmm-linux-musl:
    name: OpenVMM binary / Linux musl
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    uses: ./.github/workflows/build-openvmm-binary.yml
    with:
      display-name: Linux musl
      runner: '["self-hosted", "linux", "mshv", "virtual-machine"]'
      backend: mshv
      artifact: openvmm-linux-musl
      binary: openvmm/target/release/openvmm
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  build-openvmm-windows-msvc:
    name: OpenVMM binary / Windows MSVC
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    uses: ./.github/workflows/build-openvmm-binary.yml
    with:
      display-name: Windows MSVC
      runner: '["self-hosted", "windows", "whp", "virtual-machine"]'
      backend: whp
      artifact: openvmm-windows-msvc
      binary: openvmm/target/release/openvmm.exe
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  openvmm-vmm-tests:
    name: OpenVMM vmm-tests / ${{ matrix.name }}
    needs: [artifacts, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-openvmm-vmm-tests == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / KVM
            backend: kvm
            runner: '["self-hosted", "linux", "kvm", "virtual-machine"]'
          - name: Linux / MSHV
            backend: mshv
            runner: '["self-hosted", "linux", "mshv", "virtual-machine"]'
          - name: Windows / WHP
            backend: whp
            runner: '["self-hosted", "windows", "whp", "virtual-machine"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: guest-artifacts
          path: build

      - name: Prepare Windows cache tools
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py setup-cross-os-cache

      - name: Prepare Linux cache tools
        id: cache-tools-linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

      - name: Restore OpenVMM inputs on Linux
        id: restore-openvmm-inputs-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM inputs on Windows
        id: restore-openvmm-inputs-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Linux
        id: restore-openvmm-cargo-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Windows
        id: restore-openvmm-cargo-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare sccache
        uses: ./.github/actions/sccache
        with:
          operation: start

      - name: Run OpenVMM tests on KVM
        if: matrix.backend == 'kvm'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Run OpenVMM tests on MSHV
        if: matrix.backend == 'mshv'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Run OpenVMM tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts\nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Upload OpenVMM test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openvmm-vmm-tests-${{ runner.os }}-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.os == 'Windows' && format('{0}/{1}/test_results', runner.temp, matrix.backend) || 'openvmm/target/vmm_tests/test_results' }}
          if-no-files-found: warn
          retention-days: 7

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache
        with:
          operation: stop

      - name: Save OpenVMM inputs on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-inputs-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM inputs on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-inputs-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-cargo-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}

      - name: Save shared Cargo cache on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-cargo-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-vmm-tests-${{ hashFiles('openvmm/Cargo.lock') }}

  openvmm-unit-tests:
    name: OpenVMM unit tests / ${{ matrix.name }}
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-openvmm-unit-tests == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The suites run once per OS: the tests that need /dev/kvm or
        # /dev/mshv are ignored, so the KVM and MSHV runners ran the same
        # tests. The MSHV pool has the most runners.
        include:
          - name: Linux
            backend: mshv
            runner: '["self-hosted", "linux", "mshv", "virtual-machine"]'
          - name: Windows
            backend: whp
            runner: '["self-hosted", "windows", "whp", "virtual-machine"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Prepare Windows cache tools
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py setup-cross-os-cache

      - name: Prepare Linux cache tools
        id: cache-tools-linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

      - name: Restore OpenVMM inputs on Linux
        id: restore-openvmm-inputs-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM inputs on Windows
        id: restore-openvmm-inputs-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Linux
        id: restore-openvmm-cargo-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Windows
        id: restore-openvmm-cargo-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare sccache
        uses: ./.github/actions/sccache
        with:
          operation: start

      - name: Run OpenVMM unit tests on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/nvx.py test-openvmm-unit

      - name: Run OpenVMM unit tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py test-openvmm-unit

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache
        with:
          operation: stop

      - name: Save OpenVMM inputs on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-inputs-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM inputs on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-inputs-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-cargo-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-unit-tests-${{ hashFiles('openvmm/Cargo.lock') }}

      - name: Save shared Cargo cache on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-cargo-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
