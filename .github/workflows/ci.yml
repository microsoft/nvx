  nvx-microvm-debug-whp:
    name: NVX microVM tests / Windows / WHP / Debug kernel
    needs: [artifacts, debug-kernel, build-openvmm-windows-msvc, nvx-cli-windows, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name != 'pull_request' &&
        github.event_name != 'merge_group' &&
        needs.artifacts.result == 'success' &&
        needs.debug-kernel.result == 'success' &&
