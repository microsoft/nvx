name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  quality:
    name: Lint, typing, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check code quality
        uses: ./.github/actions/check-quality

  artifacts:
    name: Build shared artifacts
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 60
    outputs:
      kernel-cache-key: ${{ steps.guest-artifacts.outputs.kernel-cache-key }}
      alpine-cache-key: ${{ steps.guest-artifacts.outputs.alpine-cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: kvm
          require-docker: "true"

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Build guest artifacts
        id: guest-artifacts
        uses: ./.github/actions/build-guest-artifacts

      - name: Build portable OpenVMM
        uses: ./.github/actions/build-portable-openvmm
        with:
          openvmm-sha: ${{ steps.openvmm.outputs.sha }}

  linux:
    name: Linux / KVM
    needs: artifacts
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: kvm

      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Run Linux / KVM benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: kvm
          platform: linux-kvm
          kernel-cache-key: ${{ needs.artifacts.outputs.kernel-cache-key }}
          alpine-cache-key: ${{ needs.artifacts.outputs.alpine-cache-key }}

      - name: Package Linux / KVM release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: ./.github/actions/package-release
        with:
          platform: linux-kvm

  mshv:
    name: Linux / MSHV
    needs: artifacts
    runs-on: [self-hosted, linux, mshv]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: mshv

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Prepare portable OpenVMM
        uses: ./.github/actions/prepare-portable-openvmm
        with:
          openvmm-sha: ${{ steps.openvmm.outputs.sha }}

      - name: Run Linux / MSHV benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: mshv
          platform: linux-mshv
          teardown-mode: host-terminate
          kernel-cache-key: ${{ needs.artifacts.outputs.kernel-cache-key }}
          alpine-cache-key: ${{ needs.artifacts.outputs.alpine-cache-key }}

      - name: Package Linux / MSHV release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: ./.github/actions/package-release
        with:
          platform: linux-mshv
          cache-compression: gzip

  windows:
    name: Windows / WHP
    needs: artifacts
    runs-on: [self-hosted, windows, whp]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: whp

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Run Windows / WHP benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: whp
          platform: windows-whp
          kernel-cache-key: ${{ needs.artifacts.outputs.kernel-cache-key }}
          alpine-cache-key: ${{ needs.artifacts.outputs.alpine-cache-key }}

      - name: Package Windows / WHP release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: ./.github/actions/package-release
        with:
          platform: windows-whp

  release:
    name: Publish development release
    needs: [quality, linux, mshv, windows]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        !cancelled() &&
        needs.quality.result == 'success' &&
        needs.linux.result == 'success' &&
        needs.mshv.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Publish development release
        uses: ./.github/actions/publish-development-release

  performance-gate:
    name: Performance regression gate
    needs: [linux, mshv, windows]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.mshv.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate on performance regressions
        uses: ./.github/actions/gate-performance
        with:
          base-ref: dev
          baseline-window: ${{ env.PERFORMANCE_BASELINE_WINDOW }}
          regression-threshold: ${{ env.PERFORMANCE_REGRESSION_THRESHOLD }}
          absolute-tolerance-ms: ${{ env.PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS }}

  performance-persist:
    name: Persist performance baseline
    needs: [linux, mshv, windows]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        !cancelled() &&
        needs.linux.result == 'success' &&
        needs.mshv.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Persist results on dev
        uses: ./.github/actions/persist-performance-results
        with:
          branch: dev
