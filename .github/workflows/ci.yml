name: CI

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_WINDOW: 10
  PERFORMANCE_BASELINE_MINIMUM_HISTORY: 10
  PERFORMANCE_REGRESSION_THRESHOLD: 50
  PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS: 10

jobs:
  quality:
    name: Lint, typing, and formatting
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check code quality
        uses: ./.github/actions/check-quality

  openvmm-changes:
    name: Detect CI workload inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
      run-workloads: ${{ steps.changes.outputs.run-workloads }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          run_tests() {
            echo "run-tests=true" >> "${GITHUB_OUTPUT}"
            echo "### OpenVMM tests: run" >> "${GITHUB_STEP_SUMMARY}"
            echo "$1" >> "${GITHUB_STEP_SUMMARY}"
          }

          run_workloads() {
            echo "run-workloads=true" >> "${GITHUB_OUTPUT}"
            echo "### Artifact-backed tests and benchmarks: run" >> "${GITHUB_STEP_SUMMARY}"
            echo "$1" >> "${GITHUB_STEP_SUMMARY}"
          }

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            run_tests "The comparison base is unavailable, so the safe fallback is to run the matrix."
            run_workloads "The comparison base is unavailable, so the safe fallback is to run the workloads."
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            run_tests "A comparison commit is unavailable, so the safe fallback is to run the matrix."
            run_workloads "A comparison commit is unavailable, so the safe fallback is to run the workloads."
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/ci-changed-files"
          if ! git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${changed_files}"; then
            run_tests "The changed files could not be determined, so the safe fallback is to run the matrix."
            run_workloads "The changed files could not be determined, so the safe fallback is to run the workloads."
            exit 0
          fi

          documentation_paths='^(doc/|.*\.md$)'
          if [[ -s "${changed_files}" ]] &&
             ! grep -Eivq "${documentation_paths}" "${changed_files}"; then
            echo "run-workloads=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### Artifact-backed tests and benchmarks: skip"
              echo "Only documentation files changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            run_workloads "At least one non-documentation file changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
          fi

          relevant_paths='^(openvmm($|/)|\.github/workflows/ci\.yml$|\.github/actions/(build-guest-artifacts|build-openvmm|checkout-openvmm|setup-curl|validate-nvx|validate-runner)/|scripts/nvx\.py$|scripts/nvx_tools/|kernel/|alpine/|docker/Dockerfile$|SOURCE-MANIFEST\.json$)'
          if grep -Eq "${relevant_paths}" "${changed_files}"; then
            run_tests "At least one OpenVMM test input changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
          else
            echo "run-tests=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### OpenVMM tests: skip"
              echo "No OpenVMM test inputs changed between \`${BASE_SHA}\` and \`${HEAD_SHA}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  artifacts:
    name: Build shared artifacts
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build guest artifacts
        id: guest-artifacts
        uses: ./.github/actions/build-guest-artifacts

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guest-artifacts
          path: |
            build/vmlinux
            build/vmlinux.config
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
          if-no-files-found: error
          retention-days: 1

  openvmm-binaries:
    name: OpenVMM binary / ${{ matrix.name }}
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU
            runner: '["self-hosted", "linux", "kvm", "virtual-machine", "azure-kvm-3"]'
            backend: kvm
            target: x86_64-unknown-linux-gnu
            build-mode: native
            artifact: openvmm-linux-gnu
            binary: openvmm/target/release/openvmm
          - name: Linux musl
            runner: '["self-hosted", "linux", "mshv", "virtual-machine", "azure-azlinux-3"]'
            backend: mshv
            target: x86_64-unknown-linux-musl
            build-mode: musl
            artifact: openvmm-linux-musl
            binary: openvmm/target/release/openvmm
          - name: Windows MSVC
            runner: '["self-hosted", "windows", "whp", "virtual-machine", "azure-windows-3"]'
            backend: whp
            target: x86_64-pc-windows-msvc
            build-mode: native
            artifact: openvmm-windows-msvc
            binary: openvmm/target/release/openvmm.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}
          target: ${{ matrix.target }}
          build-mode: ${{ matrix.build-mode }}
          binary-path: ${{ matrix.binary }}

      - name: Upload OpenVMM binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  openvmm-tests:
    name: OpenVMM tests / ${{ matrix.name }}
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / KVM
            backend: kvm
            runner: '["self-hosted", "linux", "kvm", "virtual-machine", "azure-kvm-1"]'
          - name: Linux / MSHV
            backend: mshv
            runner: '["self-hosted", "linux", "mshv", "virtual-machine", "azure-azlinux-1"]'
          - name: Windows / WHP
            backend: whp
            runner: '["self-hosted", "windows", "whp", "virtual-machine", "azure-windows-1"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Prepare Windows cache tools
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py setup-cross-os-cache

      - name: Prepare Linux cache tools
        id: cache-tools-linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

      - name: Restore OpenVMM inputs on Linux
        id: restore-openvmm-inputs-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM inputs on Windows
        id: restore-openvmm-inputs-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM test build on Linux
        id: restore-openvmm-tests-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: openvmm/target
          key: openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-
            openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Linux
        id: restore-openvmm-cargo-linux
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM test build on Windows
        id: restore-openvmm-tests-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: openvmm/target
          key: openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-
            openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache on Windows
        id: restore-openvmm-cargo-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run OpenVMM tests on KVM
        if: matrix.backend == 'kvm'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Run OpenVMM tests on MSHV
        if: matrix.backend == 'mshv'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Run OpenVMM tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts\nvx.py test-openvmm --backend "${{ matrix.backend }}"

      - name: Save OpenVMM inputs on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-inputs-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM inputs on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-inputs-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM test build on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-tests-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: openvmm/target
          key: openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache on Linux
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os != 'Windows' &&
          steps.restore-openvmm-cargo-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}

      - name: Save OpenVMM test build on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-tests-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: openvmm/target
          key: openvmm-tests-v2-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache on Windows
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          runner.os == 'Windows' &&
          steps.restore-openvmm-cargo-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}

  openvmm-unit-tests:
    name: OpenVMM unit and documentation tests / Linux GNU
    needs: [openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo-home
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        id: openvmm
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Configure Cargo home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME}/bin"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Prepare Linux cache tools
        id: cache-tools-linux
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          echo "path=${cache_tools}" >> "${GITHUB_OUTPUT}"

      - name: Restore OpenVMM inputs
        id: restore-openvmm-inputs
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore OpenVMM unit-test build
        id: restore-openvmm-unit-tests
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: openvmm/target
          key: openvmm-unit-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-${{ steps.openvmm.outputs.sha }}
          restore-keys: |
            openvmm-unit-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-
            openvmm-unit-tests-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore shared Cargo cache
        id: restore-openvmm-cargo
        uses: actions/cache/restore@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}
          restore-keys: |
            openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run OpenVMM unit and documentation tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/nvx.py test-openvmm-unit
          --output-dir "${RUNNER_TEMP}/openvmm-unit-tests"

      - name: Upload OpenVMM unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-unit-tests-linux-gnu
          path: |
            ${{ runner.temp }}/openvmm-unit-tests
            openvmm/target/nextest
          if-no-files-found: warn
          retention-days: 7

      - name: Save OpenVMM inputs
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          steps.restore-openvmm-inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            openvmm/flowey-persist/flowey_lib_common__download_gh_release
            openvmm/flowey-persist/flowey_lib_common__cache
          key: openvmm-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm.outputs.sha }}

      - name: Save OpenVMM unit-test build
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          steps.restore-openvmm-unit-tests.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: openvmm/target
          key: openvmm-unit-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}-${{ steps.openvmm.outputs.sha }}

      - name: Save shared Cargo cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          steps.restore-openvmm-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        env:
          PATH: ${{ steps.cache-tools-linux.outputs.path }}
        with:
          path: |
            ${{ format('{0}/cargo-home/registry', runner.temp) }}
            ${{ format('{0}/cargo-home/git', runner.temp) }}
          key: openvmm-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openvmm/Cargo.lock') }}

  nvx-microvm-tests:
    name: NVX microVM tests / ${{ matrix.name }}
    needs: [artifacts, openvmm-binaries, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        needs.openvmm-binaries.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-tests == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / KVM
            backend: kvm
            runner: '["self-hosted", "linux", "kvm", "virtual-machine", "azure-kvm-2"]'
            openvmm-artifact: openvmm-linux-gnu
          - name: Linux / MSHV
            backend: mshv
            runner: '["self-hosted", "linux", "mshv", "virtual-machine", "azure-azlinux-2"]'
            openvmm-artifact: openvmm-linux-gnu
          - name: Windows / WHP
            backend: whp
            runner: '["self-hosted", "windows", "whp", "virtual-machine", "azure-windows-2"]'
            openvmm-artifact: openvmm-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Download guest artifacts
        uses: actions/download-artifact@v5
        with:
          name: guest-artifacts
          path: build

      - name: Download OpenVMM binary
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.openvmm-artifact }}
          path: openvmm/target/release

      - name: Make OpenVMM executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x openvmm/target/release/openvmm

      - name: Run NVX microVM tests on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python3 scripts/nvx.py test-microvm
          --backend "${{ matrix.backend }}"
          --output-dir "build/test-results/microvm-${{ matrix.backend }}"

      - name: Run NVX microVM tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ matrix.backend }}"
          --output-dir "build/test-results/microvm-${{ matrix.backend }}"

      - name: Upload NVX microVM failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvx-microvm-tests-${{ matrix.backend }}
          path: build/test-results/microvm-${{ matrix.backend }}
          if-no-files-found: warn

  platform:
    name: Platform / ${{ matrix.name }}
    needs: [artifacts, openvmm-binaries, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        needs.openvmm-binaries.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-workloads == 'true'
        )
      }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / KVM / Virtual machine
            runner: '["self-hosted", "linux", "kvm", "virtual-machine", "azure-kvm-3"]'
            backend: kvm
            release-platform: linux-kvm
            benchmark-platform: linux-kvm-virtual-machine
            openvmm-artifact: openvmm-linux-gnu
            teardown-mode: guest-exit
            benchmark-cpus: 0-7
            host-cpu-reserve: 0
            marker-timeout: 40
            package-release: true
          - name: Linux / MSHV / Virtual machine
            runner: '["self-hosted", "linux", "mshv", "virtual-machine", "azure-azlinux-3"]'
            backend: mshv
            release-platform: linux-mshv
            benchmark-platform: linux-mshv-virtual-machine
            openvmm-artifact: openvmm-linux-musl
            teardown-mode: guest-exit
            benchmark-cpus: 0-7
            host-cpu-reserve: 0
            marker-timeout: 40
            package-release: true
          - name: Windows / WHP / Virtual machine
            runner: '["self-hosted", "windows", "whp", "virtual-machine", "azure-windows-3"]'
            backend: whp
            release-platform: windows-whp
            benchmark-platform: windows-whp-virtual-machine
            openvmm-artifact: openvmm-windows-msvc
            teardown-mode: guest-exit
            benchmark-cpus: 0-7
            host-cpu-reserve: 0
            marker-timeout: 40
            package-release: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ matrix.backend }}

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Verify source pins on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/nvx.py verify

      - name: Verify source pins on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts\nvx.py verify

      - name: Download OpenVMM binary
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.openvmm-artifact }}
          path: openvmm/target/release

      - name: Make OpenVMM executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x openvmm/target/release/openvmm

      - name: Run benchmark
        uses: ./.github/actions/run-benchmark
        with:
          backend: ${{ matrix.backend }}
          platform: ${{ matrix.benchmark-platform }}
          runs: 10
          warmups: 1
          teardown-mode: ${{ matrix.teardown-mode }}
          cpus: ${{ matrix.benchmark-cpus }}
          host-cpu-reserve: ${{ matrix.host-cpu-reserve }}
          marker-timeout: ${{ matrix.marker-timeout }}

      - name: Package release
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          matrix.package-release
        uses: ./.github/actions/package-release
        with:
          platform: ${{ matrix.release-platform }}

  release:
    name: Publish development release
    needs:
      [quality, openvmm-tests, openvmm-unit-tests, nvx-microvm-tests, platform]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        !cancelled() &&
        needs.quality.result == 'success' &&
        (
          needs.openvmm-tests.result == 'success' ||
          needs.openvmm-tests.result == 'skipped'
        ) &&
        (
          needs.openvmm-unit-tests.result == 'success' ||
          needs.openvmm-unit-tests.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests.result == 'success' ||
          needs.nvx-microvm-tests.result == 'skipped'
        ) &&
        needs.platform.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Publish development release
        uses: ./.github/actions/publish-development-release

  performance-gate:
    name: Performance regression gate
    needs: [platform]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !cancelled() &&
        needs.platform.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate on performance regressions
        uses: ./.github/actions/gate-performance
        with:
          base-ref: dev
          baseline-window: ${{ env.PERFORMANCE_BASELINE_WINDOW }}
          minimum-history: ${{ env.PERFORMANCE_BASELINE_MINIMUM_HISTORY }}
          regression-threshold: ${{ env.PERFORMANCE_REGRESSION_THRESHOLD }}
          absolute-tolerance-ms: ${{ env.PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS }}

  performance-persist:
    name: Persist performance baseline
    needs: [openvmm-tests, nvx-microvm-tests, platform]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        !cancelled() &&
        (
          needs.openvmm-tests.result == 'success' ||
          needs.openvmm-tests.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests.result == 'success' ||
          needs.nvx-microvm-tests.result == 'skipped'
        ) &&
        needs.platform.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Persist results on dev
        uses: ./.github/actions/persist-performance-results
        with:
          branch: dev
