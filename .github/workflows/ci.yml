        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-microvm-tests == 'true'
        )
      }}
    uses: ./.github/workflows/run-nvx-microvm-tests.yml
    with:
      display-name: Windows / WHP / Debug kernel
      runner: '["self-hosted", "windows", "whp", "virtual-machine", "general"]'
      backend: whp
      openvmm-artifact: openvmm-windows-msvc
      nvx-rs-artifact: nvx-rs-windows-msvc
      debug-kernel: true
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  # The platform jobs measure the performance series that the regression gate
  # and the history compare. Each runs on the one runner of its backend's pool
  # that carries `benchmark` instead of `general`, so that no other job can
  # delay it and every workflow run measures its series on the same VM: the
  # pools mix CPU generations and VMs whose results differ by more than the
  # run-to-run noise (#383, #415). They also package the release, so a pull
  # request or a merge group runs them only when one of their inputs changed,
  # but a dev push, which publishes the development release and records the
  # history, runs them for every change but documentation.
  platform-kvm:
    name: Platform / Linux / KVM / Virtual machine
    needs: [artifacts, distro-artifacts, build-openvmm-linux-gnu, nvx-cli-linux, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        needs.distro-artifacts.result == 'success' &&
        needs.build-openvmm-linux-gnu.result == 'success' &&
        needs.nvx-cli-linux.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-benchmarks == 'true'
        )
      }}
    uses: ./.github/workflows/run-platform.yml
    with:
      display-name: Linux / KVM / Virtual machine
      runner: '["self-hosted", "linux", "kvm", "virtual-machine", "benchmark"]'
      backend: kvm
      release-platform: linux-kvm
      benchmark-platform: linux-kvm-virtual-machine
      openvmm-artifact: openvmm-linux-gnu
      nvx-rs-artifact: nvx-rs-linux-musl
      teardown-mode: guest-exit
      benchmark-cpus: 0-7
      host-cpu-reserve: 0
      marker-timeout: 40
      package-release: true
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  platform-mshv:
    name: Platform / Linux / MSHV / Virtual machine
    needs: [artifacts, distro-artifacts, build-openvmm-linux-musl, nvx-cli-linux, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        needs.distro-artifacts.result == 'success' &&
        needs.build-openvmm-linux-musl.result == 'success' &&
        needs.nvx-cli-linux.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-benchmarks == 'true'
        )
      }}
    uses: ./.github/workflows/run-platform.yml
    with:
      display-name: Linux / MSHV / Virtual machine
      runner: '["self-hosted", "linux", "mshv", "virtual-machine", "benchmark"]'
      backend: mshv
      release-platform: linux-mshv
      benchmark-platform: linux-mshv-virtual-machine
      openvmm-artifact: openvmm-linux-musl
      nvx-rs-artifact: nvx-rs-linux-musl
      teardown-mode: guest-exit
      benchmark-cpus: 0-7
      host-cpu-reserve: 0
      marker-timeout: 40
      package-release: true
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  platform-whp:
    name: Platform / Windows / WHP / Virtual machine
    needs: [artifacts, distro-artifacts, build-openvmm-windows-msvc, nvx-cli-windows, openvmm-changes]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) &&
        needs.artifacts.result == 'success' &&
        needs.distro-artifacts.result == 'success' &&
        needs.build-openvmm-windows-msvc.result == 'success' &&
        needs.nvx-cli-windows.result == 'success' &&
        (
          needs.openvmm-changes.result != 'success' ||
          needs.openvmm-changes.outputs.run-benchmarks == 'true'
        )
      }}
    uses: ./.github/workflows/run-platform.yml
    with:
      display-name: Windows / WHP / Virtual machine
      runner: '["self-hosted", "windows", "whp", "virtual-machine", "benchmark"]'
      backend: whp
      release-platform: windows-whp
      benchmark-platform: windows-whp-virtual-machine
      openvmm-artifact: openvmm-windows-msvc
      nvx-rs-artifact: nvx-rs-windows-msvc
      teardown-mode: guest-exit
      benchmark-cpus: 0-7
      host-cpu-reserve: 0
      marker-timeout: 40
      package-release: true
    secrets:
      OPENVMM_DEPLOY_KEY: ${{ secrets.OPENVMM_DEPLOY_KEY }}

  release:
    name: Publish development release
    needs:
      - debug-kernel
      - quality
      - nvx-rs
      - nvx-cli-linux
      - nvx-cli-windows
      - openvmm-changes
      - build-openvmm-vmm-tests-linux
      - build-openvmm-vmm-tests-windows
      - openvmm-vmm-tests-linux
      - openvmm-vmm-tests-windows
      - openvmm-unit-tests
      - nvx-microvm-tests-kvm
      - nvx-microvm-tests-mshv
      - nvx-microvm-tests-whp
      - nvx-microvm-guests-kvm
      - nvx-microvm-guests-mshv
      - nvx-microvm-guests-whp
      - nvx-microvm-debug-kvm
      - nvx-microvm-debug-mshv
      - nvx-microvm-debug-whp
      - platform-kvm
      - platform-mshv
      - platform-whp
    # The VMM-test jobs must all succeed, or all be skipped because the change
    # selects no VMM tests: a failed or unexpectedly skipped one blocks this.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        !cancelled() &&
        needs.debug-kernel.result == 'success' &&
        needs.quality.result == 'success' &&
        needs.nvx-rs.result == 'success' &&
        needs.nvx-cli-linux.result == 'success' &&
        needs.nvx-cli-windows.result == 'success' &&
        (
          (
            needs.build-openvmm-vmm-tests-linux.result == 'success' &&
            needs.build-openvmm-vmm-tests-windows.result == 'success' &&
            needs.openvmm-vmm-tests-linux.result == 'success' &&
            needs.openvmm-vmm-tests-windows.result == 'success'
          ) ||
          (
            needs.openvmm-changes.result == 'success' &&
            needs.openvmm-changes.outputs.run-openvmm-vmm-tests != 'true' &&
            needs.build-openvmm-vmm-tests-linux.result == 'skipped' &&
            needs.build-openvmm-vmm-tests-windows.result == 'skipped' &&
            needs.openvmm-vmm-tests-linux.result == 'skipped' &&
            needs.openvmm-vmm-tests-windows.result == 'skipped'
          )
        ) &&
        (
          needs.openvmm-unit-tests.result == 'success' ||
          needs.openvmm-unit-tests.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests-kvm.result == 'success' ||
          needs.nvx-microvm-tests-kvm.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests-mshv.result == 'success' ||
          needs.nvx-microvm-tests-mshv.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests-whp.result == 'success' ||
          needs.nvx-microvm-tests-whp.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-guests-kvm.result == 'success' ||
          needs.nvx-microvm-guests-kvm.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-guests-mshv.result == 'success' ||
          needs.nvx-microvm-guests-mshv.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-guests-whp.result == 'success' ||
          needs.nvx-microvm-guests-whp.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-debug-kvm.result == 'success' ||
          needs.nvx-microvm-debug-kvm.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-debug-mshv.result == 'success' ||
          needs.nvx-microvm-debug-mshv.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-debug-whp.result == 'success' ||
          needs.nvx-microvm-debug-whp.result == 'skipped'
        ) &&
        needs.platform-kvm.result == 'success' &&
        needs.platform-mshv.result == 'success' &&
        needs.platform-whp.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Publish development release
        uses: ./.github/actions/publish-development-release

  performance-gate:
    name: Performance regression gate
    needs: [platform-kvm, platform-mshv, platform-whp]
    if: >-
      ${{
        (
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group'
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        ) &&
        !cancelled() &&
        needs.platform-kvm.result == 'success' &&
        needs.platform-mshv.result == 'success' &&
        needs.platform-whp.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate on performance regressions
        uses: ./.github/actions/gate-performance
        with:
          base-ref: dev
          baseline-window: ${{ env.PERFORMANCE_BASELINE_WINDOW }}
          minimum-history: ${{ env.PERFORMANCE_BASELINE_MINIMUM_HISTORY }}
          regression-threshold: ${{ env.PERFORMANCE_REGRESSION_THRESHOLD }}
          absolute-tolerance-ms: ${{ env.PERFORMANCE_REGRESSION_ABSOLUTE_TOLERANCE_MS }}

  required-status-check:
    name: Required status check
    needs:
      - quality
      - nvx-rs
      - nvx-cli-linux
      - nvx-cli-windows
      - openvmm-changes
      - artifacts
      - distro-artifacts
      - debug-kernel
      - guest-artifact-reuse
      - build-openvmm-linux-gnu
      - build-openvmm-linux-musl
      - build-openvmm-windows-msvc
      - build-openvmm-vmm-tests-linux
      - build-openvmm-vmm-tests-windows
      - openvmm-vmm-tests-linux
      - openvmm-vmm-tests-windows
      - openvmm-unit-tests
      - nvx-microvm-tests-kvm
      - nvx-microvm-tests-mshv
      - nvx-microvm-tests-whp
      - nvx-microvm-guests-kvm
      - nvx-microvm-guests-mshv
      - nvx-microvm-guests-whp
      - nvx-microvm-debug-kvm
      - nvx-microvm-debug-mshv
      - nvx-microvm-debug-whp
      - platform-kvm
      - platform-mshv
      - platform-whp
      - performance-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify required jobs
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: bash
        env:
          SAME_REPOSITORY: >-
            ${{
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            }}
          RUN_GUEST_ARTIFACTS: ${{ needs.openvmm-changes.outputs.run-guest-artifacts }}
          RUN_OPENVMM_BINARIES: ${{ needs.openvmm-changes.outputs.run-openvmm-binaries }}
          RUN_OPENVMM_UNIT_TESTS: ${{ needs.openvmm-changes.outputs.run-openvmm-unit-tests }}
          RUN_OPENVMM_VMM_TESTS: ${{ needs.openvmm-changes.outputs.run-openvmm-vmm-tests }}
          RUN_MICROVM_TESTS: ${{ needs.openvmm-changes.outputs.run-microvm-tests }}
          RUN_BENCHMARKS: ${{ needs.openvmm-changes.outputs.run-benchmarks }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          NVX_RS_RESULT: ${{ needs.nvx-rs.result }}
          NVX_CLI_LINUX_RESULT: ${{ needs.nvx-cli-linux.result }}
          NVX_CLI_WINDOWS_RESULT: ${{ needs.nvx-cli-windows.result }}
          CHANGES_RESULT: ${{ needs.openvmm-changes.result }}
          ARTIFACTS_RESULT: ${{ needs.artifacts.result }}
          DISTRO_ARTIFACTS_RESULT: ${{ needs.distro-artifacts.result }}
          DEBUG_KERNEL_RESULT: ${{ needs.debug-kernel.result }}
          GUEST_ARTIFACT_REUSE_RESULT: ${{ needs.guest-artifact-reuse.result }}
          BUILD_LINUX_GNU_RESULT: ${{ needs.build-openvmm-linux-gnu.result }}
          BUILD_LINUX_MUSL_RESULT: ${{ needs.build-openvmm-linux-musl.result }}
          BUILD_WINDOWS_MSVC_RESULT: ${{ needs.build-openvmm-windows-msvc.result }}
          BUILD_VMM_TESTS_LINUX_RESULT: ${{ needs.build-openvmm-vmm-tests-linux.result }}
          BUILD_VMM_TESTS_WINDOWS_RESULT: ${{ needs.build-openvmm-vmm-tests-windows.result }}
          VMM_TESTS_LINUX_RESULT: ${{ needs.openvmm-vmm-tests-linux.result }}
          VMM_TESTS_WINDOWS_RESULT: ${{ needs.openvmm-vmm-tests-windows.result }}
          UNIT_TESTS_RESULT: ${{ needs.openvmm-unit-tests.result }}
          MICROVM_KVM_RESULT: ${{ needs.nvx-microvm-tests-kvm.result }}
          MICROVM_MSHV_RESULT: ${{ needs.nvx-microvm-tests-mshv.result }}
          MICROVM_WHP_RESULT: ${{ needs.nvx-microvm-tests-whp.result }}
          MICROVM_GUESTS_KVM_RESULT: ${{ needs.nvx-microvm-guests-kvm.result }}
          MICROVM_GUESTS_MSHV_RESULT: ${{ needs.nvx-microvm-guests-mshv.result }}
          MICROVM_GUESTS_WHP_RESULT: ${{ needs.nvx-microvm-guests-whp.result }}
          MICROVM_DEBUG_KVM_RESULT: ${{ needs.nvx-microvm-debug-kvm.result }}
          MICROVM_DEBUG_MSHV_RESULT: ${{ needs.nvx-microvm-debug-mshv.result }}
          MICROVM_DEBUG_WHP_RESULT: ${{ needs.nvx-microvm-debug-whp.result }}
          PLATFORM_KVM_RESULT: ${{ needs.platform-kvm.result }}
          PLATFORM_MSHV_RESULT: ${{ needs.platform-mshv.result }}
          PLATFORM_WHP_RESULT: ${{ needs.platform-whp.result }}
          PERFORMANCE_GATE_RESULT: ${{ needs.performance-gate.result }}
        run: >-
          python3 scripts/nvx.py check-required-ci
          --event-name "${{ github.event_name }}"
          --same-repository "${SAME_REPOSITORY}"
          --run-guest-artifacts "${RUN_GUEST_ARTIFACTS}"
          --run-openvmm-binaries "${RUN_OPENVMM_BINARIES}"
          --run-openvmm-unit-tests "${RUN_OPENVMM_UNIT_TESTS}"
          --run-openvmm-vmm-tests "${RUN_OPENVMM_VMM_TESTS}"
          --run-microvm-tests "${RUN_MICROVM_TESTS}"
          --run-benchmarks "${RUN_BENCHMARKS}"

  performance-persist:
    name: Persist performance baseline
    needs:
      - debug-kernel
      - nvx-cli-linux
      - nvx-cli-windows
      - openvmm-changes
      - build-openvmm-vmm-tests-linux
      - build-openvmm-vmm-tests-windows
      - openvmm-vmm-tests-linux
      - openvmm-vmm-tests-windows
      - openvmm-unit-tests
      - nvx-microvm-tests-kvm
      - nvx-microvm-tests-mshv
      - nvx-microvm-tests-whp
      - nvx-microvm-guests-kvm
      - nvx-microvm-guests-mshv
      - nvx-microvm-guests-whp
      - nvx-microvm-debug-kvm
      - nvx-microvm-debug-mshv
      - nvx-microvm-debug-whp
      - platform-kvm
      - platform-mshv
      - platform-whp
    # The VMM-test jobs must all succeed, or all be skipped because the change
    # selects no VMM tests: a failed or unexpectedly skipped one blocks this.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        !cancelled() &&
        needs.debug-kernel.result == 'success' &&
        needs.nvx-cli-linux.result == 'success' &&
        needs.nvx-cli-windows.result == 'success' &&
        (
          (
            needs.build-openvmm-vmm-tests-linux.result == 'success' &&
            needs.build-openvmm-vmm-tests-windows.result == 'success' &&
            needs.openvmm-vmm-tests-linux.result == 'success' &&
            needs.openvmm-vmm-tests-windows.result == 'success'
          ) ||
          (
            needs.openvmm-changes.result == 'success' &&
            needs.openvmm-changes.outputs.run-openvmm-vmm-tests != 'true' &&
            needs.build-openvmm-vmm-tests-linux.result == 'skipped' &&
            needs.build-openvmm-vmm-tests-windows.result == 'skipped' &&
            needs.openvmm-vmm-tests-linux.result == 'skipped' &&
            needs.openvmm-vmm-tests-windows.result == 'skipped'
          )
        ) &&
        (
          needs.openvmm-unit-tests.result == 'success' ||
          needs.openvmm-unit-tests.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests-kvm.result == 'success' ||
          needs.nvx-microvm-tests-kvm.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests-mshv.result == 'success' ||
          needs.nvx-microvm-tests-mshv.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-tests-whp.result == 'success' ||
          needs.nvx-microvm-tests-whp.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-guests-kvm.result == 'success' ||
          needs.nvx-microvm-guests-kvm.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-guests-mshv.result == 'success' ||
          needs.nvx-microvm-guests-mshv.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-guests-whp.result == 'success' ||
          needs.nvx-microvm-guests-whp.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-debug-kvm.result == 'success' ||
          needs.nvx-microvm-debug-kvm.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-debug-mshv.result == 'success' ||
          needs.nvx-microvm-debug-mshv.result == 'skipped'
        ) &&
        (
          needs.nvx-microvm-debug-whp.result == 'success' ||
          needs.nvx-microvm-debug-whp.result == 'skipped'
        ) &&
        needs.platform-kvm.result == 'success' &&
        needs.platform-mshv.result == 'success' &&
        needs.platform-whp.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PERFORMANCE_PERSIST_DEPLOY_KEY }}

      - name: Persist results on dev
        uses: ./.github/actions/persist-performance-results
        with:
          branch: dev

  # A full run of dev publishes the nvx crate to crates.io once every job
  # passed, which Required status check confirms: a new pre-release whenever
  # nvx-rs/ changed since the commit from which the newest version on
  # crates.io was packed (doc/ci.md, "crates.io releases"). This job packs,
  # checks, and builds the package without the right to publish it, so that
  # no build script or procedural macro that its build runs can publish.
  crate-package:
    name: Package nvx crate
    needs: [required-status-check]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        ) &&
        github.ref == 'refs/heads/dev' &&
        needs.required-status-check.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.crate.outputs.publish }}
      version: ${{ steps.crate.outputs.version }}
      sha256: ${{ steps.crate.outputs.sha256 }}
      url: ${{ steps.crate.outputs.url }}
    steps:
      # The full history holds the commits from which the published versions
      # were packed.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust release
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "${toolchain}"
          rustup toolchain install "${toolchain}" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${toolchain}" >> "${GITHUB_ENV}"

      - name: Package, check, and build the nvx crate
        id: crate
        run: >-
          python3 -u scripts/publish_nvx_crate.py package
          --work-dir "${RUNNER_TEMP}/nvx-crate"

  # The publish job builds nothing: it packs the package job's bytes again,
  # checks them, and uploads them with a token that crates.io issues for the
  # OpenID Connect token of a ci.yml job in the crates-io environment, which
  # only dev may deploy to, so the repository stores no registry token.
  crate-release:
    name: Publish nvx crate
    needs: [crate-package]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        ) &&
        github.ref == 'refs/heads/dev' &&
        needs.crate-package.result == 'success' &&
        needs.crate-package.outputs.publish == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publication at a time, so that two runs never upload one version. A
    # newer run's job can replace one that waits for its turn.
    concurrency:
      group: crate-release
      cancel-in-progress: false
    environment:
      name: crates-io
      url: ${{ needs.crate-package.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust release
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "${toolchain}"
          rustup toolchain install "${toolchain}" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${toolchain}" >> "${GITHUB_ENV}"

      - name: Check the nvx package
        id: check
        env:
          CRATE_VERSION: ${{ needs.crate-package.outputs.version }}
          CRATE_SHA256: ${{ needs.crate-package.outputs.sha256 }}
        run: >-
          python3 -u scripts/publish_nvx_crate.py prepare
          --work-dir "${RUNNER_TEMP}/nvx-crate"
          --crate-version "${CRATE_VERSION}"
          --sha256 "${CRATE_SHA256}"

      # The token expires within 30 minutes, and the action's post step
      # revokes it when the job ends.
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the nvx crate
        if: steps.check.outputs.upload == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          python3 -u scripts/publish_nvx_crate.py publish
          --work-dir "${RUNNER_TEMP}/nvx-crate"
