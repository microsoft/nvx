name: Run NVX microVM tests

on:
  workflow_call:
    inputs:
      display-name:
        description: Platform name shown in the job list
        required: true
        type: string
      runner:
        description: JSON array of labels selecting the test runner
        required: true
        type: string
      backend:
        description: NVX backend to test
        required: true
        type: string
      openvmm-artifact:
        description: Base name of the compatible OpenVMM artifacts
        required: true
        type: string
      nvx-rs-artifact:
        description: Base name of the nvx-rs artifacts for the runner's OS
        required: true
        type: string
      debug-kernel:
        description: >-
          Run the same-host restore scenarios on the CI debug kernel instead
          of the full suite and every other step that boots the production
          kernel
        required: false
        type: boolean
        default: false
      guests-and-sandboxes:
        description: >-
          Run the steps that follow the default suite instead of it, in a
          second job of the backend beside the default suite: the public
          managed sandbox acceptance, the Ubuntu and Azure Linux guest tests,
          the Ubuntu sandbox steps, and the runtime adapter scenarios. Not for
          the debug-kernel jobs, which skip these steps
        required: false
        type: boolean
        default: false
      shard:
        description: >-
          Run only this shard, from 1 to shard-count, of the default suite,
          as scripts/nvx_tools/microvm_shards.json splits it for the backend
          (doc/ci.md#microvm-test-shards); 0 runs all of a default run, the
          public sandbox scenarios among them, which also read the Ubuntu
          distro layer and the sandbox scratch template. Only for the
          default-suite jobs
        required: false
        type: number
        default: 0
      shard-count:
        description: >-
          How many shards of the default suite the caller runs, one job each;
          test-microvm fails unless the partition has as many for the backend
        required: false
        type: number
        default: 0
    secrets:
      OPENVMM_DEPLOY_KEY:
        description: SSH deploy key used to checkout OpenVMM
        required: true

permissions:
  contents: read

# The jobs test the artifacts that the build jobs made, so nvx-rs must never
# replace missing ones with those of a release.
env:
  NVX_AUTO_DOWNLOAD: "0"

jobs:
  test:
    name: NVX microVM tests / ${{ inputs.display-name }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      # The guest artifacts that the steps below boot or read. Every job
      # qualifies its runner with the kernel and the Alpine initramfs, the
      # shards of the default suite boot only those, and the debug-kernel jobs
      # run only Alpine scenarios on the debug kernel, so only the guest and
      # sandbox steps take the Ubuntu and Azure Linux artifacts, and an
      # unsharded default run the Ubuntu distro layer of its public sandbox
      # scenarios.
      - name: Download guest kernel
        uses: actions/download-artifact@v8
        with:
          name: guest-kernel
          path: build

      - name: Download Alpine initramfs
        uses: actions/download-artifact@v8
        with:
          name: guest-alpine
          path: build

      - name: Download guest debug kernel
        if: inputs.debug-kernel
        uses: actions/download-artifact@v8
        with:
          name: guest-debug-kernel
          path: build

      - name: Download Ubuntu initramfs
        if: ${{ inputs.guests-and-sandboxes && !inputs.debug-kernel }}
        uses: actions/download-artifact@v8
        with:
          name: guest-ubuntu
          path: build

      - name: Download Ubuntu distro layer
        if: ${{ inputs.guests-and-sandboxes && !inputs.debug-kernel }}
        uses: actions/download-artifact@v8
        with:
          name: guest-ubuntu-distro
          path: build

      # The layer, its manifest, and the sandbox scratch template, which the
      # public sandbox scenarios of an unsharded default run read.
      - name: Download Ubuntu distro layer for the whole default run
        if: ${{ !inputs.guests-and-sandboxes && !inputs.debug-kernel && !inputs.shard }}
        uses: actions/download-artifact@v8
        with:
          name: guest-ubuntu-distro
          path: build

      - name: Download Azure Linux initramfs
        if: ${{ inputs.guests-and-sandboxes && !inputs.debug-kernel }}
        uses: actions/download-artifact@v8
        with:
          name: guest-azurelinux
          path: build

      - name: Download OpenVMM executable
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.openvmm-artifact }}-executable
          path: openvmm/target/release

      - name: Download OpenVMM provenance
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.openvmm-artifact }}-provenance
          path: build

      - name: Make OpenVMM executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x openvmm/target/release/openvmm

      # The scenarios and the steps below run their sandboxes and microVMs
      # with nvx-rs, which they find where `cargo build --release` puts it,
      # and whose artifact root is then this checkout.
      - name: Download nvx-rs executable
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.nvx-rs-artifact }}-executable
          path: nvx-rs/target/release

      - name: Make nvx-rs executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x nvx-rs/target/release/nvx-rs

      # Qualification verifies the downloaded OpenVMM's time ABI preflight.
      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ inputs.backend }}
          verify-openvmm: "true"

      # The runner signals only a step's shell when the job is cancelled, so
      # the Linux steps exec the test harness, which can then stop OpenVMM and
      # remove its scratch directories (doc/ci.md#cancellation).
      - name: Run NVX microVM tests on Linux
        if: runner.os != 'Windows' && !inputs.guests-and-sandboxes
        shell: bash
        run: >-
          exec python3 scripts/nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          ${{ inputs.debug-kernel && '--debug-kernel' || '' }}
          ${{ inputs.shard && format('--shard {0}/{1}', inputs.shard, inputs.shard-count) || '' }}
          --output-dir "build/test-results/microvm-${{ inputs.backend }}${{ inputs.debug-kernel && '-debug' || '' }}"

      - name: Run NVX microVM tests on Windows
        if: runner.os == 'Windows' && !inputs.guests-and-sandboxes
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          ${{ inputs.debug-kernel && '--debug-kernel' || '' }}
          ${{ inputs.shard && format('--shard {0}/{1}', inputs.shard, inputs.shard-count) || '' }}
          --output-dir "build/test-results/microvm-${{ inputs.backend }}${{ inputs.debug-kernel && '-debug' || '' }}"

      - name: Run public managed sandbox acceptance on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: >-
          exec python3 scripts/nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --scenario managed-exec-config
          --scenario sandbox-lifecycle
          --scenario sandbox-proxy-only
          --scenario sandbox-ram-upper
          --output-dir "build/test-results/public-exec-${{ inputs.backend }}"

      - name: Run public managed sandbox acceptance on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --scenario managed-exec-config
          --scenario sandbox-lifecycle
          --scenario sandbox-proxy-only
          --scenario sandbox-ram-upper
          --output-dir "build/test-results/public-exec-${{ inputs.backend }}"

      - name: Run Ubuntu guest smoke tests on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: >-
          exec python3 scripts/nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --guest ubuntu
          --processors 1
          --scenario guest-boot
          --scenario guest-identity
          --scenario console-exit
          --scenario lifecycle
          --scenario virtio-net
          --scenario filesystem-snapshot
          --output-dir "build/test-results/ubuntu-${{ inputs.backend }}"

      - name: Run Ubuntu guest smoke tests on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --guest ubuntu
          --processors 1
          --scenario guest-boot
          --scenario guest-identity
          --scenario console-exit
          --scenario lifecycle
          --scenario virtio-net
          --scenario filesystem-snapshot
          --output-dir "build/test-results/ubuntu-${{ inputs.backend }}"

      - name: Run Azure Linux guest smoke tests on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: >-
          exec python3 scripts/nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --guest azurelinux
          --processors 1
          --scenario guest-boot
          --scenario guest-identity
          --scenario console-exit
          --scenario virtio-net
          --scenario network-snapshot
          --scenario workload-identity
          --scenario managed-lifecycle
          --output-dir "build/test-results/azurelinux-${{ inputs.backend }}"

      - name: Run Azure Linux guest smoke tests on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --guest azurelinux
          --processors 1
          --scenario guest-boot
          --scenario guest-identity
          --scenario console-exit
          --scenario virtio-net
          --scenario network-snapshot
          --scenario workload-identity
          --scenario managed-lifecycle
          --output-dir "build/test-results/azurelinux-${{ inputs.backend }}"

      - name: Run extended Ubuntu guest tests on Linux/KVM
        if: inputs.backend == 'kvm' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: >-
          exec python3 scripts/nvx.py test-microvm
          --backend kvm
          --guest ubuntu
          --scenario managed-lifecycle
          --scenario network-snapshot
          --scenario smp
          --scenario snapshot-core
          --scenario workload-identity
          --output-dir "build/test-results/ubuntu-kvm-extended"

      - name: Run Ubuntu sandbox layer smoke test on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-smoke-${{ inputs.backend }}.ext4"
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          # The probe checks the security profile and that the 32 MiB memory
          # and 8-process limits hold.
          nvx-rs/target/release/nvx-rs sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg limits \
            --arg 33554432 \
            --arg 8 \
            --workload-user 65534:65534 \
            --memory-max 33554432 \
            --pids-max 8 \
            --memory-mib 256

      - name: Run Ubuntu sandbox live-share smoke test on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-share-${{ inputs.backend }}.ext4"
          share="build/ubuntu-share-${{ inputs.backend }}"
          # The guest links nvx-links/outside to this host file through ../..;
          # the guest must resolve it in its own root, never on the host.
          outside="$(dirname "${share}")/nvx-outside-marker"
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          rm -rf "${share}"
          mkdir -p "${share}/nvx-denied" "${share}/nvx-links"
          printf 'host-to-guest\n' >"${share}/nvx-host-marker"
          printf 'secret\n' >"${share}/nvx-denied/secret"
          printf 'host-outside\n' >"${outside}"
          chmod 0777 "${share}" "${share}/nvx-links"
          nvx-rs/target/release/nvx-rs sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/workspace,${share},rw" \
            --mount-deny nvx-denied \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg /workspace \
            --arg rw \
            --workload-user 65534:65534 \
            --memory-mib 256
          test "$(cat "${share}/nvx-guest-marker")" = guest-to-host
          test -d "${share}/nvx-guest-directory"
          # Guest-created links keep their exact targets and cannot reach host
          # data outside the share or in a denied path.
          test "$(readlink "${share}/nvx-links/nvx-tool")" = ../nvx-tool
          test "$(readlink "${share}/nvx-links/absolute")" = /nvx/absolute/target
          test "$(readlink "${share}/nvx-links/outside")" = ../../nvx-outside-marker
          test "$(readlink "${share}/nvx-links/denied")" = ../nvx-denied/secret
          test "$(readlink "${share}/nvx-links/denied-directory")" = ../nvx-denied
          test ! -L "${share}/nvx-links/marker"
          test "$(cat "${outside}")" = host-outside
          test "$(cat "${share}/nvx-denied/secret")" = secret
          rm -rf "${share}/nvx-guest-marker" "${share}/nvx-guest-directory" \
            "${share}/nvx-tool" "${share}/nvx-links"
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          nvx-rs/target/release/nvx-rs sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/opt/hostedtoolcache,${share},ro" \
            --mount-deny nvx-denied \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg /opt/hostedtoolcache \
            --arg ro \
            --workload-user 65534:65534 \
            --memory-mib 256
          test ! -e "${share}/nvx-guest-marker"
          test ! -L "${share}/nvx-guest-link"
          rm -rf "${share}" "${scratch}" "${outside}"

      - name: Run Ubuntu sandbox managed live-share smoke test on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-managed-${{ inputs.backend }}.ext4"
          share="build/ubuntu-managed-share-${{ inputs.backend }}"
          logs="build/test-results/ubuntu-${{ inputs.backend }}"
          # Keep the control socket path short.
          state=$(mktemp -d)
          cleanup() {
            if [ -f "${state}/runtime.json" ]; then
              nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}" --timeout 30 || true
            fi
            mkdir -p "${logs}"
            cp "${state}/openvmm.log" "${logs}/managed-share-openvmm.log" 2>/dev/null || true
          }
          trap cleanup EXIT
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          rm -rf "${share}"
          outside="$(dirname "${share}")/nvx-outside-marker"
          mkdir -p "${share}/nvx-denied" "${share}/nvx-links"
          printf 'host-to-guest\n' >"${share}/nvx-host-marker"
          printf 'secret\n' >"${share}/nvx-denied/secret"
          printf 'host-outside\n' >"${outside}"
          chmod 0777 "${share}" "${share}/nvx-links"
          nvx-rs/target/release/nvx-rs sandbox provision \
            --state-dir "${state}" \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/workspace,${share},rw" \
            --mount-deny nvx-denied \
            --workload-user 65534:65534
          nvx-rs/target/release/nvx-rs sandbox start --state-dir "${state}"
          nvx-rs/target/release/nvx-rs sandbox exec \
            --state-dir "${state}" \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg /workspace \
            --arg rw
          nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}"
          # A clean ext4 journal shows that stop unmounted the share, overlay,
          # and scratch in order instead of powering off with them mounted.
          python3 - "${state}/outcome.json" "${scratch}" <<'EOF'
          import json
          import struct
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              outcome = json.load(report)["outcome"]
          expected = {"operation": "managed", "category": "success", "status_code": 0}
          if outcome != expected:
              sys.exit(f"managed sandbox outcome is invalid: {outcome}")
          with open(sys.argv[2], "rb") as image:
              image.seek(1024 + 0x60)
              if struct.unpack("<I", image.read(4))[0] & 0x4:
                  sys.exit("managed stop left the scratch filesystem mounted")
          EOF
          test "$(cat "${share}/nvx-guest-marker")" = guest-to-host
          test -d "${share}/nvx-guest-directory"
          test "$(readlink "${share}/nvx-links/nvx-tool")" = ../nvx-tool
          test "$(readlink "${share}/nvx-links/absolute")" = /nvx/absolute/target
          test "$(readlink "${share}/nvx-links/outside")" = ../../nvx-outside-marker
          test "$(readlink "${share}/nvx-links/denied")" = ../nvx-denied/secret
          test "$(readlink "${share}/nvx-links/denied-directory")" = ../nvx-denied
          test ! -L "${share}/nvx-links/marker"
          test "$(cat "${outside}")" = host-outside
          test "$(cat "${share}/nvx-denied/secret")" = secret
          nvx-rs/target/release/nvx-rs sandbox deprovision --state-dir "${state}"
          rm -rf "${share}" "${scratch}" "${outside}"

      - name: Run Ubuntu sandbox caller-owned live-share test on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-caller-${{ inputs.backend }}.ext4"
          share="build/ubuntu-caller-share-${{ inputs.backend }}"
          logs="build/test-results/ubuntu-${{ inputs.backend }}"
          # Keep the control socket path short.
          state=$(mktemp -d)
          cleanup() {
            if [ -f "${state}/runtime.json" ]; then
              nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}" --timeout 30 || true
            fi
            mkdir -p "${logs}"
            cp "${state}/openvmm.log" "${logs}/caller-share-openvmm.log" 2>/dev/null || true
          }
          trap cleanup EXIT
          rm -rf "${share}"
          mkdir -p "${share}"
          printf 'host-to-guest\n' >"${share}/nvx-host-marker"
          chmod 0777 "${share}"
          # The runner grants OpenVMM neither CAP_SETUID nor CAP_SETGID, so it
          # can neither assume the 65534 workload identity nor drop its backend
          # group. With --mount-owner caller, every share operation must fail
          # with EPERM instead of running as the runner. The OpenVMM unit tests
          # cover the identity of each request, including guest root squash.
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          nvx-rs/target/release/nvx-rs sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/workspace,${share},rw" \
            --mount-owner caller \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg /workspace \
            --arg eperm \
            --workload-user 65534:65534 \
            --memory-mib 256
          test "$(ls -A "${share}")" = nvx-host-marker
          # A managed sandbox persists the ownership mode and applies it on
          # start. Its guest agent reaches the share as guest root, which the
          # mode squashes to the share's owner, before any workload runs, so
          # that request fails with EPERM too, and the sandbox never starts.
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          nvx-rs/target/release/nvx-rs sandbox provision \
            --state-dir "${state}" \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/workspace,${share},rw" \
            --mount-owner caller \
            --workload-user 65534:65534
          python3 - "${state}/config.json" <<'EOF'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              config = json.load(stream)
          if config["format"] != 8 or config["export"]["owner"] != "caller":
              sys.exit(f"managed sandbox did not persist caller ownership: {config}")
          EOF
          if nvx-rs/target/release/nvx-rs sandbox start --state-dir "${state}"; then
            echo "the caller-owned managed sandbox reached its share as the runner" >&2
            exit 1
          fi
          grep -q 'virtio-fs request cannot run as its caller; failing it with EPERM' \
            "${state}/openvmm.log"
          grep -q 'NVX-MANAGED-ERROR: stage=host-mappings' "${state}/openvmm.log"
          test ! -e "${state}/runtime.json"
          test "$(ls -A "${share}")" = nvx-host-marker
          nvx-rs/target/release/nvx-rs sandbox deprovision --state-dir "${state}"
          rm -rf "${share}" "${scratch}"

      - name: Run Ubuntu sandbox concurrent read-write and read-only shares on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-shares-${{ inputs.backend }}.ext4"
          workspace="build/ubuntu-shares-workspace-${{ inputs.backend }}"
          toolcache="build/ubuntu-shares-toolcache-${{ inputs.backend }}"
          files="build/ubuntu-shares-files-${{ inputs.backend }}"
          outside="$(dirname "${workspace}")/nvx-outside-marker"
          logs="build/test-results/ubuntu-${{ inputs.backend }}"
          # Keep the control socket path short.
          state=$(mktemp -d)
          cleanup() {
            if [ -f "${state}/runtime.json" ]; then
              nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}" --timeout 30 || true
            fi
            mkdir -p "${logs}"
            cp "${state}/openvmm.log" "${logs}/shares-openvmm.log" 2>/dev/null || true
          }
          trap cleanup EXIT
          prepare_shares() {
            rm -rf "${workspace}" "${toolcache}" "${files}"
            mkdir -p "${workspace}/nvx-denied" "${workspace}/nvx-links" \
              "${toolcache}/nvx-denied" "${files}/config" "${files}/results"
            printf 'host-to-guest\n' >"${workspace}/nvx-host-marker"
            printf 'host-to-guest\n' >"${toolcache}/nvx-host-marker"
            printf 'secret\n' >"${workspace}/nvx-denied/secret"
            printf 'secret\n' >"${toolcache}/nvx-denied/secret"
            printf 'host-outside\n' >"${outside}"
            # Each shared file sits beside a file that no share exposes. Every
            # guest identity may write both shared files, so only the read-only
            # share can refuse a write.
            printf 'host-to-guest\n' >"${files}/config/settings.json"
            printf 'secret\n' >"${files}/config/secret.json"
            printf 'host-to-guest\n' >"${files}/results/output.txt"
            printf 'other\n' >"${files}/results/other.txt"
            chmod 0666 "${files}/config/settings.json" "${files}/results/output.txt"
            chmod 0777 "${workspace}" "${workspace}/nvx-links"
            cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          }
          # The guest writes to the read-write share, and neither it nor a link
          # in the read-write share changes the read-only share. It rewrites
          # only the read-write file, and the files beside the shared files
          # stay unchanged.
          check_shares() {
            test "$(cat "${workspace}/nvx-guest-marker")" = guest-to-host
            test -d "${workspace}/nvx-guest-directory"
            test ! -L "${workspace}/nvx-cross-share-link"
            test "$(ls -A "${toolcache}" | sort | tr '\n' ' ')" = "nvx-denied nvx-host-marker "
            test "$(cat "${toolcache}/nvx-host-marker")" = host-to-guest
            test "$(cat "${toolcache}/nvx-denied/secret")" = secret
            test "$(cat "${workspace}/nvx-denied/secret")" = secret
            test "$(cat "${outside}")" = host-outside
            test "$(ls -A "${files}/config" | sort | tr '\n' ' ')" = "secret.json settings.json "
            test "$(ls -A "${files}/results" | sort | tr '\n' ' ')" = "other.txt output.txt "
            test "$(cat "${files}/config/settings.json")" = host-to-guest
            test "$(cat "${files}/config/secret.json")" = secret
            test "$(cat "${files}/results/output.txt")" = guest-to-host
            test "$(cat "${files}/results/other.txt")" = other
          }
          share_options=(
            --mount "/workspace,${workspace},rw" --mount-deny nvx-denied
            --mount "/opt/hostedtoolcache,${toolcache},ro" --mount-deny nvx-denied
            --mount "/config/settings.json,${files}/config/settings.json,ro"
            --mount "/results/output.txt,${files}/results/output.txt,rw"
          )
          smoke_arguments=(
            --entrypoint /sbin/nvx-sandbox-smoke
            --arg /workspace --arg rw --arg /opt/hostedtoolcache --arg ro
            --arg /config/settings.json --arg file-ro
            --arg /results/output.txt --arg file-rw
          )
          prepare_shares
          nvx-rs/target/release/nvx-rs sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            "${share_options[@]}" \
            "${smoke_arguments[@]}" \
            --workload-user 65534:65534 \
            --memory-mib 256
          check_shares
          # A managed sandbox persists every share and reattaches them on start.
          prepare_shares
          nvx-rs/target/release/nvx-rs sandbox provision \
            --state-dir "${state}" \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            "${share_options[@]}" \
            --workload-user 65534:65534
          python3 - "${state}/config.json" <<'EOF'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              config = json.load(stream)
          # The export plan binds each share's root, in the order of the
          # targets' depth, then the targets.
          export = config["export"]
          shares = []
          for bind in export["binds"]:
              child = export["children"][bind["child"]]
              shares.append(
                  (
                      bind["target"],
                      bind["source"],
                      "ro" if bind["readOnly"] else "rw",
                      [os.path.relpath(path, child["root"]) for path in child["denied"]],
                      "file" if child.get("file") else "directory",
                  )
              )
          expected = [
              ("/workspace", "", "rw", ["nvx-denied"], "directory"),
              ("/config/settings.json", "", "ro", [], "file"),
              ("/opt/hostedtoolcache", "", "ro", ["nvx-denied"], "directory"),
              ("/results/output.txt", "", "rw", [], "file"),
          ]
          if config["format"] != 8 or "mounts" in config or shares != expected:
              sys.exit(f"managed sandbox did not persist every share: {config}")
          EOF
          nvx-rs/target/release/nvx-rs sandbox start --state-dir "${state}"
          nvx-rs/target/release/nvx-rs sandbox exec --state-dir "${state}" \
            "${smoke_arguments[@]}"
          nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}"
          # A clean ext4 journal shows that stop unmounted every share, the
          # overlay, and scratch in order.
          python3 - "${state}/outcome.json" "${scratch}" <<'EOF'
          import json
          import struct
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              outcome = json.load(report)["outcome"]
          expected = {"operation": "managed", "category": "success", "status_code": 0}
          if outcome != expected:
              sys.exit(f"managed sandbox outcome is invalid: {outcome}")
          with open(sys.argv[2], "rb") as image:
              image.seek(1024 + 0x60)
              if struct.unpack("<I", image.read(4))[0] & 0x4:
                  sys.exit("managed stop left the scratch filesystem mounted")
          EOF
          check_shares
          nvx-rs/target/release/nvx-rs sandbox deprovision --state-dir "${state}"
          rm -rf "${workspace}" "${toolcache}" "${files}" "${scratch}" "${outside}"

      - name: Run Ubuntu sandbox share access policy on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-policy-${{ inputs.backend }}.ext4"
          share="build/ubuntu-policy-share-${{ inputs.backend }}"
          logs="build/test-results/ubuntu-${{ inputs.backend }}"
          # Keep the control socket path short.
          state=$(mktemp -d)
          cleanup() {
            if [ -f "${state}/runtime.json" ]; then
              nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}" --timeout 30 || true
            fi
            mkdir -p "${logs}"
            cp "${state}/openvmm.log" "${logs}/policy-openvmm.log" 2>/dev/null || true
          }
          trap cleanup EXIT
          # Every guest identity may write anywhere in the share, so only the
          # OpenVMM access policy can refuse a write.
          prepare_share() {
            rm -rf "${share}"
            mkdir -p "${share}/nvx-writable" "${share}/nvx-denied/nvx-allowed"
            printf 'host-to-guest\n' >"${share}/nvx-host-marker"
            printf 'secret\n' >"${share}/nvx-denied/secret"
            printf 'payload\n' >"${share}/nvx-denied/nvx-allowed/payload"
            chmod 0777 "${share}" "${share}/nvx-writable" \
              "${share}/nvx-denied/nvx-allowed"
            chmod 0666 "${share}/nvx-host-marker"
            cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          }
          # The guest's writes reach only the writable path, and the read-only,
          # denied, and allowed files are unchanged.
          check_share() {
            test "$(cat "${share}/nvx-writable/nvx-guest-marker")" = guest-to-host
            test -d "${share}/nvx-writable/nvx-guest-directory"
            test "$(ls -A "${share}/nvx-writable" | sort | tr '\n' ' ')" = "nvx-guest-directory nvx-guest-marker "
            test "$(ls -A "${share}" | sort | tr '\n' ' ')" = "nvx-denied nvx-host-marker nvx-writable "
            test "$(ls -A "${share}/nvx-denied" | sort | tr '\n' ' ')" = "nvx-allowed secret "
            test "$(ls -A "${share}/nvx-denied/nvx-allowed")" = payload
            test "$(cat "${share}/nvx-host-marker")" = host-to-guest
            test "$(cat "${share}/nvx-denied/secret")" = secret
            test "$(cat "${share}/nvx-denied/nvx-allowed/payload")" = payload
          }
          share_options=(
            --mount "/workspace,${share},rw"
            --mount-deny nvx-denied
            --mount-allow nvx-denied/nvx-allowed
            --mount-write nvx-writable
          )
          smoke_arguments=(
            --entrypoint /sbin/nvx-sandbox-smoke
            --arg /workspace --arg policy
          )
          prepare_share
          nvx-rs/target/release/nvx-rs sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            "${share_options[@]}" \
            "${smoke_arguments[@]}" \
            --workload-user 65534:65534 \
            --memory-mib 256
          check_share
          # A managed sandbox persists the access policy and reapplies it on
          # start.
          prepare_share
          nvx-rs/target/release/nvx-rs sandbox provision \
            --state-dir "${state}" \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            "${share_options[@]}" \
            --workload-user 65534:65534
          python3 - "${state}/config.json" <<'EOF'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              config = json.load(stream)
          # The export plan holds the policy paths resolved inside the share.
          export = config["export"]
          shares = []
          for bind in export["binds"]:
              child = export["children"][bind["child"]]
              shares.append(
                  (
                      bind["target"],
                      "ro" if bind["readOnly"] else "rw",
                      *(
                          [os.path.relpath(path, child["root"]) for path in child[name]]
                          for name in ("denied", "allowed", "write")
                      ),
                  )
              )
          expected = [
              (
                  "/workspace",
                  "rw",
                  ["nvx-denied"],
                  ["nvx-denied/nvx-allowed"],
                  ["nvx-writable"],
              ),
          ]
          if config["format"] != 8 or "mounts" in config or shares != expected:
              sys.exit(f"managed sandbox did not persist the access policy: {config}")
          EOF
          nvx-rs/target/release/nvx-rs sandbox start --state-dir "${state}"
          nvx-rs/target/release/nvx-rs sandbox exec --state-dir "${state}" \
            "${smoke_arguments[@]}"
          nvx-rs/target/release/nvx-rs sandbox stop --state-dir "${state}"
          # A clean ext4 journal shows that stop unmounted the share, the
          # overlay, and scratch in order.
          python3 - "${state}/outcome.json" "${scratch}" <<'EOF'
          import json
          import struct
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              outcome = json.load(report)["outcome"]
          expected = {"operation": "managed", "category": "success", "status_code": 0}
          if outcome != expected:
              sys.exit(f"managed sandbox outcome is invalid: {outcome}")
          with open(sys.argv[2], "rb") as image:
              image.seek(1024 + 0x60)
              if struct.unpack("<I", image.read(4))[0] & 0x4:
                  sys.exit("managed stop left the scratch filesystem mounted")
          EOF
          check_share
          nvx-rs/target/release/nvx-rs sandbox deprovision --state-dir "${state}"
          rm -rf "${share}" "${scratch}"

      - name: Run Ubuntu sandbox layer smoke test on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: |
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $scratch = "build\ubuntu-smoke-${{ inputs.backend }}.ext4"
          Copy-Item build\ubuntu-smoke-scratch.ext4 $scratch
          # The probe checks the security profile and that the 32 MiB memory
          # and 8-process limits hold.
          nvx-rs\target\release\nvx-rs.exe sandbox `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --entrypoint /sbin/nvx-sandbox-smoke `
            --arg limits `
            --arg 33554432 `
            --arg 8 `
            --workload-user 65534:65534 `
            --memory-max 33554432 `
            --pids-max 8 `
            --memory-mib 256

      - name: Run Ubuntu sandbox live-share smoke test on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $scratch = "build\ubuntu-share-${{ inputs.backend }}.ext4"
          $share = Join-Path $PWD "build\ubuntu-share-${{ inputs.backend }}"
          # The guest links nvx-links/outside to this host file through ../..;
          # the guest must resolve it in its own root, never on the host.
          $outside = Join-Path (Split-Path $share) "nvx-outside-marker"
          Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          if (Test-Path $share) { Remove-Item -Recurse -Force $share }
          New-Item -ItemType Directory -Force (Join-Path $share "nvx-denied"), (Join-Path $share "nvx-links") | Out-Null
          [IO.File]::WriteAllText((Join-Path $share "nvx-host-marker"), "host-to-guest`n")
          [IO.File]::WriteAllText((Join-Path $share "nvx-denied\secret"), "secret`n")
          [IO.File]::WriteAllText($outside, "host-outside`n")
          nvx-rs\target\release\nvx-rs.exe sandbox `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --mount "/workspace,$share,rw" `
            --mount-deny nvx-denied `
            --entrypoint /sbin/nvx-sandbox-smoke `
            --arg /workspace `
            --arg rw `
            --workload-user 65534:65534 `
            --memory-mib 256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = [IO.File]::ReadAllText((Join-Path $share "nvx-guest-marker"))
          if ($marker -ne "guest-to-host`n") { throw "guest write did not reach the host" }
          if (-not (Test-Path (Join-Path $share "nvx-guest-directory") -PathType Container)) {
              throw "guest directory did not reach the host"
          }
          # Guest-created links are WSL-style reparse points that keep their
          # exact targets and that Windows never follows, so none of them
          # reaches host data outside the policy.
          @'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nvx_tools.microvm_tests import assert_guest_symlink

          links = Path(sys.argv[1])
          for name, target in (
              ("nvx-tool", "../nvx-tool"),
              ("absolute", "/nvx/absolute/target"),
              ("outside", "../../nvx-outside-marker"),
              ("denied", "../nvx-denied/secret"),
              ("denied-directory", "../nvx-denied"),
          ):
              assert_guest_symlink(links / name, target)
          '@ | python - (Join-Path $share "nvx-links")
          if ($LASTEXITCODE -ne 0) { throw "guest links are not inert WSL-style links with exact targets" }
          if ([IO.File]::Exists((Join-Path $share "nvx-links\marker"))) { throw "guest link removal did not reach the host" }
          if ([IO.File]::ReadAllText($outside) -ne "host-outside`n") { throw "a guest link reached host data outside the share" }
          if ([IO.File]::ReadAllText((Join-Path $share "nvx-denied\secret")) -ne "secret`n") { throw "a guest link reached a denied file" }
          Remove-Item -Recurse -Force (Join-Path $share "nvx-guest-marker"), (Join-Path $share "nvx-guest-directory"), (Join-Path $share "nvx-tool"), (Join-Path $share "nvx-links")
          Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          nvx-rs\target\release\nvx-rs.exe sandbox `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --mount "/opt/hostedtoolcache,$share,ro" `
            --mount-deny nvx-denied `
            --entrypoint /sbin/nvx-sandbox-smoke `
            --arg /opt/hostedtoolcache `
            --arg ro `
            --workload-user 65534:65534 `
            --memory-mib 256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $share "nvx-guest-marker")) { throw "read-only share accepted a write" }
          if ([IO.File]::Exists((Join-Path $share "nvx-guest-link"))) { throw "read-only share accepted a symlink" }
          Remove-Item -Recurse -Force $share, $scratch, $outside

      - name: Run Ubuntu sandbox managed live-share smoke test on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Nvx {
              nvx-rs\target\release\nvx-rs.exe @args
              if ($LASTEXITCODE -ne 0) {
                  throw "nvx-rs $($args[0]) $($args[1]) failed with exit code $LASTEXITCODE"
              }
          }
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $scratch = Join-Path $PWD "build\ubuntu-managed-${{ inputs.backend }}.ext4"
          $share = Join-Path $PWD "build\ubuntu-managed-share-${{ inputs.backend }}"
          $state = Join-Path $PWD "build\ubuntu-managed-state-${{ inputs.backend }}"
          $outside = Join-Path (Split-Path $share) "nvx-outside-marker"
          $logs = "build\test-results\ubuntu-${{ inputs.backend }}"
          Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          foreach ($path in $share, $state) {
              if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
          New-Item -ItemType Directory -Force (Join-Path $share "nvx-denied"), (Join-Path $share "nvx-links") | Out-Null
          [IO.File]::WriteAllText((Join-Path $share "nvx-host-marker"), "host-to-guest`n")
          [IO.File]::WriteAllText((Join-Path $share "nvx-denied\secret"), "secret`n")
          [IO.File]::WriteAllText($outside, "host-outside`n")
          Invoke-Nvx sandbox provision `
            --state-dir $state `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --mount "/workspace,$share,rw" `
            --mount-deny nvx-denied `
            --workload-user 65534:65534
          try {
              Invoke-Nvx sandbox start --state-dir $state
              Invoke-Nvx sandbox exec `
                --state-dir $state `
                --entrypoint /sbin/nvx-sandbox-smoke `
                --arg /workspace `
                --arg rw
              Invoke-Nvx sandbox stop --state-dir $state
          } finally {
              if (Test-Path (Join-Path $state "runtime.json")) {
                  nvx-rs\target\release\nvx-rs.exe sandbox stop --state-dir $state --timeout 30
              }
              New-Item -ItemType Directory -Force $logs | Out-Null
              $log = Join-Path $state "openvmm.log"
              if (Test-Path $log) { Copy-Item -Force $log (Join-Path $logs "managed-share-openvmm.log") }
          }
          $outcome = (Get-Content -Raw (Join-Path $state "outcome.json") | ConvertFrom-Json).outcome
          if ($outcome.operation -ne "managed" -or $outcome.category -ne "success" -or $outcome.status_code -ne 0) {
              throw "managed sandbox outcome is invalid: $($outcome | ConvertTo-Json -Compress)"
          }
          # A clean ext4 journal shows that stop unmounted the share, overlay,
          # and scratch in order instead of powering off with them mounted.
          $image = [IO.File]::OpenRead($scratch)
          try {
              $null = $image.Seek(1024 + 0x60, [IO.SeekOrigin]::Begin)
              $incompat = New-Object byte[] 4
              if ($image.Read($incompat, 0, 4) -ne 4) { throw "scratch superblock is truncated" }
          } finally {
              $image.Dispose()
          }
          if ([BitConverter]::ToUInt32($incompat, 0) -band 4) {
              throw "managed stop left the scratch filesystem mounted"
          }
          $marker = [IO.File]::ReadAllText((Join-Path $share "nvx-guest-marker"))
          if ($marker -ne "guest-to-host`n") { throw "managed guest write did not reach the host" }
          if (-not (Test-Path (Join-Path $share "nvx-guest-directory") -PathType Container)) {
              throw "managed guest directory did not reach the host"
          }
          @'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nvx_tools.microvm_tests import assert_guest_symlink

          links = Path(sys.argv[1])
          for name, target in (
              ("nvx-tool", "../nvx-tool"),
              ("absolute", "/nvx/absolute/target"),
              ("outside", "../../nvx-outside-marker"),
              ("denied", "../nvx-denied/secret"),
              ("denied-directory", "../nvx-denied"),
          ):
              assert_guest_symlink(links / name, target)
          '@ | python - (Join-Path $share "nvx-links")
          if ($LASTEXITCODE -ne 0) { throw "managed guest links are not inert WSL-style links with exact targets" }
          if ([IO.File]::Exists((Join-Path $share "nvx-links\marker"))) { throw "managed guest link removal did not reach the host" }
          if ([IO.File]::ReadAllText($outside) -ne "host-outside`n") { throw "a managed guest link reached host data outside the share" }
          if ([IO.File]::ReadAllText((Join-Path $share "nvx-denied\secret")) -ne "secret`n") { throw "a managed guest link reached a denied file" }
          Invoke-Nvx sandbox deprovision --state-dir $state
          Remove-Item -Recurse -Force $share, $scratch, $outside

      - name: Run Ubuntu sandbox concurrent read-write and read-only shares on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Nvx {
              nvx-rs\target\release\nvx-rs.exe @args
              if ($LASTEXITCODE -ne 0) {
                  throw "nvx-rs $($args[0]) $($args[1]) failed with exit code $LASTEXITCODE"
              }
          }
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $layer = "distro,build\ubuntu-distro.erofs,$($manifest.uuid)"
          $scratch = Join-Path $PWD "build\ubuntu-shares-${{ inputs.backend }}.ext4"
          $workspace = Join-Path $PWD "build\ubuntu-shares-workspace-${{ inputs.backend }}"
          $toolcache = Join-Path $PWD "build\ubuntu-shares-toolcache-${{ inputs.backend }}"
          $files = Join-Path $PWD "build\ubuntu-shares-files-${{ inputs.backend }}"
          $state = Join-Path $PWD "build\ubuntu-shares-state-${{ inputs.backend }}"
          $outside = Join-Path (Split-Path $workspace) "nvx-outside-marker"
          $logs = "build\test-results\ubuntu-${{ inputs.backend }}"
          $settings = Join-Path $files "config\settings.json"
          $output = Join-Path $files "results\output.txt"
          $shareOptions = @(
              "--mount", "/workspace,$workspace,rw", "--mount-deny", "nvx-denied",
              "--mount", "/opt/hostedtoolcache,$toolcache,ro", "--mount-deny", "nvx-denied",
              "--mount", "/config/settings.json,$settings,ro",
              "--mount", "/results/output.txt,$output,rw"
          )
          $smokeArguments = @(
              "--entrypoint", "/sbin/nvx-sandbox-smoke",
              "--arg", "/workspace", "--arg", "rw",
              "--arg", "/opt/hostedtoolcache", "--arg", "ro",
              "--arg", "/config/settings.json", "--arg", "file-ro",
              "--arg", "/results/output.txt", "--arg", "file-rw"
          )
          function Initialize-Shares {
              foreach ($path in $workspace, $toolcache, $files, $state) {
                  if (Test-Path $path) { Remove-Item -Recurse -Force $path }
              }
              New-Item -ItemType Directory -Force (Join-Path $workspace "nvx-denied"), (Join-Path $workspace "nvx-links"), (Join-Path $toolcache "nvx-denied"), (Join-Path $files "config"), (Join-Path $files "results") | Out-Null
              foreach ($share in $workspace, $toolcache) {
                  [IO.File]::WriteAllText((Join-Path $share "nvx-host-marker"), "host-to-guest`n")
                  [IO.File]::WriteAllText((Join-Path $share "nvx-denied\secret"), "secret`n")
              }
              [IO.File]::WriteAllText($outside, "host-outside`n")
              # Each shared file sits beside a file that no share exposes.
              [IO.File]::WriteAllText($settings, "host-to-guest`n")
              [IO.File]::WriteAllText((Join-Path $files "config\secret.json"), "secret`n")
              [IO.File]::WriteAllText($output, "host-to-guest`n")
              [IO.File]::WriteAllText((Join-Path $files "results\other.txt"), "other`n")
              Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          }
          # The guest writes to the read-write share, and neither it nor a link
          # in the read-write share changes the read-only share. It rewrites
          # only the read-write file, and the files beside the shared files
          # stay unchanged.
          function Test-Shares {
              if ([IO.File]::ReadAllText((Join-Path $workspace "nvx-guest-marker")) -ne "guest-to-host`n") {
                  throw "guest write did not reach the read-write share"
              }
              if (-not (Test-Path (Join-Path $workspace "nvx-guest-directory") -PathType Container)) {
                  throw "guest directory did not reach the read-write share"
              }
              if (Test-Path -LiteralPath (Join-Path $workspace "nvx-cross-share-link")) {
                  throw "cross-share link removal did not reach the host"
              }
              $entries = (Get-ChildItem -Force -Name $toolcache | Sort-Object) -join " "
              if ($entries -ne "nvx-denied nvx-host-marker") { throw "guest changed the read-only share: $entries" }
              foreach ($share in $workspace, $toolcache) {
                  if ([IO.File]::ReadAllText((Join-Path $share "nvx-denied\secret")) -ne "secret`n") { throw "guest changed a denied file" }
              }
              if ([IO.File]::ReadAllText((Join-Path $toolcache "nvx-host-marker")) -ne "host-to-guest`n") { throw "guest changed the read-only share" }
              if ([IO.File]::ReadAllText($outside) -ne "host-outside`n") { throw "a guest link reached host data outside the shares" }
              foreach ($directory in "config", "results") {
                  $entries = (Get-ChildItem -Force -Name (Join-Path $files $directory) | Sort-Object) -join " "
                  $expected = @{ config = "secret.json settings.json"; results = "other.txt output.txt" }[$directory]
                  if ($entries -ne $expected) { throw "guest changed the directory of a shared file: $entries" }
              }
              if ([IO.File]::ReadAllText($settings) -ne "host-to-guest`n") { throw "guest changed the read-only file" }
              if ([IO.File]::ReadAllText($output) -ne "guest-to-host`n") { throw "guest write did not reach the read-write file" }
              if ([IO.File]::ReadAllText((Join-Path $files "config\secret.json")) -ne "secret`n") { throw "guest changed a file beside a shared file" }
              if ([IO.File]::ReadAllText((Join-Path $files "results\other.txt")) -ne "other`n") { throw "guest changed a file beside a shared file" }
          }
          Initialize-Shares
          Invoke-Nvx sandbox --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions @smokeArguments --workload-user 65534:65534 --memory-mib 256
          Test-Shares
          # A managed sandbox persists every share and reattaches them on start.
          Initialize-Shares
          Invoke-Nvx sandbox provision --state-dir $state --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions --workload-user 65534:65534
          $config = Get-Content -Raw (Join-Path $state "config.json") | ConvertFrom-Json
          # The export plan binds each share's root, in the order of the
          # targets' depth, then the targets.
          $shares = ($config.export.binds | ForEach-Object {
              $bind = $_
              $child = $config.export.children[$bind.child]
              $mode = if ($bind.readOnly) { "ro" } else { "rw" }
              $kind = if ($child.file) { "file" } else { "directory" }
              $denied = ($child.denied | ForEach-Object { $_.Substring($child.root.Length + 1).Replace("\", "/") }) -join ";"
              "$($bind.target),$($bind.source),$mode,$denied,$kind"
          }) -join " "
          if ($config.format -ne 8 -or $shares -ne "/workspace,,rw,nvx-denied,directory /config/settings.json,,ro,,file /opt/hostedtoolcache,,ro,nvx-denied,directory /results/output.txt,,rw,,file") {
              throw "managed sandbox did not persist every share: $($config | ConvertTo-Json -Compress -Depth 5)"
          }
          try {
              Invoke-Nvx sandbox start --state-dir $state
              Invoke-Nvx sandbox exec --state-dir $state @smokeArguments
              Invoke-Nvx sandbox stop --state-dir $state
          } finally {
              if (Test-Path (Join-Path $state "runtime.json")) {
                  nvx-rs\target\release\nvx-rs.exe sandbox stop --state-dir $state --timeout 30
              }
              New-Item -ItemType Directory -Force $logs | Out-Null
              $log = Join-Path $state "openvmm.log"
              if (Test-Path $log) { Copy-Item -Force $log (Join-Path $logs "shares-openvmm.log") }
          }
          $outcome = (Get-Content -Raw (Join-Path $state "outcome.json") | ConvertFrom-Json).outcome
          if ($outcome.operation -ne "managed" -or $outcome.category -ne "success" -or $outcome.status_code -ne 0) {
              throw "managed sandbox outcome is invalid: $($outcome | ConvertTo-Json -Compress)"
          }
          # A clean ext4 journal shows that stop unmounted every share, the
          # overlay, and scratch in order.
          $image = [IO.File]::OpenRead($scratch)
          try {
              $null = $image.Seek(1024 + 0x60, [IO.SeekOrigin]::Begin)
              $incompat = New-Object byte[] 4
              if ($image.Read($incompat, 0, 4) -ne 4) { throw "scratch superblock is truncated" }
          } finally {
              $image.Dispose()
          }
          if ([BitConverter]::ToUInt32($incompat, 0) -band 4) {
              throw "managed stop left the scratch filesystem mounted"
          }
          Test-Shares
          Invoke-Nvx sandbox deprovision --state-dir $state
          Remove-Item -Recurse -Force $workspace, $toolcache, $files, $scratch, $outside

      - name: Run Ubuntu sandbox share access policy on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Nvx {
              nvx-rs\target\release\nvx-rs.exe @args
              if ($LASTEXITCODE -ne 0) {
                  throw "nvx-rs $($args[0]) $($args[1]) failed with exit code $LASTEXITCODE"
              }
          }
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $layer = "distro,build\ubuntu-distro.erofs,$($manifest.uuid)"
          $scratch = Join-Path $PWD "build\ubuntu-policy-${{ inputs.backend }}.ext4"
          $share = Join-Path $PWD "build\ubuntu-policy-share-${{ inputs.backend }}"
          $state = Join-Path $PWD "build\ubuntu-policy-state-${{ inputs.backend }}"
          $logs = "build\test-results\ubuntu-${{ inputs.backend }}"
          $shareOptions = @(
              "--mount", "/workspace,$share,rw",
              "--mount-deny", "nvx-denied",
              "--mount-allow", "nvx-denied/nvx-allowed",
              "--mount-write", "nvx-writable"
          )
          $smokeArguments = @(
              "--entrypoint", "/sbin/nvx-sandbox-smoke",
              "--arg", "/workspace", "--arg", "policy"
          )
          function Initialize-Share {
              foreach ($path in $share, $state) {
                  if (Test-Path $path) { Remove-Item -Recurse -Force $path }
              }
              New-Item -ItemType Directory -Force (Join-Path $share "nvx-writable"), (Join-Path $share "nvx-denied\nvx-allowed") | Out-Null
              [IO.File]::WriteAllText((Join-Path $share "nvx-host-marker"), "host-to-guest`n")
              [IO.File]::WriteAllText((Join-Path $share "nvx-denied\secret"), "secret`n")
              [IO.File]::WriteAllText((Join-Path $share "nvx-denied\nvx-allowed\payload"), "payload`n")
              Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          }
          # The guest's writes reach only the writable path, and the read-only,
          # denied, and allowed files are unchanged.
          function Test-Share {
              if ([IO.File]::ReadAllText((Join-Path $share "nvx-writable\nvx-guest-marker")) -ne "guest-to-host`n") {
                  throw "guest write did not reach the writable path"
              }
              foreach ($check in @(
                  @($share, "nvx-denied nvx-host-marker nvx-writable"),
                  @((Join-Path $share "nvx-writable"), "nvx-guest-directory nvx-guest-marker"),
                  @((Join-Path $share "nvx-denied"), "nvx-allowed secret"),
                  @((Join-Path $share "nvx-denied\nvx-allowed"), "payload")
              )) {
                  $entries = (Get-ChildItem -Force -Name $check[0] | Sort-Object) -join " "
                  if ($entries -ne $check[1]) { throw "unexpected entries in $($check[0]): $entries" }
              }
              foreach ($file in @(
                  @("nvx-host-marker", "host-to-guest`n"),
                  @("nvx-denied\secret", "secret`n"),
                  @("nvx-denied\nvx-allowed\payload", "payload`n")
              )) {
                  if ([IO.File]::ReadAllText((Join-Path $share $file[0])) -ne $file[1]) { throw "guest changed $($file[0])" }
              }
          }
          Initialize-Share
          Invoke-Nvx sandbox --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions @smokeArguments --workload-user 65534:65534 --memory-mib 256
          Test-Share
          # A managed sandbox persists the access policy and reapplies it on
          # start.
          Initialize-Share
          Invoke-Nvx sandbox provision --state-dir $state --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions --workload-user 65534:65534
          $config = Get-Content -Raw (Join-Path $state "config.json") | ConvertFrom-Json
          # The export plan holds the policy paths resolved inside the share.
          $child = @($config.export.children)[0]
          $bind = @($config.export.binds)[0]
          function Get-Relative($paths) {
              ($paths | ForEach-Object { $_.Substring($child.root.Length + 1).Replace("\", "/") }) -join ","
          }
          if ($config.format -ne 8 -or @($config.export.children).Count -ne 1 -or @($config.export.binds).Count -ne 1 -or $bind.target -ne "/workspace" -or $bind.readOnly -or (Get-Relative $child.denied) -ne "nvx-denied" -or (Get-Relative $child.allowed) -ne "nvx-denied/nvx-allowed" -or (Get-Relative $child.write) -ne "nvx-writable") {
              throw "managed sandbox did not persist the access policy: $($config | ConvertTo-Json -Compress -Depth 5)"
          }
          try {
              Invoke-Nvx sandbox start --state-dir $state
              Invoke-Nvx sandbox exec --state-dir $state @smokeArguments
              Invoke-Nvx sandbox stop --state-dir $state
          } finally {
              if (Test-Path (Join-Path $state "runtime.json")) {
                  nvx-rs\target\release\nvx-rs.exe sandbox stop --state-dir $state --timeout 30
              }
              New-Item -ItemType Directory -Force $logs | Out-Null
              $log = Join-Path $state "openvmm.log"
              if (Test-Path $log) { Copy-Item -Force $log (Join-Path $logs "policy-openvmm.log") }
          }
          $outcome = (Get-Content -Raw (Join-Path $state "outcome.json") | ConvertFrom-Json).outcome
          if ($outcome.operation -ne "managed" -or $outcome.category -ne "success" -or $outcome.status_code -ne 0) {
              throw "managed sandbox outcome is invalid: $($outcome | ConvertTo-Json -Compress)"
          }
          # A clean ext4 journal shows that stop unmounted the share, the
          # overlay, and scratch in order.
          $image = [IO.File]::OpenRead($scratch)
          try {
              $null = $image.Seek(1024 + 0x60, [IO.SeekOrigin]::Begin)
              $incompat = New-Object byte[] 4
              if ($image.Read($incompat, 0, 4) -ne 4) { throw "scratch superblock is truncated" }
          } finally {
              $image.Dispose()
          }
          if ([BitConverter]::ToUInt32($incompat, 0) -band 4) {
              throw "managed stop left the scratch filesystem mounted"
          }
          Test-Share
          Invoke-Nvx sandbox deprovision --state-dir $state
          Remove-Item -Recurse -Force $share, $scratch

      # The runtime adapter's consolidated suite on this backend: each scenario
      # that tests/runtime-adapter/scenarios.txt names, by name, in its
      # host-only configuration, whose VM scenarios are its ignored tests and
      # read the backend through `nvx::Hypervisor::from_env_or_default`. The
      # command fails once a scenario names a test that its target does not
      # have, a named target has a test that no scenario names, the library or
      # another target has an ignored test, or a named test does not run and
      # pass. Its host program launches VMs of the artifacts above, with the
      # runtime identity that their build provenance gives, whose initramfs runs
      # the adapter's guest agent in place of NVX's agents. Later processes of
      # the host program reattach to a VM, as after a restart of the
      # orchestrator, and stop it. The layered scenarios boot the Ubuntu EROFS
      # image over a copy of the scratch template, from the guest artifacts, as
      # the sandbox steps above do, and the guest agent's worker assembles the
      # root outside PID 1. The guest agent is a static musl executable: Linux
      # builds it, and Windows takes the one that distro-artifacts builds on
      # Linux, as it takes the Ubuntu and Azure Linux images.
      - name: Build the runtime adapter's guest agent on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        working-directory: tests/runtime-adapter
        run: >-
          cargo build --locked --release --features guest
          --target x86_64-unknown-linux-musl --bin runtime-adapter-guest

      - name: Run runtime adapter scenarios on Linux
        if: runner.os != 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: bash
        run: >-
          python3 scripts/nvx.py test-runtime-adapter
          --backend "${{ inputs.backend }}"
          --guest-agent tests/runtime-adapter/target/x86_64-unknown-linux-musl/release/runtime-adapter-guest

      - name: Download the runtime adapter's guest agent on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        uses: actions/download-artifact@v8
        with:
          name: runtime-adapter-guest
          path: build/runtime-adapter

      - name: Run runtime adapter scenarios on Windows
        if: runner.os == 'Windows' && inputs.guests-and-sandboxes && !inputs.debug-kernel
        shell: powershell
        run: >-
          python scripts\nvx.py test-runtime-adapter
          --backend "${{ inputs.backend }}"
          --guest-agent build\runtime-adapter\runtime-adapter-guest

      - name: Upload NVX microVM failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nvx-microvm-tests-${{ inputs.backend }}${{ inputs.debug-kernel && '-debug' || '' }}${{ inputs.guests-and-sandboxes && '-guests' || '' }}${{ inputs.shard && format('-shard-{0}', inputs.shard) || '' }}
          path: |
            build/test-results/public-exec-${{ inputs.backend }}
            build/test-results/microvm-${{ inputs.backend }}
            build/test-results/microvm-${{ inputs.backend }}-debug
            build/test-results/ubuntu-${{ inputs.backend }}
            build/test-results/ubuntu-kvm-extended
            build/test-results/azurelinux-${{ inputs.backend }}
          if-no-files-found: warn

      # Each job and attempt keeps the scenario duration report of every
      # test-microvm step (doc/usage.md#scenario-duration-report), whether the
      # job passes, fails, or is cancelled; each shard of the default suite
      # keeps its own.
      - name: Upload NVX microVM scenario durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvx-microvm-durations-${{ runner.os }}-${{ inputs.backend }}-${{ inputs.debug-kernel && 'debug' || 'default' }}${{ inputs.guests-and-sandboxes && '-guests' || '' }}${{ inputs.shard && format('-shard-{0}', inputs.shard) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/*/scenario-durations.jsonl
          if-no-files-found: warn
          retention-days: 30
