          if (-not (Test-Path (Join-Path $share "nvx-guest-directory") -PathType Container)) {
              throw "managed guest directory did not reach the host"
          }
          @'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nvx_tools.microvm_tests import assert_guest_symlink

          links = Path(sys.argv[1])
          for name, target in (
              ("nvx-tool", "../nvx-tool"),
              ("absolute", "/nvx/absolute/target"),
              ("outside", "../../nvx-outside-marker"),
              ("denied", "../nvx-denied/secret"),
              ("denied-directory", "../nvx-denied"),
          ):
              assert_guest_symlink(links / name, target)
          '@ | python - (Join-Path $share "nvx-links")
          if ($LASTEXITCODE -ne 0) { throw "managed guest links are not inert WSL-style links with exact targets" }
          if ([IO.File]::Exists((Join-Path $share "nvx-links\marker"))) { throw "managed guest link removal did not reach the host" }
          if ([IO.File]::ReadAllText($outside) -ne "host-outside`n") { throw "a managed guest link reached host data outside the share" }
          if ([IO.File]::ReadAllText((Join-Path $share "nvx-denied\secret")) -ne "secret`n") { throw "a managed guest link reached a denied file" }
          Invoke-Nvx sandbox deprovision --state-dir $state
          Remove-Item -Recurse -Force $share, $scratch, $outside

      - name: Run Ubuntu sandbox concurrent read-write and read-only shares on Windows
        if: runner.os == 'Windows' && !inputs.debug-kernel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Nvx {
              python scripts\nvx.py @args
              if ($LASTEXITCODE -ne 0) {
                  throw "nvx.py $($args[0]) $($args[1]) failed with exit code $LASTEXITCODE"
              }
          }
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $layer = "distro,build\ubuntu-distro.erofs,$($manifest.uuid)"
          $scratch = Join-Path $PWD "build\ubuntu-shares-${{ inputs.backend }}.ext4"
          $workspace = Join-Path $PWD "build\ubuntu-shares-workspace-${{ inputs.backend }}"
          $toolcache = Join-Path $PWD "build\ubuntu-shares-toolcache-${{ inputs.backend }}"
          $files = Join-Path $PWD "build\ubuntu-shares-files-${{ inputs.backend }}"
          $state = Join-Path $PWD "build\ubuntu-shares-state-${{ inputs.backend }}"
          $outside = Join-Path (Split-Path $workspace) "nvx-outside-marker"
          $logs = "build\test-results\ubuntu-${{ inputs.backend }}"
          $settings = Join-Path $files "config\settings.json"
          $output = Join-Path $files "results\output.txt"
          $shareOptions = @(
              "--mount", "/workspace,$workspace,rw", "--mount-deny", "nvx-denied",
              "--mount", "/opt/hostedtoolcache,$toolcache,ro", "--mount-deny", "nvx-denied",
              "--mount", "/config/settings.json,$settings,ro",
              "--mount", "/results/output.txt,$output,rw"
          )
          $smokeArguments = @(
              "--entrypoint", "/sbin/nvx-sandbox-smoke",
              "--arg", "/workspace", "--arg", "rw",
              "--arg", "/opt/hostedtoolcache", "--arg", "ro",
              "--arg", "/config/settings.json", "--arg", "file-ro",
              "--arg", "/results/output.txt", "--arg", "file-rw"
          )
          function Initialize-Shares {
              foreach ($path in $workspace, $toolcache, $files, $state) {
                  if (Test-Path $path) { Remove-Item -Recurse -Force $path }
              }
              New-Item -ItemType Directory -Force (Join-Path $workspace "nvx-denied"), (Join-Path $workspace "nvx-links"), (Join-Path $toolcache "nvx-denied"), (Join-Path $files "config"), (Join-Path $files "results") | Out-Null
              foreach ($share in $workspace, $toolcache) {
                  [IO.File]::WriteAllText((Join-Path $share "nvx-host-marker"), "host-to-guest`n")
                  [IO.File]::WriteAllText((Join-Path $share "nvx-denied\secret"), "secret`n")
              }
              [IO.File]::WriteAllText($outside, "host-outside`n")
              # Each shared file sits beside a file that no share exposes.
              [IO.File]::WriteAllText($settings, "host-to-guest`n")
              [IO.File]::WriteAllText((Join-Path $files "config\secret.json"), "secret`n")
              [IO.File]::WriteAllText($output, "host-to-guest`n")
              [IO.File]::WriteAllText((Join-Path $files "results\other.txt"), "other`n")
              Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          }
          # The guest writes to the read-write share, and neither it nor a link
          # in the read-write share changes the read-only share. It rewrites
          # only the read-write file, and the files beside the shared files
          # stay unchanged.
          function Test-Shares {
              if ([IO.File]::ReadAllText((Join-Path $workspace "nvx-guest-marker")) -ne "guest-to-host`n") {
                  throw "guest write did not reach the read-write share"
              }
              if (-not (Test-Path (Join-Path $workspace "nvx-guest-directory") -PathType Container)) {
                  throw "guest directory did not reach the read-write share"
              }
              if (Test-Path -LiteralPath (Join-Path $workspace "nvx-cross-share-link")) {
                  throw "cross-share link removal did not reach the host"
              }
              $entries = (Get-ChildItem -Force -Name $toolcache | Sort-Object) -join " "
              if ($entries -ne "nvx-denied nvx-host-marker") { throw "guest changed the read-only share: $entries" }
              foreach ($share in $workspace, $toolcache) {
                  if ([IO.File]::ReadAllText((Join-Path $share "nvx-denied\secret")) -ne "secret`n") { throw "guest changed a denied file" }
              }
              if ([IO.File]::ReadAllText((Join-Path $toolcache "nvx-host-marker")) -ne "host-to-guest`n") { throw "guest changed the read-only share" }
              if ([IO.File]::ReadAllText($outside) -ne "host-outside`n") { throw "a guest link reached host data outside the shares" }
              foreach ($directory in "config", "results") {
                  $entries = (Get-ChildItem -Force -Name (Join-Path $files $directory) | Sort-Object) -join " "
                  $expected = @{ config = "secret.json settings.json"; results = "other.txt output.txt" }[$directory]
                  if ($entries -ne $expected) { throw "guest changed the directory of a shared file: $entries" }
              }
              if ([IO.File]::ReadAllText($settings) -ne "host-to-guest`n") { throw "guest changed the read-only file" }
              if ([IO.File]::ReadAllText($output) -ne "guest-to-host`n") { throw "guest write did not reach the read-write file" }
              if ([IO.File]::ReadAllText((Join-Path $files "config\secret.json")) -ne "secret`n") { throw "guest changed a file beside a shared file" }
              if ([IO.File]::ReadAllText((Join-Path $files "results\other.txt")) -ne "other`n") { throw "guest changed a file beside a shared file" }
          }
          Initialize-Shares
          Invoke-Nvx sandbox --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions @smokeArguments --workload-user 65534:65534 --memory-mib 256
          Test-Shares
          # A managed sandbox persists every share and reattaches them on start.
          Initialize-Shares
          Invoke-Nvx sandbox provision --state-dir $state --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions --workload-user 65534:65534
          $config = Get-Content -Raw (Join-Path $state "config.json") | ConvertFrom-Json
          $shares = ($config.mounts | ForEach-Object { "$($_.guest_target),$($_.access),$($_.kind)" }) -join " "
          if ($config.format -ne 6 -or $shares -ne "/workspace,rw,directory /opt/hostedtoolcache,ro,directory /config/settings.json,ro,file /results/output.txt,rw,file") {
              throw "managed sandbox did not persist every share: $($config | ConvertTo-Json -Compress -Depth 5)"
          }
          try {
              Invoke-Nvx sandbox start --state-dir $state
              Invoke-Nvx sandbox exec --state-dir $state @smokeArguments
              Invoke-Nvx sandbox stop --state-dir $state
          } finally {
              if (Test-Path (Join-Path $state "runtime.json")) {
                  python scripts\nvx.py sandbox stop --state-dir $state --timeout 30
              }
              New-Item -ItemType Directory -Force $logs | Out-Null
              $log = Join-Path $state "openvmm.log"
              if (Test-Path $log) { Copy-Item -Force $log (Join-Path $logs "shares-openvmm.log") }
          }
          $outcome = (Get-Content -Raw (Join-Path $state "outcome.json") | ConvertFrom-Json).outcome
          if ($outcome.operation -ne "managed" -or $outcome.category -ne "success" -or $outcome.status_code -ne 0) {
              throw "managed sandbox outcome is invalid: $($outcome | ConvertTo-Json -Compress)"
          }
          # A clean ext4 journal shows that stop unmounted every share, the
          # overlay, and scratch in order.
          $image = [IO.File]::OpenRead($scratch)
          try {
              $null = $image.Seek(1024 + 0x60, [IO.SeekOrigin]::Begin)
              $incompat = New-Object byte[] 4
              if ($image.Read($incompat, 0, 4) -ne 4) { throw "scratch superblock is truncated" }
          } finally {
              $image.Dispose()
          }
          if ([BitConverter]::ToUInt32($incompat, 0) -band 4) {
              throw "managed stop left the scratch filesystem mounted"
          }
          Test-Shares
          Invoke-Nvx sandbox deprovision --state-dir $state
          Remove-Item -Recurse -Force $workspace, $toolcache, $files, $scratch, $outside

