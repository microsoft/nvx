          }
          # The guest's writes reach only the writable path, and the read-only,
          # denied, and allowed files are unchanged.
          function Test-Share {
              if ([IO.File]::ReadAllText((Join-Path $share "nvx-writable\nvx-guest-marker")) -ne "guest-to-host`n") {
                  throw "guest write did not reach the writable path"
              }
              foreach ($check in @(
                  @($share, "nvx-denied nvx-host-marker nvx-writable"),
                  @((Join-Path $share "nvx-writable"), "nvx-guest-directory nvx-guest-marker"),
                  @((Join-Path $share "nvx-denied"), "nvx-allowed secret"),
                  @((Join-Path $share "nvx-denied\nvx-allowed"), "payload")
              )) {
                  $entries = (Get-ChildItem -Force -Name $check[0] | Sort-Object) -join " "
                  if ($entries -ne $check[1]) { throw "unexpected entries in $($check[0]): $entries" }
              }
              foreach ($file in @(
                  @("nvx-host-marker", "host-to-guest`n"),
                  @("nvx-denied\secret", "secret`n"),
                  @("nvx-denied\nvx-allowed\payload", "payload`n")
              )) {
                  if ([IO.File]::ReadAllText((Join-Path $share $file[0])) -ne $file[1]) { throw "guest changed $($file[0])" }
              }
          }
          Initialize-Share
          Invoke-Nvx sandbox --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions @smokeArguments --workload-user 65534:65534 --memory-mib 256
          Test-Share
          # A managed sandbox persists the access policy and reapplies it on
          # start.
          Initialize-Share
          Invoke-Nvx sandbox provision --state-dir $state --hypervisor "${{ inputs.backend }}" --layer $layer --scratch $scratch @shareOptions --workload-user 65534:65534
          $config = Get-Content -Raw (Join-Path $state "config.json") | ConvertFrom-Json
          $mount = $config.mounts[0]
          if ($config.format -ne 5 -or $config.mounts.Count -ne 1 -or $mount.access -ne "rw" -or ($mount.denied_paths -join ",") -ne "nvx-denied" -or ($mount.allowed_paths -join ",") -ne "nvx-denied/nvx-allowed" -or ($mount.writable_paths -join ",") -ne "nvx-writable") {
              throw "managed sandbox did not persist the access policy: $($config | ConvertTo-Json -Compress -Depth 5)"
          }
          try {
              Invoke-Nvx sandbox start --state-dir $state
              Invoke-Nvx sandbox exec --state-dir $state @smokeArguments
              Invoke-Nvx sandbox stop --state-dir $state
          } finally {
              if (Test-Path (Join-Path $state "runtime.json")) {
                  python scripts\nvx.py sandbox stop --state-dir $state --timeout 30
              }
              New-Item -ItemType Directory -Force $logs | Out-Null
              $log = Join-Path $state "openvmm.log"
              if (Test-Path $log) { Copy-Item -Force $log (Join-Path $logs "policy-openvmm.log") }
          }
          $outcome = (Get-Content -Raw (Join-Path $state "outcome.json") | ConvertFrom-Json).outcome
          if ($outcome.operation -ne "managed" -or $outcome.category -ne "success" -or $outcome.status_code -ne 0) {
              throw "managed sandbox outcome is invalid: $($outcome | ConvertTo-Json -Compress)"
          }
          # A clean ext4 journal shows that stop unmounted the share, the
          # overlay, and scratch in order.
          $image = [IO.File]::OpenRead($scratch)
          try {
              $null = $image.Seek(1024 + 0x60, [IO.SeekOrigin]::Begin)
              $incompat = New-Object byte[] 4
              if ($image.Read($incompat, 0, 4) -ne 4) { throw "scratch superblock is truncated" }
          } finally {
              $image.Dispose()
          }
          if ([BitConverter]::ToUInt32($incompat, 0) -band 4) {
              throw "managed stop left the scratch filesystem mounted"
          }
          Test-Share
          Invoke-Nvx sandbox deprovision --state-dir $state
          Remove-Item -Recurse -Force $share, $scratch

      - name: Run aci_edge_sandboxes lifecycle test on Linux
        if: runner.os != 'Windows' && !inputs.debug-kernel
        shell: bash
        run: >-
          python3 scripts/nvx.py test-aci-edge-sandboxes
          --backend "${{ inputs.backend }}"
          --output-dir "build/test-results/aci-edge-sandboxes-${{ inputs.backend }}"

      - name: Run aci_edge_sandboxes lifecycle test on Windows
        if: runner.os == 'Windows' && !inputs.debug-kernel
        shell: powershell
        run: >-
          python scripts\nvx.py test-aci-edge-sandboxes
          --backend "${{ inputs.backend }}"
          --output-dir "build/test-results/aci-edge-sandboxes-${{ inputs.backend }}"

      - name: Upload NVX microVM failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nvx-microvm-tests-${{ inputs.backend }}${{ inputs.debug-kernel && '-debug' || '' }}
          path: |
            build/test-results/public-exec-${{ inputs.backend }}
            build/test-results/microvm-${{ inputs.backend }}
            build/test-results/microvm-${{ inputs.backend }}-debug
            build/test-results/ubuntu-${{ inputs.backend }}
            build/test-results/ubuntu-kvm-extended
            build/test-results/azurelinux-${{ inputs.backend }}
            build/test-results/aci-edge-sandboxes-${{ inputs.backend }}
          if-no-files-found: warn
