name: nvx-rs mutants

# Runs cargo-mutants on files of the nvx crate against the tests that the
# inputs select, so that two runs on the same files tell whether tests that
# replace a family of golden tests catch every mutant that the family catches
# (microsoft/nvx#722; doc/ci.md, "nvx-rs mutation testing"). It runs on demand,
# and on a small file for pushes that change it, never for pull requests, so no
# required check depends on it.
on:
  workflow_dispatch:
    inputs:
      files:
        description: >-
          Files to mutate: space-separated globs relative to nvx-rs, such as
          src/host/cli/sandbox/state.rs
        required: true
        type: string
      tests:
        description: >-
          Arguments of the test binaries that select the tests, such as
          host::sandbox:: or --skip NAME (default: every test)
        required: false
        default: ""
        type: string
      targets:
        description: >-
          Arguments of cargo test that select the test targets, such as --lib or
          --test cli (default: every target)
        required: false
        default: ""
        type: string
      os:
        description: Runner of the jobs
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
      shards:
        description: Number of jobs that share the mutants, from 1 to 16
        required: true
        default: "4"
        type: string
  push:
    paths:
      - .github/workflows/nvx-rs-mutants.yml

permissions:
  contents: read

# Dispatches with different inputs run side by side, and a push replaces the
# run of an earlier push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_MUTANTS_VERSION: 27.1.0

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.plan.outputs.files }}
      tests: ${{ steps.plan.outputs.tests }}
      targets: ${{ steps.plan.outputs.targets }}
      os: ${{ steps.plan.outputs.os }}
      shards: ${{ steps.plan.outputs.shards }}
      indexes: ${{ steps.plan.outputs.indexes }}
    steps:
      - name: Check the inputs and plan the shards
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILES: ${{ inputs.files }}
          TESTS: ${{ inputs.tests }}
          TARGETS: ${{ inputs.targets }}
          OS: ${{ inputs.os }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != workflow_dispatch ]]; then
            # A push that changes this workflow checks it on a small file.
            FILES=src/gpt/crc.rs TESTS=gpt::crc:: TARGETS=--lib OS=ubuntu-latest SHARDS=2
          fi
          for value in "${FILES}" "${TESTS}" "${TARGETS}"; do
            if [[ "${value}" == *[$'\n\r']* ]]; then
              echo "::error::Inputs are single lines."
              exit 1
            fi
          done
          if [[ -z "${FILES//[[:space:]]/}" ]]; then
            echo "::error::files names no file to mutate."
            exit 1
          fi
          case "${OS}" in
            ubuntu-latest | windows-latest) ;;
            *)
              echo "::error::os is ubuntu-latest or windows-latest."
              exit 1
              ;;
          esac
          if [[ ! "${SHARDS}" =~ ^([1-9]|1[0-6])$ ]]; then
            echo "::error::shards is a number from 1 to 16."
            exit 1
          fi
          {
            echo "files=${FILES}"
            echo "tests=${TESTS}"
            echo "targets=${TARGETS}"
            echo "os=${OS}"
            echo "shards=${SHARDS}"
            echo "indexes=[$(seq -s , 0 $((SHARDS - 1)))]"
          } >> "${GITHUB_OUTPUT}"

  mutants:
    name: mutants / shard ${{ matrix.index }}
    needs: plan
    runs-on: ${{ needs.plan.outputs.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.plan.outputs.indexes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust and cargo-mutants
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "${toolchain}"
          rustup toolchain install "${toolchain}" --profile minimal
          cargo "+${toolchain}" install --locked cargo-mutants \
            --version "${CARGO_MUTANTS_VERSION}"

      - name: Run cargo-mutants
        shell: bash
        working-directory: nvx-rs
        env:
          # --all-features enables `bundled`; stage nothing instead of downloading a release.
          NVX_BUNDLE: skip
          FILES: ${{ needs.plan.outputs.files }}
          TESTS: ${{ needs.plan.outputs.tests }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          SHARD: ${{ matrix.index }}/${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          read -r -a files <<< "${FILES}"
          read -r -a tests <<< "${TESTS}"
          read -r -a targets <<< "${TARGETS}"
          # In place, in this disposable checkout: the CLI's tests find the
          # repository that holds the crate, which a copy of the crate lacks.
          arguments=(--all-features --in-place --shard "${SHARD}" --output ../build/mutants)
          for file in "${files[@]}"; do
            arguments+=(--file "${file}")
          done
          # cargo-mutants creates only the last directory of its output.
          mkdir -p ../build/mutants
          status=0
          cargo mutants "${arguments[@]}" -- "${targets[@]}" -- "${tests[@]}" || status=$?
          # Statuses 2 and 3 report missed mutants and timeouts, which the
          # outcomes list.
          if (( status != 0 && status != 2 && status != 3 )); then
            exit "${status}"
          fi

      # A rerun of the job replaces the outcomes of its earlier attempt.
      - name: Upload the outcomes
        if: ${{ !cancelled() && hashFiles('build/mutants/mutants.out/outcomes.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-mutants-shard-${{ matrix.index }}-${{ github.run_id }}
          path: build/mutants/mutants.out
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  summarize:
    name: summarize
    needs: [plan, mutants]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The latest outcomes of each shard, also when an earlier attempt of the
      # run reported them.
      - name: Download the outcomes
        uses: actions/download-artifact@v8
        with:
          pattern: nvx-rs-mutants-shard-*-${{ github.run_id }}
          path: shards

      - name: Merge the outcomes of the shards
        shell: bash
        env:
          FILES: ${{ needs.plan.outputs.files }}
          TESTS: ${{ needs.plan.outputs.tests }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          OS: ${{ needs.plan.outputs.os }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(shards/*/)
          mkdir -p mutants
          for outcome in caught missed timeout unviable; do
            lists=()
            for shard in "${shards[@]}"; do
              if [[ -f "${shard}${outcome}.txt" ]]; then
                lists+=("${shard}${outcome}.txt")
              fi
            done
            if (( ${#lists[@]} )); then
              sort "${lists[@]}" > "mutants/${outcome}.txt"
            else
              : > "mutants/${outcome}.txt"
            fi
          done
          {
            echo "## nvx-rs mutants"
            echo
            echo "Files \`${FILES}\`, test arguments \`${TESTS:-(none)}\`, cargo test" \
              "arguments \`${TARGETS:-(none)}\`, on ${OS}: ${#shards[@]} of ${SHARDS}" \
              "shards reported."
            echo
            echo "| Outcome | Mutants |"
            echo "| --- | ---: |"
            for outcome in caught missed timeout unviable; do
              echo "| ${outcome} | $(wc -l < "mutants/${outcome}.txt") |"
            done
            if [[ -s mutants/missed.txt ]]; then
              echo
              echo "<details>"
              echo "<summary>Missed mutants</summary>"
              echo
              echo '```text'
              cat mutants/missed.txt
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if (( ${#shards[@]} != SHARDS )); then
            echo "::error::Only ${#shards[@]} of ${SHARDS} shards reported their outcomes."
            exit 1
          fi

      - name: Upload the merged outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-mutants-${{ github.run_id }}
          path: mutants
          if-no-files-found: error
          overwrite: true
          retention-days: 30
