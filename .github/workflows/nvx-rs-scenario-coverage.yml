name: nvx-rs scenario coverage

# Measures which host code of the nvx crate the KVM microVM scenarios and the
# runtime adapter's suite reach on Linux/KVM, alone and together with the
# crate's own tests, with scripts/nvx_rs_scenario_coverage.py (doc/ci.md,
# "nvx-rs scenario coverage"). It runs every week and on demand, never for
# pull requests, pushes, or merge groups, so no required check depends on it.
on:
  schedule:
    - cron: "41 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A run of a branch waits for the run before it to end rather than cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The scenarios boot the guest artifacts that the first job restores or
# builds, so nvx-rs must never replace missing ones with those of a release.
env:
  NVX_AUTO_DOWNLOAD: "0"

jobs:
  # The guest artifacts that the scenarios and the runtime adapter's suite
  # boot or read: the kernel, the Alpine initramfs, and the Ubuntu distro
  # layer with the sandbox scratch template, from the caches that CI's runs
  # save, or built, without saving them.
  artifacts:
    name: Guest artifacts
    if: github.repository == 'microsoft/nvx'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build guest artifacts
        uses: ./.github/actions/build-guest-artifacts
        with:
          components: kernel alpine ubuntu
          save-cache: "false"

      - name: Upload guest kernel
        uses: actions/upload-artifact@v7
        with:
          name: guest-kernel
          path: |
            build/vmlinux
            build/vmlinux.config
            build/vmlinux.provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Alpine initramfs
        uses: actions/upload-artifact@v7
        with:
          name: guest-alpine
          path: |
            build/initramfs.cpio.gz
            build/initramfs.cpio.gz.packages.json
            build/initramfs.provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Ubuntu distro layer
        uses: actions/upload-artifact@v7
        with:
          name: guest-ubuntu-distro
          path: |
            build/ubuntu-distro.erofs
            build/ubuntu-distro.erofs.manifest.json
            build/ubuntu-smoke-scratch.ext4
          if-no-files-found: error
          retention-days: 1

  measure:
    name: measure / Linux / KVM
    needs: artifacts
    runs-on: [self-hosted, linux, kvm, virtual-machine, general]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The OpenVMM of CI's KVM jobs, from the cache that CI's pushes to dev
      # save, or built.
      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}
          backend: kvm
          binary-path: openvmm/target/release/openvmm

      - name: Download guest kernel
        uses: actions/download-artifact@v8
        with:
          name: guest-kernel
          path: build

      - name: Download Alpine initramfs
        uses: actions/download-artifact@v8
        with:
          name: guest-alpine
          path: build

      - name: Download Ubuntu distro layer
        uses: actions/download-artifact@v8
        with:
          name: guest-ubuntu-distro
          path: build

      # Qualification verifies OpenVMM's time ABI preflight, as in CI's
      # microVM jobs.
      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: kvm
          verify-openvmm: "true"

      # The runner's setup installs the cargo-llvm-cov release that the setup
      # tool manifest pins, and the llvm-tools component of the Rust release
      # that rust-toolchain.toml pins, in a toolchain that the job can't
      # change.
      - name: Check the coverage tools
        shell: bash
        env:
          RUSTUP_AUTO_INSTALL: "0"
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^cargo_llvm_cov\.version=//p' \
            scripts/setup/tool-versions.conf)
          test -n "${expected}"
          if ! cargo llvm-cov --version 2>/dev/null |
            grep -Fxq "cargo-llvm-cov ${expected}"; then
            echo "::error::cargo-llvm-cov ${expected}, which scripts/setup/tool-versions.conf pins, is not installed; rerun scripts/setup/setup-linux.sh --runner-only" >&2
            exit 1
          fi
          if ! rustup component list --installed | grep -q '^llvm-tools-'; then
            echo "::error::the llvm-tools component of the Rust release that rust-toolchain.toml pins is not installed; rerun scripts/setup/setup-linux.sh --runner-only" >&2
            exit 1
          fi

      # A static musl executable that runs in the guest, which the
      # measurement doesn't instrument.
      - name: Build the runtime adapter's guest agent
        shell: bash
        working-directory: tests/runtime-adapter
        run: >-
          cargo build --locked --release --features guest
          --target x86_64-unknown-linux-musl --bin runtime-adapter-guest

      # The runner signals only a step's shell when the job is cancelled, so
      # the step execs the measurement, which then ends its runs and their
      # microVMs (doc/ci.md#cancellation). It fails when the measurement misses
      # something, after it writes the reports.
      - name: Measure
        shell: bash
        run: >-
          exec python3 scripts/nvx_rs_scenario_coverage.py
          --output build/nvx-rs-scenario-coverage
          --guest-agent tests/runtime-adapter/target/x86_64-unknown-linux-musl/release/runtime-adapter-guest

      - name: Write the summary
        if: ${{ !cancelled() && hashFiles('build/nvx-rs-scenario-coverage/summary.md') != '' }}
        shell: bash
        run: cat build/nvx-rs-scenario-coverage/summary.md >> "${GITHUB_STEP_SUMMARY}"

      # A rerun of the job replaces the reports of its earlier attempt.
      - name: Upload the reports
        if: ${{ !cancelled() && hashFiles('build/nvx-rs-scenario-coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-scenario-coverage-${{ github.run_id }}
          path: build/nvx-rs-scenario-coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 30
