name: Build OpenVMM binary

on:
  workflow_call:
    inputs:
      architecture:
        description: Native producer and executable architecture
        required: false
        type: string
        default: x86_64
      display-name:
        description: Platform name shown in the job list
        required: true
        type: string
      runner:
        description: JSON array of labels selecting the build runner
        required: true
        type: string
      backend:
        description: NVX backend provided by the build runner
        required: true
        type: string
      artifact:
        description: Base name for the executable and provenance artifacts
        required: true
        type: string
      binary:
        description: Normalized path to the OpenVMM executable
        required: true
        type: string
    secrets:
      OPENVMM_DEPLOY_KEY:
        description: SSH deploy key used to checkout OpenVMM
        required: true

permissions:
  contents: read

jobs:
  build:
    name: OpenVMM binary / ${{ inputs.display-name }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          architecture: ${{ inputs.architecture }}
          backend: ${{ inputs.backend }}

      - name: Prepare sccache
        uses: ./.github/actions/sccache
        with:
          operation: start

      - name: Build OpenVMM
        uses: ./.github/actions/build-openvmm
        with:
          architecture: ${{ inputs.architecture }}
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}
          backend: ${{ inputs.backend }}
          binary-path: ${{ inputs.binary }}

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache
        with:
          operation: stop

      - name: Download ARM profile admission guest artifacts
        if: runner.os == 'Windows' && inputs.architecture == 'aarch64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest-aarch64
          path: build/aarch64

      - name: Admit built ARM64 OpenVMM profile
        if: runner.os == 'Windows' && inputs.architecture == 'aarch64'
        uses: ./.github/actions/validate-runner
        with:
          architecture: aarch64
          backend: ${{ inputs.backend }}
          verify-openvmm: "true"

      - name: Upload OpenVMM executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}-executable
          path: ${{ inputs.binary }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Upload OpenVMM provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}-provenance
          path: build/openvmm.provenance.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1
