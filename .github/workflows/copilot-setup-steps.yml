name: "Copilot Setup Steps"

# Prepares the GitHub-hosted runner of Copilot cloud agent sessions, including
# sessions started from the GitHub web interface. The session time limit
# includes these steps, so they only install pinned tools, restore CI caches,
# and stage downloads that the agent firewall blocks; they never compile NVX or
# OpenVMM. Copilot skips the remaining steps after a failed step, so optional
# steps warn instead of failing. Copilot code review uses copilot-code-review.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/build-guest-artifacts/action.yml
      - .github/actions/check-aci-edge-sandboxes/action.yml
      - .github/actions/check-quality/action.yml
      - scripts/setup/setup-linux-runner.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Copilot only recognizes a job with this exact name.
  copilot-setup-steps:
    name: Copilot Setup Steps
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Some runner types have a small root disk and a separate, larger /mnt
      # disk. Mount the workspace there so OpenVMM, crate, and guest build
      # outputs cannot exhaust /.
      - name: Place the workspace on the largest disk
        shell: bash
        run: |
          set -euo pipefail
          available_gib() {
            df --output=avail -k "$1" | awk 'NR == 2 { print int($1 / 1048576) }'
          }
          root_gib=$(available_gib /)
          scratch_gib=0
          if [[ -d /mnt && "$(stat -c %d /mnt)" != "$(stat -c %d /)" ]]; then
            scratch_gib=$(available_gib /mnt)
          fi
          echo "Free space: / ${root_gib} GiB, separate /mnt ${scratch_gib} GiB"
          if (( scratch_gib > root_gib )); then
            workspace=/mnt/nvx-workspace
            sudo mkdir -p "${workspace}"
            sudo chown "$(id -u):$(id -g)" "${workspace}"
            mkdir -p "${GITHUB_WORKSPACE}"
            cp -a "${GITHUB_WORKSPACE}/." "${workspace}/"
            sudo mount --bind "${workspace}" "${GITHUB_WORKSPACE}"
            echo "Mounted ${workspace} at ${GITHUB_WORKSPACE}"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.7
        with:
          version: v0.88.7

      # The OpenVMM submodule is public, so it needs no deploy key here.
      - name: Initialize the OpenVMM submodule
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git -c protocol.version=2 submodule update --init --depth 1 -- openvmm; then
              break
            fi
            if (( attempt == 3 )); then
              exit 1
            fi
            sleep $(( attempt * 10 ))
          done
          git -C openvmm log -1 --format='OpenVMM %H %s'

      # Read the versions that CI and the runner bootstrap pin, so this
      # environment follows their updates.
      - name: Resolve pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          python=$(sed -n 's/^ *python-version: "\(.*\)"$/\1/p' \
            .github/actions/check-quality/action.yml)
          crate_toolchain=$(sed -n '/^  toolchain:/,/^  [^ ]/ s/^    default: "\(.*\)"$/\1/p' \
            .github/actions/check-aci-edge-sandboxes/action.yml)
          crate_msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' aci_edge_sandboxes/Cargo.toml)
          nextest=$(sed -n 's/^CARGO_NEXTEST_VERSION=//p' scripts/setup/setup-linux-runner.sh)
          for value in "${python}" "${crate_toolchain}" "${crate_msrv}" "${nextest}"; do
            test -n "${value}"
          done
          {
            echo "python=${python}"
            echo "crate-toolchain=${crate_toolchain}"
            echo "crate-msrv=${crate_msrv}"
            echo "nextest=${nextest}"
          } | tee -a "${GITHUB_OUTPUT}"

      # OpenVMM builds with stable plus its guest, UEFI, and musl targets. The
      # aci_edge_sandboxes checks use the MXC toolchain, the crate MSRV, and a
      # macOS target. OpenVMM keeps full debug info in release builds, so the
      # session limits debug info and disables incremental artifacts to save
      # disk space and link time.
      - name: Install Rust toolchains
        shell: bash
        env:
          CRATE_TOOLCHAIN: ${{ steps.versions.outputs.crate-toolchain }}
          CRATE_MSRV: ${{ steps.versions.outputs.crate-msrv }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt \
            --target x86_64-unknown-linux-musl,x86_64-unknown-none,x86_64-unknown-uefi
          rustup default stable
          rustup toolchain install "${CRATE_TOOLCHAIN}" --profile minimal \
            --component clippy,rustfmt --target aarch64-apple-darwin
          rustup toolchain install "${CRATE_MSRV}" --profile minimal
          rustup toolchain list
          {
            echo "CARGO_INCREMENTAL=0"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only"
          } >> "${GITHUB_ENV}"

      - name: Install cargo-nextest
        shell: bash
        env:
          NEXTEST_VERSION: ${{ steps.versions.outputs.nextest }}
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
          mkdir -p "${cargo_bin}"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar -xzf - -C "${cargo_bin}"
          cargo nextest --version

      - name: Grant KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::notice::/dev/kvm is unavailable; hypervisor-backed tests must run in CI"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-nvx-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
          ls -l /dev/kvm
          if ! grep -qw nonstop_tsc /proc/cpuinfo; then
            echo "::notice::The host CPU has no invariant TSC; snapshot restore tests may be unstable"
          fi

      - name: Restore guest artifacts built by CI
        uses: ./.github/actions/build-guest-artifacts
        with:
          restore-only: "true"

      # CI saves OpenVMM binaries from self-hosted runners whose cache steps
      # only see GNU tar and gzip. Restoring needs the same compression method.
      - name: Prepare OpenVMM cache restore
        id: openvmm-cache
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          {
            echo "path=${cache_tools}"
            echo "sha=$(git rev-parse :openvmm)"
          } >> "${GITHUB_OUTPUT}"

      # The key and paths must match the build-openvmm action's KVM binary cache.
      - name: Restore the OpenVMM binary built by CI
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env:
          PATH: ${{ steps.openvmm-cache.outputs.path }}
        with:
          path: |
            build/openvmm.provenance.json
            openvmm/target/release/openvmm
          key: openvmm-binary-v6-kvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm-cache.outputs.sha }}

      # The agent firewall blocks cdn.kernel.org, so stage the pinned archive
      # where native kernel builds look for it.
      - name: Download the pinned Linux source archive
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from nvx_tools.build_constants import BuildConstants, KernelBuildConstants
          from nvx_tools.common import cache_root, download_verified

          download_verified(
              KernelBuildConstants.URL,
              cache_root()
              / BuildConstants.DOWNLOAD_DIRECTORY_NAME
              / KernelBuildConstants.UPSTREAM_ARCHIVE_NAME,
              KernelBuildConstants.SHA256,
          )
          PY
          then
            echo "::warning::Could not stage the Linux source archive"
          fi

      - name: Pull the pinned shell linter images
        shell: bash
        run: |
          set -euo pipefail
          images=$(grep -Eo '(koalaman/shellcheck-alpine|mvdan/shfmt)@sha256:[0-9a-f]{64}' \
            .github/actions/check-quality/action.yml | sort -u)
          for image in ${images}; do
            if ! docker pull --quiet "${image}"; then
              echo "::warning::Could not pull ${image}"
            fi
          done

      # If the pinned Python cannot be installed, for example after a runner
      # image upgrade, the next step falls back to the image's Python.
      - name: Set up Python
        id: python
        continue-on-error: true
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.versions.outputs.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Pyright downloads its language server on first use; do that here too.
      - name: Install Python development tools
        shell: bash
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: |
          set -euo pipefail
          if [[ "${PYTHON_OUTCOME}" != success ]]; then
            echo "::warning::The pinned Python is unavailable; using $(python3 --version)"
          fi
          venv="${HOME}/.venv/nvx"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --requirement requirements-dev.txt
          "${venv}/bin/python" -m ruff --version
          "${venv}/bin/python" -m pyright --version
          echo "${venv}/bin" >> "${GITHUB_PATH}"

      - name: Verify and summarize the environment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nvx.py verify
          openvmm=openvmm/target/release/openvmm
          if [[ -f "${openvmm}" ]] && ! "${openvmm}" --help > /dev/null 2>&1; then
            echo "::warning::The cached OpenVMM binary does not run here; removing it"
            rm -f "${openvmm}" build/openvmm.provenance.json
          fi

          present() {
            if [[ -e "$1" ]]; then echo yes; else echo no; fi
          }
          kvm=no
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            kvm=yes
          fi
          echo "NVX_COPILOT_SETUP=complete" >> "${GITHUB_ENV}"
          {
            echo "### NVX Copilot environment"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| CPUs / memory | $(nproc) / $(free -g | awk '/^Mem:/ { print $2 }') GiB |"
            echo "| Workspace free space | $(df -h --output=avail . | tail -n 1 | tr -d ' ') |"
            echo "| KVM access | ${kvm} |"
            echo "| Guest kernel / Alpine initramfs | $(present build/vmlinux) / $(present build/initramfs.cpio.gz) |"
            echo "| Ubuntu initramfs / distro layer | $(present build/initramfs-ubuntu.cpio.gz) / $(present build/ubuntu-distro.erofs) |"
            echo "| Azure Linux initramfs | $(present build/initramfs-azurelinux.cpio.gz) |"
            echo "| OpenVMM binary for the pinned revision | $(present "${openvmm}") |"
            echo "| Rust | $(rustc --version) |"
            echo "| Python | $(python3 --version) |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
