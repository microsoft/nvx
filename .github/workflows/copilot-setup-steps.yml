name: "Copilot Setup Steps"

# Prepares the GitHub-hosted runner of Copilot cloud agent sessions, including
# sessions started from the GitHub web interface. The session time limit
# includes these steps, so they only install pinned tools, restore CI caches,
# and stage downloads that the agent firewall blocks; they never compile NVX or
# OpenVMM. Copilot code review uses copilot-code-review.yml instead.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/build-guest-artifacts/action.yml
      - .github/actions/check-aci-edge-sandboxes/action.yml
      - .github/actions/check-quality/action.yml
      - scripts/setup/setup-linux-runner.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Copilot only recognizes a job with this exact name.
  copilot-setup-steps:
    name: Copilot Setup Steps
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # OpenVMM, Rust crate, and Docker guest builds need tens of gigabytes. The
      # hosted runner's separate /mnt disk usually has more free space than /,
      # so mount the workspace and the Docker data root there before checkout.
      - name: Move build storage to the largest disk
        shell: bash
        run: |
          set -euo pipefail
          # TEMPORARY DIAGNOSTICS
          nproc; free -h; lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT || true
          df -h; ls -l /dev/kvm || true
          grep -m1 -ow nonstop_tsc /proc/cpuinfo || echo "no nonstop_tsc"
          docker info --format 'driver={{.Driver}} root={{.DockerRootDir}} version={{.ServerVersion}} {{.DriverStatus}}' || true
          sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo cat /etc/docker/daemon.json || true
          echo "CARGO_HOME=${CARGO_HOME:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          du -sh ~/.cargo ~/.rustup 2>/dev/null || true
          rustup toolchain list || true
          # END TEMPORARY DIAGNOSTICS
          available_gib() {
            df --output=avail -k "$1" | awk 'NR == 2 { print int($1 / 1048576) }'
          }
          root_gib=$(available_gib /)
          scratch_gib=0
          if [[ -d /mnt && "$(stat -c %d /mnt)" != "$(stat -c %d /)" ]]; then
            scratch_gib=$(available_gib /mnt)
          fi
          echo "Free space: / ${root_gib} GiB, /mnt ${scratch_gib} GiB"
          if (( scratch_gib <= root_gib )); then
            echo "Keeping build storage on /"
            exit 0
          fi

          storage=/mnt/nvx
          sudo mkdir -p "${storage}/workspace" "${storage}/docker"
          sudo chown "$(id -u):$(id -g)" "${storage}/workspace"
          mkdir -p "${GITHUB_WORKSPACE}"
          cp -a "${GITHUB_WORKSPACE}/." "${storage}/workspace/"
          sudo mount --bind "${storage}/workspace" "${GITHUB_WORKSPACE}"

          daemon_config=/etc/docker/daemon.json
          original_config=$(mktemp)
          if sudo test -s "${daemon_config}"; then
            sudo cp "${daemon_config}" "${original_config}"
          else
            echo '{}' > "${original_config}"
          fi
          jq --arg root "${storage}/docker" '. + {"data-root": $root}' \
            "${original_config}" | sudo tee "${daemon_config}" > /dev/null
          if ! sudo systemctl restart docker || ! docker info > /dev/null 2>&1; then
            echo "::warning::Docker could not use ${storage}/docker; restoring its default data root"
            sudo cp "${original_config}" "${daemon_config}"
            sudo systemctl restart docker
          fi
          echo "Docker data root: $(docker info --format '{{.DockerRootDir}}')"
          df -h / /mnt

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.7
        with:
          version: v0.88.7

      # The OpenVMM submodule is public, so it needs no deploy key here.
      - name: Initialize the OpenVMM submodule
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git -c protocol.version=2 submodule update --init --depth 1 -- openvmm; then
              break
            fi
            if (( attempt == 3 )); then
              exit 1
            fi
            sleep $(( attempt * 10 ))
          done
          git -C openvmm log -1 --format='OpenVMM %H %s'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Pyright downloads its language server on first use; do that here.
      - name: Install Python development tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-dev.txt
          python -m ruff --version
          python -m pyright --version

      # OpenVMM builds with stable plus its guest, UEFI, and musl targets. The
      # aci_edge_sandboxes checks use the MXC toolchain, its MSRV, and macOS.
      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          crate_toolchain=$(sed -n '/^  toolchain:/,/^  [^ ]/ s/^    default: "\(.*\)"$/\1/p' \
            .github/actions/check-aci-edge-sandboxes/action.yml)
          crate_msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' aci_edge_sandboxes/Cargo.toml)
          test -n "${crate_toolchain}"
          test -n "${crate_msrv}"
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt \
            --target x86_64-unknown-linux-musl,x86_64-unknown-none,x86_64-unknown-uefi
          rustup default stable
          rustup toolchain install "${crate_toolchain}" --profile minimal \
            --component clippy,rustfmt --target aarch64-apple-darwin
          rustup toolchain install "${crate_msrv}" --profile minimal
          rustup toolchain list

      - name: Install cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^CARGO_NEXTEST_VERSION=//p' scripts/setup/setup-linux-runner.sh)
          test -n "${version}"
          cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
          mkdir -p "${cargo_bin}"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://get.nexte.st/${version}/linux" | tar -xzf - -C "${cargo_bin}"
          cargo nextest --version

      - name: Grant KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::notice::/dev/kvm is unavailable; hypervisor-backed tests must run in CI"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-nvx-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
          ls -l /dev/kvm
          if ! grep -qw nonstop_tsc /proc/cpuinfo; then
            echo "::notice::The host CPU has no invariant TSC; snapshot restore tests may be unstable"
          fi

      - name: Restore guest artifacts built by CI
        uses: ./.github/actions/build-guest-artifacts
        with:
          restore-only: "true"

      # CI saves OpenVMM binaries from self-hosted runners whose cache steps
      # only see GNU tar and gzip. Restoring needs the same compression method.
      - name: Prepare OpenVMM cache restore
        id: openvmm-cache
        shell: bash
        run: |
          set -euo pipefail
          cache_tools="${RUNNER_TEMP}/nvx-gzip-cache-tools"
          mkdir -p "${cache_tools}"
          ln -sf "$(command -v tar)" "${cache_tools}/tar"
          ln -sf "$(command -v gzip)" "${cache_tools}/gzip"
          {
            echo "path=${cache_tools}"
            echo "sha=$(git rev-parse :openvmm)"
          } >> "${GITHUB_OUTPUT}"

      # The key and paths must match the build-openvmm action's KVM binary cache.
      - name: Restore the OpenVMM binary built by CI
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env:
          PATH: ${{ steps.openvmm-cache.outputs.path }}
        with:
          path: |
            build/openvmm.provenance.json
            openvmm/target/release/openvmm
          key: openvmm-binary-v6-kvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.openvmm-cache.outputs.sha }}

      # The agent firewall blocks cdn.kernel.org, so stage the pinned archive
      # where native kernel builds look for it.
      - name: Download the pinned Linux source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from nvx_tools.build_constants import BuildConstants, KernelBuildConstants
          from nvx_tools.common import cache_root, download_verified

          download_verified(
              KernelBuildConstants.URL,
              cache_root()
              / BuildConstants.DOWNLOAD_DIRECTORY_NAME
              / KernelBuildConstants.UPSTREAM_ARCHIVE_NAME,
              KernelBuildConstants.SHA256,
          )
          PY

      - name: Pull the pinned shell linter images
        shell: bash
        run: |
          set -euo pipefail
          grep -Eo '(koalaman/shellcheck-alpine|mvdan/shfmt)@sha256:[0-9a-f]{64}' \
            .github/actions/check-quality/action.yml | sort -u |
            while read -r image; do
              docker pull --quiet "${image}"
            done

      - name: Verify and summarize the environment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nvx.py verify
          openvmm=openvmm/target/release/openvmm
          if [[ -f "${openvmm}" ]] && ! "${openvmm}" --help > /dev/null 2>&1; then
            echo "::warning::The cached OpenVMM binary does not run here; removing it"
            rm -f "${openvmm}" build/openvmm.provenance.json
          fi

          present() {
            if [[ -e "$1" ]]; then echo yes; else echo no; fi
          }
          kvm=no
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            kvm=yes
          fi
          {
            echo "CARGO_INCREMENTAL=0"
            echo "NVX_COPILOT_SETUP=complete"
          } >> "${GITHUB_ENV}"
          {
            echo "### NVX Copilot environment"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| CPUs / memory | $(nproc) / $(free -g | awk '/^Mem:/ { print $2 }') GiB |"
            echo "| Workspace free space | $(df -h --output=avail . | tail -n 1 | tr -d ' ') |"
            echo "| Root free space | $(df -h --output=avail / | tail -n 1 | tr -d ' ') |"
            echo "| KVM access | ${kvm} |"
            echo "| Guest kernel and Alpine initramfs | $(present build/vmlinux) / $(present build/initramfs.cpio.gz) |"
            echo "| Ubuntu initramfs and distro layer | $(present build/initramfs-ubuntu.cpio.gz) / $(present build/ubuntu-distro.erofs) |"
            echo "| OpenVMM binary for the pinned revision | $(present "${openvmm}") |"
            echo "| Rust | $(rustc --version) |"
            echo "| Python | $(python3 --version) |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          # TEMPORARY DIAGNOSTICS
          df -h
          du -sh ~/.cargo ~/.rustup ~/.cache 2>/dev/null || true
          sudo du -sh /var/lib/docker /var/lib/containerd /mnt/nvx/docker 2>/dev/null || true
          ls -la build openvmm/target/release 2>/dev/null || true
          # END TEMPORARY DIAGNOSTICS
