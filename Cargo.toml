[package]
name = "microvm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimal x86_64 micro-VM that boots a Linux (Alpine) kernel via the PVH boot protocol from a RAM initramfs."

[[bin]]
name = "microvm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2.186"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
vmm-sys-util = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
# Pure-Rust FAT builder for the WHP virt-fs image (no host mke2fs/mksquashfs needed). Timestamps
# (the `chrono` default feature and its dependency tree) are not needed, so keep only std + LFN.
fatfs = { version = "0.3.6", default-features = false, features = [
    "std",
    "alloc",
] }
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_HostCompute",
    "Win32_System_HostComputeNetwork",
    "Win32_System_HostComputeSystem",
    "Win32_System_Hypervisor",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
