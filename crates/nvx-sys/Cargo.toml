# The OS layer that NVX's crates share. CI publishes it before nvx, which
# requires it at exactly their shared version (doc/ci.md, "crates.io releases").
[package]
name = "nvx-sys"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.89"
description = "The OS layer that NVX's crates share, with no stability guarantee"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
publish = ["crates-io"]

[lints]
workspace = true

[features]
# The helpers that the tests of nvx's guest modules use, which nvx enables as a development
# dependency.
test-support = []

# The first modules that move here, the guest's descriptor and socket
# primitives, call nix with these features.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = [
    "feature",
    "fs",
    "net",
    "poll",
    "socket",
    "uio",
] }

# The tests of those modules.
[dev-dependencies]
tempfile = "3.10"
