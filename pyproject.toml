[tool.pyright]
include = ["scripts"]
# The scripts import each other from scripts/, which they put first on sys.path, so that
# `import nvx` is scripts/nvx.py, not the crate's nvx/ directory.
extraPaths = ["scripts"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# `nvx` is scripts/nvx.py, which sorts with the scripts' other modules, not the crate's nvx/
# directory.
known-third-party = ["nvx"]
